ere in the document the field was found — so rejections can be correlated with the actual characteristics of the input that produced them"],[3],"Logging the characteristics of the input alongside each extraction (scan quality, page count, where in the document a field was found, vendor format) makes it possible to correlate rejections with their causes and prioritize fixes. A UUID or manual sampling alone can't show those patterns.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q1","Your resolution agent must check customer account status and recent order history before acting on a case. The two lookups have no ordering dependency on each other, but the coordinator currently dispatches them as two sequential subagent calls, and high case volume is making that round-trip latency a real bottleneck. What's the most effective fix?",["Increase `max_tokens` so each lookup resolves faster","Emit both `Task` calls within a single coordinator response so the two subagents run concurrently, then collect both results before proceeding","Add a batching layer that packs multiple subagent invocations into one API request","Merge both lookups into a single combined subagent that performs both investigations in one turn"],[1],"Emitting both `Task` calls in one coordinator response is what runs the two subagents concurrently. Merging them into one subagent loses the separation of concerns, and max_tokens or a batching layer doesn't change the sequential dispatch.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[5,0,"Mock exam 6 · Q3","A customer disputes charges across three orders plus one account-level adjustment, requesting a $620 total refund. An initial lookup surfaces all four transaction amounts. After two subagents separately investigate return eligibility and account reconciliation, the synthesis step produces a final recommendation of \"approve $105\" — referencing the adjustment but dropping the three order amounts entirely, even though both subagents' own outputs were correct and complete. What's the most direct fix?",["Increase the context window so intermediate results never need to be summarized","Maintain a persistent \"case facts\" block (each transaction ID and amount) carried alongside every prompt, outside the part of the conversation that gets condensed into a narrative summary","Re-run both subagent investigations at a higher temperature for more thorough coverage","Have the customer restate all four disputed amounts before the agent finalizes anything"],[1],"A persistent case-facts block carried outside the part of the conversation that gets condensed is what keeps specific numbers (each transaction ID and amount) from disappearing during synthesis, which is exactly what happened here.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[1,0,"Mock exam 6 · Q4","Your single general-purpose resolution agent handles returns, billing disputes, and account-security cases, with access to every relevant tool across all three areas. First-contact resolution varies sharply by category: returns succeed 88% of the time, billing disputes only 59%, and account-security cases are occasionally escalated based on insufficient identity verification depth. What's the most effective structural fix?",["Keep one general agent, but add 15+ few-shot examples spanning all three case types","Give the single agent even more tools, including advanced financial-analysis and multi-factor-auth capabilities","Split the system into three fully separate backend services, one per case type, with no shared coordinator at all","Introduce a lightweight intake step that classifies each case and routes it to a specialized subagent per category (returns, billing, security), each scoped to only the tools relevant to its own case type"],[3],"Routing each case to a specialized subagent scoped to its own category's tools addresses the uneven performance across very different case types, without making any single agent's tool set or prompt bigger.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q5","`escalate_to_human` is meant to always carry structured context (customer ID, root cause, attempted actions), and the system prompt says so explicitly and emphatically. Logs still show a meaningful share of escalations going out with minimal or blank context, and the coordinator doesn't stop them. What's the most direct, deterministic fix?",["Add a hook that inspects the call after the fact and flags escalations with thin context for follow-up","Split `escalate_to_human` into two separate tools, one for routine escalations and one for emergencies","Make the system-prompt wording even stronger and more emphatic","Define `escalate_to_human`'s input schema so `customer_id`, `root_cause`, and `attempted_actions` are required parameters the call cannot be made without"],[3],"Making the fields required parameters in the tool's own input schema means the call cannot be made without them, a deterministic guarantee that stronger prompt wording can't give. An after-the-fact hook only flags the problem once it has happened.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q10","A complex billing dispute has two defensible outcomes given the exact same underlying facts (verified identity, order history, account status): a strict-policy calculation of $280, and a goodwill-exception calculation of $420. You want to reason through both paths independently — without one path's assumptions contaminating the other — but re-verifying the same facts from scratch in two completely separate sessions wastes backend calls and risks the two paths ending up with subtly inconsistent fact bases. What approach best threads this needle?",["Run two entirely independent fresh sessions for the two paths, accepting the duplicated backend calls and the risk of drifting fact bases as an unavoidable cost","Have the agent keep detailed written notes and re-read them each time it switches between the two paths","Stay in one session and add explicit labels at each step noting which path is currently being reasoned about","Branch into two isolated sessions from the same already-verified shared fact base, explore each path independently within its own branch, then bring both conclusions back together for a final recommendation"],[3],"Branching from an already-verified shared fact base into two isolated explorations avoids both cross-contamination between the paths (which one shared session risks) and the duplicated, possibly inconsistent verification that two fresh sessions would cause.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q11","Your `.claude/settings.json` has a `PreToolUse` hook matching the `Write` tool that runs a validation script — it exits 0 for a valid file and exits 2 (with the reason on stderr) for an invalid one. A developer's edit would produce a configuration file that fails that validation. What happens?",["The file is written first, and the validation failure is only reported afterward","The write is blocked outright — the hook's exit code 2 prevents the tool call from executing and feeds the stderr reason back to Claude","The hook only applies to `Bash`-style commands, so a `Write` call bypasses it entirely","The write proceeds regardless, since hooks are advisory rather than enforced"],[1],"For `PreToolUse`, exit code 2 is the blocking signal: the tool call never executes and stderr is returned to Claude as the reason. Hooks are enforced, not advisory, and a `Write` matcher applies to Write calls. Note that only exit code 2 (or a JSON deny decision) blocks; any other non-zero exit is a non-blocking error and the write would go ahead.\nUpdated 2026-11-03: reworded: per hooks docs only exit code 2 (or a JSON deny) blocks a tool call; other non-zero codes are non-blocking.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[3,0,"Mock exam 6 · Q12","A convention needs to apply consistently to API-related code scattered across several unrelated directory trees, not confined to one folder. A developer creates `.claude/rules/api-validation.md` with `paths: [\"src/api/**\", \"lib/api/**\"]`. Later, new code is added under `server/api/handlers/`. Does the existing rule apply there?",["Yes, but only once the new files have been committed to version control","No, because rules never apply to any directory that didn't exist when the rule file was first created","No — `src/api/**` and `lib/api/**` only match those two specific directory trees; a path like `server/api/**` needs to be added explicitly (or a broader pattern like `**/api/**` used instead)","Yes — the presence of \"api\" anywhere in a path is enough to match"],[2],"Glob patterns are literal path matches: `src/api/**` and `lib/api/**` only cover those two trees, so a new directory like `server/api/` needs to be added explicitly, or covered with a broader pattern such as `**/api/**`.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q13","A skill at `.claude/skills/design-phase/SKILL.md` uses `context: fork` to keep a long back-and-forth about architecture options out of the main conversation, and returns a final structured proposal as its result. Does the main session also retain the intermediate questions, dead ends, and exploratory reasoning that happened inside that fork?",["Only if the skill happens to summarize its own reasoning as part of that final output","Yes — `context: fork` only changes what's displayed; all the underlying reasoning is still part of the session","No — the fork's exploratory reasoning stays isolated to keep the main session's context clean; only the final result the skill actually returns comes back","Yes, but only after a manual step re-merges the fork's context into the main thread"],[2],"`context: fork` exists to keep a skill's exploratory reasoning out of the main session's context. Only the final result the skill returns comes back, not the intermediate questions or dead ends.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q14","A task is described simply as \"remove unused dependencies from `package.json` and update three import statements.\" On investigation, it turns out this actually means reconciling 15 separate package removals with genuinely competing priorities from eight different teams that depend on different subsets of them. Given that complexity, what's the more appropriate approach?",["Direct execution, switching to plan mode only if something unexpected comes up along the way","Plan mode — the real work here is resolving competing priorities and removal order across teams, which is a design question that benefits from being worked out before any file gets touched","Direct execution — dependency removal is inherently a simple, mechanical task","Neither — this specific kind of cross-team coordination is out of scope for Claude Code entirely"],[1],"Once the task turns out to involve reconciling competing priorities across eight teams, it is a design question, which is what plan mode is for. Work out the removal order and trade-offs before touching files, then execute.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q15","A `/generate-tests` skill produces new test files with a lot of repeated boilerplate — fixture setup, mock definitions, assertion patterns — duplicated nearly identically across runs. Re-invoking it with an added instruction to \"avoid boilerplate\" doesn't change the output. What's the most direct fix?",["Include the team's existing test files as context, and document the available fixtures and standard assertion patterns the team already has in `CLAUDE.md`","Add one \"good\" example test at the very start of the prompt as a single few-shot example","Increase `max_tokens` so the skill has more room to vary its output","Decrease `max_tokens` to force shorter, simpler generated tests"],[0],"Giving the model the team's existing tests as context, and documenting the available fixtures and assertion patterns in CLAUDE.md, gives it concrete patterns to reuse instead of generating fresh boilerplate each time.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q16","A `validateUser` function needs three interdependent checks: the user must be active, must have an assigned role, and that role must pass a whitelist. Across two separate attempts at implementing this, Claude structures the interaction between the three checks differently each time — once checking all three independently, once only checking the role if the user is already active. What's the most effective way to pin down the exact intended behavior?",["Repeat the requirement more forcefully: \"make sure all three conditions are checked consistently\"","Provide a small test suite covering every meaningful combination (active/inactive × role-present/missing × role-valid/invalid) and share the actual failures after each attempt","Ask Claude to \"be more careful about edge cases this time\"","Generate five separate attempts and manually pick whichever looks best"],[1],"A small test suite covering every meaningful combination of the three interdependent conditions, with the actual failures shared back after each attempt, pins down the intended behavior far better than repeating the requirement more forcefully.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[1,0,"Mock exam 6 · Q21","A research coordinator runs a fixed pipeline — search, then analyze, then synthesize, then report — with no step in between that re-evaluates whether coverage is actually adequate. On topically broad requests (e.g., \"AI regulation across multiple jurisdictions\"), the resulting reports keep coming back with real regional gaps, even though every individual subagent completed its assigned piece without error. What architectural change addresses this?",["Simply increase the number of initial parallel search queries at the start","After synthesis, have the coordinator evaluate whether real coverage gaps remain and, if so, conditionally spawn targeted follow-up searches before finalizing the report","Let each subagent decide on its own whether to spawn additional follow-up investigations","Give the search subagent access to more search tools so it can generate extra results upfront"],[1],"An explicit coverage check after synthesis, with conditional follow-up searches only where real gaps remain, lets the pipeline adapt to what it actually found. More initial queries or more tools still leave no step that notices gaps.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q22","A coordinator runs three subagents in parallel — web search, document analysis, and source synthesis — then passes all three outputs into a single, very long block of text for a final synthesis pass. The resulting report draws heavily on the search and document-analysis findings, but almost never references the source-synthesis subagent's output, even though that subagent completed successfully and returned substantive material. What's the most likely cause?",["The third subagent's findings ended up buried in the middle of a very long combined prompt, with nothing structurally marking them as important, so they got less attention than the material at the start and end","The third subagent's output was never actually included in what was sent to the final synthesis step","The document-analysis subagent's output silently overwrote the third subagent's data before synthesis ran","A separate follow-up turn is required before synthesis can incorporate a third input source"],[0],"When several subagents' outputs are concatenated into one very long prompt with nothing marking what matters, material buried in the middle gets less attention than material at the start and end (the 'lost in the middle' effect). Structure the input with headers and put key findings first.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q24","A coordinator delegates \"research recent regulatory changes on topic X\" to one subagent and \"research historical precedent for topic X\" to a second subagent. It reuses a prompt template originally written for the precedent task — including the line \"ground every finding in established historical patterns and prior precedent\" — and only swaps the topic phrase. The \"recent changes\" report keeps citing \"established historical patterns\" and \"prior precedent,\" despite being meant to cover recent developments only. What's the most likely cause?",["The coordinator's own system prompt wasn't specific enough to keep the two request types apart","The two subagents share some kind of common memory pool that lets findings bleed between them","The two delegations should have run sequentially instead of in parallel","The reused template's own precedent-focused instructions; a subagent's only input from the coordinator is its prompt, so the recent-changes subagent faithfully follows that wording — write a task-specific prompt with explicit scope"],[3],"Subagents share no memory: each starts fresh, and the only content passed from parent to subagent is the Agent tool's prompt string. So the precedent language in the recent-changes report comes from the prompt itself. Running the delegations sequentially or rewording the coordinator's system prompt wouldn't remove that instruction; a task-specific prompt with explicit scope does.\nUpdated 2026-11-03: rewritten: per subagent docs the prompt string is the only context passed, so the bleed is traced to concrete template wording instead of undocumented 'thematic association'.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q25","In a coordinator's pipeline, the report-generation subagent is meant to run only after the synthesis subagent has returned its findings — but the pipeline itself has no runtime mechanism enforcing that order, only an implicit assumption. During testing, report generation occasionally starts before synthesis has actually completed, producing polished-looking sections with citations that can't be verified against anything synthesis was supposed to have vetted. What's the most reliable way to prevent this?",["Add explicit ordering language to both subagents' own system prompts","Add a hook on the coordinator's dispatch step that blocks a report-generation call from proceeding until synthesis's result is actually present","Add several few-shot examples showing the two steps happening in the correct order","Increase the coordinator's context window so it \"remembers\" the intended order better"],[1],"A hook that blocks the report-generation dispatch until synthesis's result exists enforces the order deterministically. Ordering language in prompts, few-shot examples or a bigger context window only make the right order more likely.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[1,0,"Mock exam 6 · Q29","A document-analysis subagent hits transient errors (timeouts, rate limits) reasonably often, and the coordinator's current policy is simply \"retry once, then fail the whole run.\" As a result, roughly 8–10% of research runs fail outright because of one subagent's temporary hiccup. What's a more effective error-recovery design here?",["Retry every subagent indefinitely until it eventually succeeds, no matter how long that takes","Use a graduated retry policy with exponential backoff (e.g., 100ms, then 500ms, then 2s) up to a small fixed attempt limit, and only then escalate or continue with a documented partial result","Remove retries entirely and fail the run immediately on the very first transient error","Always escalate any transient error straight to a human without attempting any recovery first"],[1],"A graduated retry policy with backoff and a small attempt limit handles the middle ground between giving up too easily and retrying forever. It gives genuinely transient errors a chance to clear, then escalates or continues with a documented partial result.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[2,0,"Mock exam 6 · Q31","A code-search MCP tool intermittently returns timeouts, but the agent has no way to tell whether a retry is likely to help or whether the underlying query itself is simply malformed — every failure comes back as `{\"isError\": true, \"message\": \"Operation failed\"}`. As a result, the agent sometimes retries a hopeless malformed query indefinitely, and sometimes gives up too early on a call that would have succeeded with one more attempt. What's the most direct fix?",["Add an internal timeout to the tool itself so it fails faster on every kind of error","Remove the tool and have the agent fall back to `Grep` instead","Add a system-prompt instruction telling the agent to \"always retry timeouts, never retry validation errors\"","Add `errorCategory` (e.g. \"transient\" vs. \"validation\") and an `isRetryable` boolean to the tool's error responses, so the agent has an actual basis for deciding whether to retry"],[3],"An `errorCategory` plus an `isRetryable` flag gives the agent a real signal to reason from instead of treating every failure the same, which is what makes it retry hopeless queries and give up on recoverable ones.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q32","A `list_available_migrations` MCP tool returns a catalog of known database migrations. An agent calls it near the start of nearly every migration-related task just to see what's available, before doing any real analysis — an extra round-trip each time for content that's largely static within a session. What's the most efficient fix?",["Remove the tool from the agent's available tools and require the migration to be named explicitly upfront in every request","Expose the available migrations as an MCP **resource** the agent can read directly, without spending a tool-call decision on pure discovery","Merge every migration-related tool into one larger, more general tool","Cache the tool's result in `CLAUDE.md` so at least the second call within a session can be skipped"],[1],"A largely static catalog that exists to be discovered, not acted on, is what MCP resources are for: the agent can read it directly without spending a tool-use decision and a round trip on discovery.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[2,0,"Mock exam 6 · Q33","An MCP server offers `list_all_tasks` (returns every task in the system) and `search_tasks` (filters by keyword). Agents sometimes still reach for `list_all_tasks` on large task inventories when `search_tasks` would clearly serve better — most often on genuinely ambiguous requests like \"find tasks updated in the last week.\" The team has already rewritten both descriptions with explicit use/non-use guidance and example queries, and the remaining mistakes are concentrated in exactly these edge cases. What's the next lever to try?",["Add 2–3 few-shot examples with explicit reasoning showing correct tool selection specifically for these ambiguous, edge-case queries","Rename `search_tasks` to something that sounds more appealing","Remove `list_all_tasks` from the toolset entirely","Force `tool_choice` so `search_tasks` is always selected regardless of the request"],[0],"Once description fixes are in place and the remaining mistakes cluster in genuinely ambiguous edge cases, few-shot examples with explicit reasoning are the next step. They show how to choose in exactly those cases without removing tools or forcing the choice.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q34","An MCP tool `compute_code_metrics` bundles three distinct capabilities — complexity scoring, test-coverage percentage, and dependency counting — behind one generic description that lists all three. A much lighter, purpose-built `count_functions` tool also exists for the narrower job of just counting functions, and is meaningfully faster for that specific need. Logs show agents reaching for the heavier, generic tool even for requests the lightweight tool would answer just fine. What's the issue, and the fix?",["`compute_code_metrics` is simply too slow and should be deprecated","The generic tool's description gives no signal about when a narrower, faster tool would serve better, so it reads as the safe general-purpose default; the fix is making that boundary explicit in the descriptions","The model needs more few-shot examples covering this exact case","The two tools should be merged into a single combined tool"],[1],"A generic description that never mentions a faster, narrower alternative reads as the safe default by omission. Making the boundary explicit in both descriptions (when to use the lightweight tool instead) is the fix.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[2,0,"Mock exam 6 · Q35","An MCP tool `fetch_repository_metadata` returns a repo's `package.json` contents, top-level README, and directory-tree structure — data that essentially never changes within a session. A productivity agent calls it near the start of almost every codebase-exploration task, adding latency to every single session even though the underlying data was already fetched the last time. What's a more efficient design here?",["Cache the metadata inside the agent's `CLAUDE.md` file","Expose the repository metadata as an MCP **resource** instead of a tool, so it can be referenced directly without a tool-call decision each time","Embed the metadata directly into the system prompt for every session","Require developers to paste the metadata into their initial request manually"],[1],"Data that's effectively static within a session and exists to be referenced, not acted on, belongs in an MCP resource rather than a tool. That removes the repeated round-trip cost each session pays for it.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q36","A code-complexity MCP tool expects a single file path and returns detailed per-function metrics. On a vague request like \"analyze the whole codebase,\" the agent sometimes passes a directory path by mistake, and the tool responds with an enormous combined JSON blob covering every file in that tree — overwhelming the context window and burying whatever signal actually mattered. What's the best way to prevent this?",["Validate the input inside the tool itself — reject anything that isn't a single file path, with a clear error explaining the expected input shape","Expand the tool's description with a warning against passing directories","Remove the tool and require this kind of analysis to be done manually instead","Add a `PostToolUse` hook that trims the response down to top-level metrics after the fact"],[0],"Validating the input shape inside the tool itself, before the expensive operation runs, stops the problem at its source. A PostToolUse hook only trims the output after the cost is paid, and a description warning is still probabilistic.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q37","A productivity agent has 22 tools available at once — a handful of built-ins plus 19 different MCP integrations for code analysis. Given the narrow task \"find memory leaks in this service,\" evaluation runs show the agent frequently reaching for debugging, profiling, and monitoring tools in various combinations, and only occasionally landing on the one static-analysis tool that's actually best suited to this exact job — a tool that, used alone, produces better results 80% of the time in manual comparisons. What does this pattern suggest, and what's the fix?",["Too many simultaneously available, similar-looking tools increase selection complexity; narrowing which tools are actually available for this kind of focused task (rather than leaving all 22 live at once) directly reduces the chance of picking a worse combination","The prompt needs clearer language specifically about memory-leak detection","The agent needs a larger context window to properly weigh all 22 options","The static-analysis tool's description needs to be more generic so it stands out less"],[0],"With 22 similar-looking tools live at once, narrowing which ones are available for a focused task reduces the selection space causing the misfires. Making the right tool's description more generic would make it harder to choose, not easier.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q38","An MCP server exposes `fetch_openapi_spec` (the full spec, on the order of 200KB) and `search_api_endpoints` (a keyword-filtered search over endpoint definitions, typically a few KB). For a query like \"find the endpoint that returns user profiles,\" logs show the agent frequently pulling the entire spec and searching through it manually, when the dedicated search tool would answer the same question directly. Both tools work correctly and neither is erroring. What's the most direct fix?",["Sharpen `search_api_endpoints`'s description to explicitly explain when it's the better choice over fetching the whole spec, with example queries it handles well","Make `fetch_openapi_spec` return only a summary instead of the full document","Raise the model's temperature to encourage broader tool exploration","Remove `fetch_openapi_spec` since the search tool is more efficient"],[0],"Making `search_api_endpoints`'s description state explicitly when it beats fetching the whole spec is the direct fix for this under-selection. Removing or shrinking the full-spec tool breaks legitimate uses of it.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q41","A CI review agent must only ever perform read operations — `Read`, `Glob`, `Grep` — and should never be able to modify files, run shell commands, or reach out through any MCP tool, no matter who runs it or how the invocation is configured. The team wants this enforced consistently for every developer who clones the repo, not left to individual discipline. What's the most direct mechanism?",["Configure permissions in the committed `.claude/settings.json`: allow `Read`, `Glob`, and `Grep`, and add deny rules for `Edit`, `Write`, `Bash`, and each configured MCP server (`mcp__<server>`)","Remove `Write`, `Bash`, and every MCP tool from the project's tool registry entirely","Add a prominent note in `CLAUDE.md` instructing Claude to avoid `Write` and `Bash`","Add a broad-matcher `PreToolUse` hook in `.claude/settings.json` that intercepts every tool call and manually re-implements the same allow logic each time"],[0],"Permission rules in the project's committed `.claude/settings.json` apply to everyone who clones the repo. Allow rules alone don't block unlisted tools; explicit deny rules do, and they override other approvals. There's no project \"tool registry\" to delete tools from, CLAUDE.md notes are only guidance, and re-implementing allow logic in a hook is more fragile than declarative rules.\nUpdated 2026-11-03: option reworded: allow rules alone don't deny unlisted tools per IAM docs; explicit deny rules make it enforceable.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q42","A team runs five review agents in parallel across a large monorepo, each covering a different subsystem, then merges all five sets of findings into one consolidated PR comment. Which specific design choice here is what actually prevents the \"a session reviewing its own generated code\" bias?",["Using JSON output format, which makes findings more reliable regardless of how the sessions themselves are structured","Consolidating the five sets of findings afterward, which lets duplicate issues get filtered out","Each of the five review agents is its own fully independent Claude Code invocation, carrying no context from whatever session originally generated the code under review","Running the analyses in parallel, since parallel work is inherently more thorough than sequential work"],[2],"What removes the generation-reasoning bias is that each review agent is a fully independent invocation carrying no context from the session that wrote the code. JSON output, parallelism and consolidation don't affect that bias.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q43","A review finding schema defines `{\"violation_type\": ..., \"description\": ..., \"remediation\": ...}`. Every finding validates against the schema successfully, but in practice, proposed fixes routinely end up written into `description` while `remediation` gets a vague one-liner like \"add validation\" — exactly backwards from what each field is meant to hold. The model clearly understands the JSON structure itself. What's the actual problem here?",["The fields should be marked required when they're currently optional; tightening that constraint will fix the mix-up","Force `tool_choice` onto the findings tool to remove any remaining ambiguity","The model understands the shape of the schema but not the intended purpose of each individual field; adding 2–3 few-shot examples showing correct field assignment per violation type teaches that distinction directly","An `evidence_required` list should be added to force more precision automatically"],[2],"The model already produces schema-valid JSON, so the problem isn't structural — it's that the model hasn't internalized which content belongs in which field.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q44","Over three sprints, the \"possible inconsistency in error-handling patterns\" finding category has a 35% developer dismissal rate, while actual bug findings sit under 5%. The prompt already says \"only report high-confidence issues.\" What's the most effective next step to protect developer trust in the review overall?",["Require developers to write a detailed justification every time they dismiss a comment","Lower the model's temperature to make output more deterministic","Add even stronger wording: \"be even more conservative about pattern consistency\"","Temporarily disable the specific \"inconsistency\" category, keep the well-performing categories (bugs, crashes, security) active, and only bring it back once its criteria have been tightened and re-measured"],[3],"Temporarily pulling the one category driving most of the dismissals, while leaving the well-performing categories active, protects trust in the parts of the review that work. Bring it back once its criteria are tightened and re-measured; stronger 'be conservative' wording doesn't change what gets flagged.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q46","A review job's MCP tool config in `.mcp.json` includes `\"auth_token\": \"${COMPLIANCE_API_TOKEN}\"`. In the CI job's script, one line runs `COMPLIANCE_API_TOKEN=$(fetch-secret compliance)` and the next line runs `claude -p ...`. Claude Code still fails to authenticate against the compliance tool. What's the most likely cause?",["The MCP server's URL is misconfigured","Claude Code's permission system is independently blocking this specific MCP tool","The assignment created only an unexported shell variable, so the `claude` process (and the MCP server it launches) never sees it; `export` it or set it in the job's environment block","`.mcp.json` doesn't actually support `${VAR}`-style expansion at all; the token needs to be hardcoded instead"],[2],"`.mcp.json` expands `${VAR}` from Claude Code's environment. A plain `VAR=value` line sets a shell variable that child processes don't inherit unless it's exported, so `${COMPLIANCE_API_TOKEN}` resolves to nothing. The URL and permission system aren't implicated, and `.mcp.json` does support `${VAR}` expansion.\nUpdated 2026-11-03: stem reworded so the variable is genuinely not exported; job-level CI env vars are normally inherited.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q51","An expense-extraction schema requires an `approval_date` field on every document. Testing shows the model fabricates a plausible-looking date on cost estimates that explicitly say \"to be determined upon approval\" — documents that genuinely have no approval date yet — while purchase orders, which do contain a real approval date, extract that field correctly. What change best addresses this without losing the field where it's genuinely available?",["Lower the model's temperature to reduce fabrication","Make the field nullable across the board, for every document type","Classify the document's subtype first (estimate vs. purchase order), and only require `approval_date` once that classification confirms it's the kind of document that should actually have one","Add stricter validation requiring the date to match a known approver's signature date"],[2],"Whether an approval date should be expected depends on the document actually being a purchase order rather than an estimate. Classifying the subtype first and only then requiring `approval_date` stops fabrication on estimates while keeping the field where it really exists.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q54","A retry loop currently resends a failed extraction with only \"please fix the invalid fields and try again.\" The actual validation failure is specific: `\"line_items structure invalid: expected an array of {quantity: number, price: number} objects; received a mix of strings and nested objects.\"` Repeated retries keep failing on the same document. What change would most improve the retry success rate?",["Add 3–5 few-shot examples showing correctly structured `line_items`","Include the original document, the failed extraction output, and the specific validation error message itself in the retry prompt","Lower the model's temperature so retries are more conservative","Increase `max_tokens` to give the model more room to reconsider"],[1],"A retry needs the original document to re-read, the failed output to see what went wrong, and the specific validation error to know exactly why. A vague 'fix it' retry gives the model nothing new, so it repeats the same mistake.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[4,0,"Mock exam 6 · Q55","A contract-extraction pipeline requires a `dispute_resolution_clause` field. Testing shows 11% of extractions return null for it even though human review confirms the clause is genuinely present — consistently on pages 6–8 of longer, multi-page contracts. Logs show the model's actual output starts trailing off in detail around page 4, well before those later pages get proper attention, and `max_tokens` is already set high enough that raising it further would meaningfully increase cost. What's the best way to reliably capture required fields that live late in long documents?",["Ask the upstream system to strip contracts down to only their early pages before extraction","Make the field optional instead of required","Keep raising `max_tokens` regardless of the cost impact","Run multi-page documents through extraction in two separate passes — one focused on early-page fields, one focused on fields expected later in the document"],[3],"When a required field consistently lives late in long documents and detail visibly tails off well before that point, splitting extraction into an early-pages pass and a late-pages pass gives the later fields focused attention without raising max_tokens.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q59","A schema extracts procurement data from both supplier quotes and purchase orders, and adds a new `bulk_discount_percentage` field meant to apply to both — but many real quotes and purchase orders simply don't have a bulk discount at all. Because the field is marked required, the model fabricates a plausible discount percentage whenever the source document doesn't actually mention one. What change most directly fixes this?",["Remove the field from the schema and compute any discount downstream from other extracted values instead","Change the field to a free-text string that can describe a discount in prose, e.g. \"10% off for bulk orders\"","Build entirely separate schemas for quotes and purchase orders, each handling discounts independently","Make the field optional/nullable, so its genuine absence in a source document no longer forces the model to invent a value"],[3],"When a field is legitimately absent from many real documents, making it nullable is what stops the model inventing a value just to satisfy a required constraint. Removing the field or splitting schemas is a bigger change than the problem needs.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q60","A team processes 4,000 invoices weekly and already categorizes extraction errors by type — \"date format inconsistency\" (6%), \"currency mismatch\" (4%), \"line-item count off by one\" (3%) — but has no way to tell whether, say, date errors cluster around handwritten invoices, particular vendors, particular countries, or scanned-vs-native documents. That makes it hard to know where to actually invest effort on the prompt or validation rules. What should be added to the structured output to make that kind of root-cause analysis possible?",["A random UUID attached to each extraction, purely for tracing a record back to its source","A free-text note field where the model can explain its own extraction in its own words","A counter tracking how many retries a given extraction needed before it succeeded","A `source_metadata` field recording document characteristics alongside each extraction — format (handwritten/scanned/digital), an OCR-confidence signal where relevant, vendor name, and vendor country — so errors can actually be grouped and analyzed by the characteristics of the input that produced them"],[3],"Logging the document's characteristics alongside each extraction (format, OCR confidence where relevant, vendor, country) turns three flat error-rate percentages into data that can be grouped by input type, showing where to invest in prompt or validation fixes.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q4","A customer says, \"I want to speak to a human right now,\" about a routine, easily resolvable issue. What should the agent do?",["Escalate immediately, honoring the explicit request","Explain why a human isn't necessary and continue autonomously","Ask the customer to describe the issue in more detail before deciding","Attempt to resolve the issue first, and escalate only if the customer repeats the request"],[0],"An explicit request for a human should be honored immediately, not investigated around. Offering to resolve first is correct only when the customer *hasn't* explicitly demanded escalation.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q13","You're building a skill that performs deep dependency tracing and produces very long, noisy output. You don't want this output cluttering the main conversation. Which `SKILL.md` frontmatter option addresses this?",["`paths`","`context: fork`","`argument-hint`","`allowed-tools`"],[1],"`context: fork` runs a skill in an isolated sub-agent context so verbose output doesn't pollute the main conversation.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q16","A code review surfaces three interacting bugs in a module — fixing bug 1 changes what the correct fix for bug 2 should be. How should this be communicated to Claude?",["A summary count of bugs without describing any of them","All three interacting issues together in one detailed message","Only the most severe bug; let Claude find the rest","One bug per message, sequentially"],[1],"Interacting issues need to be described together in one message; sequencing them risks contradictory or wasted fixes.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q18","A project-scoped `/deploy-checklist` command should be available to every developer who clones the repo. Where should it live?",["`CLAUDE.md`","`~/.claude/commands/`","`.claude/config.json`","`.claude/commands/`"],[3],"Project-scoped commands in `.claude/commands/` are version-controlled and shared with everyone who clones the repo.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q19","You want Claude to write a test suite, then iteratively improve an implementation based on which tests fail. What should you feed back after each attempt?",["A new, unrelated set of instructions each time","Only the original instructions, repeated","Nothing — Claude should be able to infer failures without being told","The actual test failures from that attempt"],[3],"Test-driven iteration works by sharing actual test *failures* after each attempt, not just the original test suite once.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q31","A developer needs to find every file matching `**/*.config.ts` across a large repository. Which built-in tool is correct?",["`Grep`","`Edit`","`Glob`","`Read`"],[2],"`Glob` matches file paths/names by pattern.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q32","A developer needs to find every place in the codebase that calls a specific function by name. Which built-in tool is correct?",["`Bash` with no arguments","`Grep`","`Glob`","`Write`"],[1],"`Grep` searches file *contents*, which is what's needed to find function callers.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q41","A CI job runs `claude \"Summarize the diff and flag risky changes\"` and hangs indefinitely, waiting for input. What's the fix?",["Add the `-p` (or `--print`) flag","Set an environment variable to disable interactivity","Pipe an empty file into the command as a workaround","Add a `--ci` flag"],[0],"`-p` / `--print` runs Claude Code non-interactively, which is required in automated pipelines. (B and D describe flags/variables that don't exist — a common distractor pattern.)","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[4,0,"Mock exam 1 · Q44","Automated code review is producing a 40% false-positive rate concentrated in one finding category. The prompt already instructs the model to \"only report high-confidence issues.\" What's the most effective next step?",["Lower the sampling temperature","Define explicit, categorical criteria for that finding type, and consider temporarily disabling the category while iterating","Permanently disable all review categories","Add \"be even more careful\" to the prompt"],[1],"Vague instructions like \"be conservative\" don't meaningfully reduce false positives; explicit categorical criteria do, and temporarily disabling a high-false-positive category protects trust while iterating.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q47","A team wants to reduce API costs on two workflows: (1) a blocking pre-merge check developers wait on, and (2) an overnight technical-debt report. Which should move to the Message Batches API?",["Both","Neither, since batch API doesn't support any CI use case","Only the pre-merge check","Only the overnight report; keep the pre-merge check synchronous"],[3],"The Batch API's lack of a latency SLA makes it unsuitable for blocking workflows; it's appropriate only for the latency-tolerant overnight report.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q48","Test generation is producing many low-value, duplicate tests that already exist in the suite. What's the most direct fix?",["Disable test generation entirely","Ask developers to write all tests manually going forward","Increase `max_tokens` for the generation call","Provide existing test files in context, and document testing standards/fixtures in `CLAUDE.md`"],[3],"Providing existing test files in context and documenting standards/fixtures in `CLAUDE.md` reduces duplicate, low-value test generation.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q50","Documented testing standards live only in a senior engineer's head and aren't written anywhere the CI pipeline's Claude Code invocation can access. What's the fix?",["Document testing standards, valuable test criteria, and available fixtures in `CLAUDE.md`","Add the standards to a Slack channel pinned message","Rely on the model's general knowledge of \"good tests\"","Ask the senior engineer to review every PR manually instead"],[0],"Documenting standards in `CLAUDE.md` makes them available to every Claude Code invocation, including CI, instead of living only in one person's head.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q53","A required field, `purchase_order_number`, keeps failing validation because the source document genuinely never contains a PO number anywhere. What should you do?",["Increase `max_tokens` and try again","Keep retrying with the same prompt","Make the field nullable/optional instead of required","Fabricate a placeholder value so validation passes"],[2],"When information is genuinely absent from the source, no amount of retrying will produce it; the field should be nullable instead of required.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q58","Your team wants to move a blocking, pre-merge invoice-validation workflow to the Message Batches API to save 50% on cost. Is this appropriate?",["Yes, as long as `custom_id` is set correctly","Only if the invoices are small in size","No — batch processing has no latency SLA and can take up to 24 hours, making it unsuitable for a blocking workflow","Yes, always — batch API should be used wherever possible for cost savings"],[2],"The Batch API's lack of a latency SLA (up to 24 hours) makes it unsuitable for any blocking, pre-merge/pre-approval workflow.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q7","After a 20-turn conversation about a $215 refund on order #4471, the conversation is summarized to save tokens. The summary says \"customer wants a refund,\" and the agent later asks the customer to repeat the amount and order number. What's the most direct fix?",["Maintain a persistent \"case facts\" block (amount, order ID, dates) carried in every prompt outside the narrative summary","Disable summarization entirely for all conversations","Ask the customer to always begin messages with their order number","Switch to a model with a larger context window"],[0],"A persistent case-facts block for the amount and order ID, carried outside the narrative summary, survives compression that plain-prose summarization won't.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[5,0,"Mock exam 2 · Q8","Your team wants the agent to self-report a 1–10 confidence score and auto-escalate anything below 6, replacing explicit escalation criteria. What is the concern with this approach?",["Confidence scores can only be produced when using extended thinking","This approach violates MCP resource specifications","Self-reported confidence is poorly calibrated — the model is often confidently wrong on exactly the hardest cases","Confidence scores require a separate fine-tuned model to produce"],[2],"Self-reported confidence scores are poorly calibrated, and models tend to be most confidently wrong on exactly the hardest cases — the opposite of what an auto-escalation gate needs.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q9","(Select TWO) Which two error-reporting practices should an MCP tool AVOID when `lookup_order` fails due to a backend timeout?",["Returning an empty result set marked as a successful, valid query","Returning `isError: true` with `errorCategory: \"transient\"` and `isRetryable: true`","Returning a generic \"Operation failed\" string with no other metadata","Returning the timeout duration and the specific query attempted"],[0,2],"Masking a timeout as a successful empty result (A) hides a real failure from the caller, and a bare \"Operation failed\" string (C) strips away the category and retryability info needed to react.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[2,0,"Mock exam 2 · Q10","The agent has grown to 18 available tools across support, billing, and shipping functions, and tool-selection accuracy has degraded noticeably. What is the most appropriate fix?",["Increase `max_tokens` so the model has more room to reason about tool choice","Force `tool_choice` to a single always-used tool","Scope each agent/role to only the 4–6 tools relevant to it","Add a 20-example few-shot block covering every tool combination"],[2],"Scoping each agent/role to the 4–6 tools it actually needs directly reduces the decision surface causing misselection.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q14","Sentiment analysis is added to detect customer frustration and auto-escalate above a threshold. Escalation rates go up sharply, but first-contact resolution doesn't improve, and some genuinely simple cases now escalate unnecessarily just because the customer sounded annoyed. What does this indicate?",["The agent needs more few-shot examples of angry customers","Sentiment doesn't reliably correlate with actual case complexity, so it's a poor escalation signal on its own","The sentiment threshold was simply set too low","Sentiment analysis should be paired with a larger model"],[1],"Rising escalations without improved resolution, plus simple cases escalating just for sounding annoyed, is the signature of a signal that doesn't track actual complexity.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q15","A customer says \"I already tried this, just send me to a person,\" after the agent offers to help resolve a straightforward issue. What's the appropriate next step?",["Honor the reiterated request and escalate","Continue offering the same resolution path, since the issue is within the agent's capability","Provide a partial refund automatically without further discussion","Ask one more diagnostic question to confirm the issue is really unresolved"],[0],"A reiterated, explicit request for a human takes priority over the agent's belief that the issue is simple; explicit requests get honored immediately rather than re-litigated.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[5,0,"Mock exam 2 · Q21","During synthesis, a claim's supporting excerpt is compressed for brevity, and the source URL originally attached to it is dropped in the process. What principle was violated?",["Structured claim-source mappings must be preserved and merged through synthesis, not summarized away","The claim should have been paraphrased more aggressively, not less","The claim needed a confidence score instead of a source","The excerpt should have been translated into a different content type"],[0],"The source-to-claim mapping is exactly the provenance information synthesis must carry forward intact, not compress away in the name of brevity.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q34","A team keeps a company-wide MCP server for Jira in `.mcp.json`, using `${JIRA_TOKEN}` for the credential. A developer also wants to experiment with a personal, unreleased MCP server without affecting teammates. Where should the personal server be configured?",["It cannot be done without modifying the shared repo config","In `~/.claude.json`","In `.mcp.json` with a different key","In `CLAUDE.md` as a code block"],[1],"Personal/experimental MCP servers belong in the user-scoped `~/.claude.json`, keeping them invisible to teammates; putting it in `.mcp.json` (even under a different key) would land in the shared, version-controlled team config.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q35","Claude Code keeps preferring `Grep` over a connected MCP server's more powerful `search_codebase` tool, even though the MCP tool would give better results for the developer's query. What is the most likely cause and fix?",["Switch the MCP server from project scope to user scope","The MCP tool's description under-sells its capability relative to the well-known built-in tool; improve the description to clarify when and why to prefer it","The MCP tool is broken; disable `Grep` entirely","MCP tools always lose to built-in tools by design and this can't be changed"],[1],"Claude has a strong prior toward familiar built-ins like Grep, so an under-described MCP tool loses out by default. Improving its description to say what it does better and when to prefer it is the fix; disabling Grep or changing scope doesn't address the cause.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q37","A skill should be limited to file-write operations only, with no ability to run destructive `Bash` commands. Which frontmatter option enforces this?",["`disallowed-tools`","`context: fork`","`argument-hint`","`allowed-tools`"],[3],"The exam guide's answer: `allowed-tools` restricts which tools a skill may use. `context: fork` isolates context and output, not tool permissions, and `argument-hint` is autocomplete text. (Newer Claude Code docs treat `allowed-tools` as pre-approval and add `disallowed-tools`, but the exam follows the guide.)\nExam-guide check 2026-11-03: answer changed from disallowed-tools to allowed-tools to match the exam guide.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q38","A new hire isn't receiving the team's established coding conventions, even though a senior engineer insists \"it's all in CLAUDE.md.\" What is the most likely cause?",["The conventions live in the senior engineer's user-level `~/.claude/CLAUDE.md`, which isn't shared via version control","CLAUDE.md files are cached and require a manual cache clear","The new hire's IDE isn't configured to load CLAUDE.md","The conventions are correctly placed in the project-level CLAUDE.md, and the new hire simply hasn't read it"],[0],"The classic failure is conventions living in the senior engineer's personal `~/.claude/CLAUDE.md`, which is never committed, so new hires who clone the repo never get them. Move them to the project-level CLAUDE.md.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q42","A developer describes a desired data-transformation function in prose, but Claude's implementation is inconsistent across attempts — sometimes handling edge cases differently. What is the most effective way to tighten the specification?",["Switch to a different model without changing the instructions","Lower `max_tokens` to force a more concise implementation","Provide 2–3 concrete input/output examples that pin down the exact expected transformation","Repeat the same prose instructions with more emphatic wording"],[2],"Inconsistent handling across attempts signals genuine ambiguity in the prose spec. Concrete input/output examples pin down the exact expected behavior, including edge cases, in a way more emphatic wording can't.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q46","An extraction schema marks `contract_end_date` as a required field, but many contracts in the corpus are open-ended with no end date. What happens, and what's the fix?",["This is expected behavior and requires no change","The model may fabricate a plausible end date to satisfy the required constraint; make the field nullable/optional instead","Switch from `tool_use` to plain-text JSON output to avoid the issue","Extraction will simply fail validation every time; the schema is unusable"],[1],"With no end date anywhere in many source contracts, forcing `contract_end_date` as required pressures the model to invent a plausible-looking date rather than admit absence; making it nullable/optional removes that pressure.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q50","A validation-retry loop for extraction failures should include which of the following in the follow-up request?",["Only a generic instruction to \"try again more carefully\"","Only the original document, without reference to the prior failed attempt","A completely new document as a substitute","The original document, the failed extraction, and the specific validation error(s) that occurred"],[3],"An effective retry needs the original document, the prior failed output, and the specific validation error so the model has something concrete to correct against.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q58","Field-level confidence scores are being used to route extractions to human review. What should calibrate the routing thresholds?",["The number of fields in the schema","An arbitrary fixed cutoff, e.g., always exactly 80%","Thresholds calibrated using labeled validation sets, so the confidence score maps to actual accuracy","The document's file size"],[2],"Thresholds are only meaningful if calibrated against labeled validation data so a given confidence score actually corresponds to a known accuracy rate; otherwise the score is just an arbitrary number.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q60","(Select TWO) Which two practices are appropriate when reviewing a 16-file pull request to avoid the attention dilution seen in single giant review passes?",["Run one single-pass review across all 16 files simultaneously for maximum context","Split into focused per-file passes for local issues","Run a separate cross-file integration pass for data-flow issues spanning files","Require exactly three independent full-PR passes and keep only majority-vote findings"],[1,2],"Per-file passes give each file focused attention for local issues, and a separate cross-file pass targets data-flow and integration issues that span files. Together they avoid the attention dilution of one monolithic pass; majority voting doesn't.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q1","A developer asks Claude to \"clean up this parsing function\" with no further detail. Three separate attempts produce three meaningfully different refactors, each reasonable in isolation but inconsistent with each other. What is the most effective way to converge on a consistent result?",["Repeat the same request with stronger emphasis (\"please be consistent this time\")","Ask for five more attempts and pick the best one","Reduce `max_tokens` so the model has less room to improvise","Provide 2–3 concrete before/after examples showing exactly what \"cleaned up\" means for this codebase's style"],[3],"Three inconsistent refactors from the same vague instruction is a definitional-ambiguity problem, not a randomness problem, so 2–3 concrete before/after examples pinning down what \"cleaned up\" means fixes the actual cause.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q2","Before implementing a rate-limiting feature in a service Claude hasn't seen before, a developer wants Claude to first ask about traffic patterns, failure behavior under load, and whether limits should be per-user or global. What technique does this describe, and when is it most valuable?",["Plan mode — but only for single-file changes","The interview pattern — most valuable in unfamiliar domains where the developer may not have anticipated key design considerations","Prompt chaining — valuable for any multi-step task regardless of familiarity","Test-driven iteration — valuable only when a test suite already exists"],[1],"Asking Claude to surface traffic-pattern, failure-mode and scoping questions before writing code is the interview pattern. It is most valuable in unfamiliar domains, where the developer hasn't yet anticipated every design consideration.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q3","A team wants Claude to build a data-migration script and has already written a test suite covering expected behavior, edge cases (including null values), and performance constraints. What is the recommended way to use these tests during development?",["Show Claude the tests once at the start, then ignore test results during implementation","Iterate by sharing test failures with Claude after each attempt, letting it progressively correct the implementation","Withhold the tests until the implementation is \"done\" so Claude isn't biased toward passing them narrowly","Convert the tests into prose requirements instead of running them"],[1],"With tests already covering behavior, edge cases, and performance up front, the recommended loop is to hand Claude the actual failures after each attempt so it can progressively converge.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q4","A pull request fixes three bugs that interact — fixing bug 1 changes the correct approach to fixing bug 2. Which approach to communicating these to Claude is better?",["Only describe the most severe bug and let Claude discover the other two independently","Describe all three interacting issues together in one detailed message","Report each bug in a separate message, waiting for a fix before mentioning the next","Ask Claude to guess which bugs might be related before describing any of them"],[1],"Because fixing bug 1 changes the correct approach to bug 2, the issues interact, and interacting issues must be described together in one detailed message so Claude reasons about them jointly.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q7","A \"brainstorm alternative approaches\" skill tends to produce long, exploratory output that isn't useful to keep in the main conversation once a decision is made. Which frontmatter setting addresses this?",["`allowed-tools`","`context: fork`","`argument-hint`","`paths`"],[1],"`context: fork` runs the skill in an isolated sub-agent context, keeping the long exploratory brainstorm output out of the main conversation once a decision is made.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q16","A CI job runs `claude \"Review this PR for security issues\"` and hangs indefinitely. What's the fix?",["Redirect `/dev/null` into stdin","Add a `--batch` flag","`claude -p \"Review this PR for security issues\"`","Set `CLAUDE_HEADLESS=true` as an environment variable"],[2],"`claude -p \"...\"` runs non-interactively, which is exactly what prevents a CI job from blocking while waiting on a stdin prompt.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q17","The team wants automated review findings posted as individual inline PR comments by a script, requiring machine-parseable output rather than free-form prose. Which combination of flags supports this?",["`--resume` with a named session","`-p` alone is sufficient","`fork_session` for each file reviewed","`--output-format json` combined with `--json-schema`"],[3],"`--output-format json` combined with `--json-schema` gives schema-compliant, machine-parseable findings that a script can split into individual inline comments. `-p` alone only makes the run non-interactive, and `--resume` or forking don't affect output format.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[3,0,"Mock exam 3 · Q21","Your CI system wants Claude to auto-generate high-value tests rather than generic boilerplate assertions. What should be documented in CLAUDE.md to improve this?",["The full list of every function in the codebase","Nothing — test quality is purely a function of model capability","Testing standards, valuable test criteria, and available fixtures/conventions","The CI provider's internal infrastructure details"],[2],"Documenting testing standards, what makes a test valuable, and available fixtures/conventions in `CLAUDE.md` gives the model the missing project-specific judgment it needs to generate high-value tests instead of boilerplate.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q29","A CI test-generation job has an SLA requiring results within 30 hours of PR creation, using the Message Batches API's 24-hour processing window. How should submission timing be handled?",["Submit immediately when the PR opens and hope it completes in time","Switch to real-time calls entirely, since batch has no SLA guarantee","Submit on a fixed cadence (e.g., every 4 hours) so the worst case, one full interval of waiting plus up to 24 hours of processing (4 + 24 = 28), stays inside the 30-hour SLA","Submit only once daily at midnight regardless of PR volume"],[2],"Worst case = submission interval + 24 h of processing. Every 4 hours gives 28 h, which is within the 30-hour SLA. Every 6 hours would hit exactly 30 h with no buffer, and once daily would miss it.\nExam-guide check 2026-11-03: option and explanation corrected to the guide's 4-hour figure.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q30","(Select TWO) Which two statements about the Message Batches API are accurate?",["It offers roughly 50% cost savings compared to synchronous calls","Batch requests are correlated to responses using session names via `--resume`","Processing may take up to 24 hours, with no guaranteed latency SLA","It supports multi-turn tool calling within a single batch request"],[0,2],"The Batches API gives ~50% cost savings (A) and processes within an up-to-24-hour window with no guaranteed latency SLA (C).","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q36","`lookup_order` returns multiple matching orders for the identifiers given. What's the correct handling, and why?",["Ask for an additional identifier to disambiguate, rather than guessing","Process the request against the first match returned","Escalate immediately without attempting disambiguation","Select heuristically (e.g., most recent), since customers usually mean their latest order"],[0],"Multiple ambiguous matches call for asking for an additional identifier rather than guessing. Heuristics like 'first match' or 'most recent' risk acting on the wrong order, and escalating is unnecessary when one more identifier settles it.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[2,0,"Mock exam 3 · Q38","An agent is given 18 tools spanning billing, shipping, loyalty programs, and account management, and tool-selection accuracy for its core support tasks has dropped. What's the most appropriate fix?",["Add more few-shot examples covering every possible tool combination","Increase `max_tokens` for reasoning about tool choice","Scope the agent to only the 4–6 tools relevant to its actual role","Force `tool_choice: \"any\"` to guarantee some tool gets called"],[2],"Scoping the agent to the 4–6 tools relevant to its role directly addresses the selection-accuracy drop caused by tool-list bloat. More examples or max_tokens don't shrink the decision space, and forcing `any` only guarantees that some tool is called.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q42","A customer explicitly and calmly states, \"Please transfer me to a human,\" at the very start of an otherwise simple, resolvable interaction. What should happen?",["Ask why they want a human before proceeding either way","Offer an incentive to keep the customer with the automated agent","Escalate immediately, honoring the explicit request without first attempting investigation","Attempt to resolve the issue first, since it appears simple, then transfer if the customer insists again"],[2],"An explicit, calm request for a human should be honored immediately without first attempting resolution, per the escalation-trigger rule that explicit requests bypass investigation regardless of how simple the issue looks.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q44","A policy document addresses refund exceptions for damaged goods but says nothing about refund exceptions for goods lost in transit. A customer requests exactly this kind of exception. What should the agent do?",["Apply the damaged-goods policy by analogy without escalating","Deny the request since it isn't explicitly authorized","Approve the request since it isn't explicitly denied","Escalate, since this is a policy gap rather than a straightforward case"],[3],"A policy that is silent on the specific scenario (lost in transit) is a genuine policy gap, and policy silence or ambiguity is an escalation trigger. Extending the damaged-goods policy by analogy (A) or unilaterally denying (B) or approving (C) means the agent invents policy.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q45","(Select TWO) Which two of the following are appropriate, reliable escalation triggers per the exam blueprint?",["The customer's message contains negative sentiment keywords","The policy is silent or ambiguous on the customer's specific request","The agent's self-reported confidence drops below an arbitrary threshold","The customer explicitly requests a human agent"],[1,3],"An explicit request for a human should always be honored, and policy silence/ambiguity is a genuine reason to escalate rather than guess.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q46","An extraction pipeline validates against a JSON schema and a required field, `purchase_order_number`, fails validation because it's missing. Investigation confirms the source invoice genuinely never included a PO number. What's the correct interpretation?",["Retry with the same prompt; missing-field errors are always retry-fixable","The schema needs a stricter type constraint","This retry is unlikely to succeed since the information doesn't exist in the source; the field should be nullable instead of required","Increase `max_tokens` and retry"],[2],"The invoice genuinely never had a PO number, so no amount of retrying manufactures data that isn't in the source; the fix is upstream, making the field nullable.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q53","A stakeholder wants to know if a 96% aggregate extraction accuracy is good enough to safely reduce human review across the board. What should be checked first?",["The average length of the source documents","Accuracy broken down by document type and by individual field, since aggregate numbers can mask segment-specific failure","Whether `--json-schema` was used during extraction","Nothing further; 96% aggregate is a strong number on its own"],[1],"A 96% aggregate can hide a document type or field performing far worse, so only a by-type, by-field breakdown reveals whether review can safely be reduced broadly or only for specific segments.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q54","Field-level confidence scores are used to route low-confidence extractions to human reviewers with limited capacity. What should determine the confidence threshold used for routing?",["Calibration against a labeled validation set so the threshold maps to actual accuracy","The number of required fields in the schema","The size of the review team, independent of accuracy data","An arbitrary round number chosen for simplicity"],[0],"A threshold is only meaningful if tied to what confidence level actually predicts correctness, which requires calibration against labeled ground truth.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q58","A synthesis-style extraction task combines financial figures, narrative commentary, and technical specifications from a single source document into one structured output. How should each content type be rendered in the final structured output?",["Only the financial figures should be kept; other content types should be dropped","Uniformly as plain paragraphs regardless of content type","Entirely as a single JSON blob with no formatting distinctions","Appropriately to its type — e.g., financial data as tables, narrative as prose, technical specs as structured lists"],[3],"Financial figures, narrative, and specs carry different information shapes, and collapsing them into one uniform format throws away structure that's cheap to preserve and useful downstream.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q59","A document-extraction pipeline needs to guarantee some structured output happens across three possible schemas, without the model ever responding with plain conversational text instead of calling a tool. Which `tool_choice` value should NOT be used here?",["A forced specific tool name, if the document type is already known","`\"auto\"`","None of these values is safe here; every `tool_choice` setting can still return plain text","`\"any\"`"],[1],"`\"auto\"` explicitly permits the model to answer with plain text instead of calling any tool, which is the one outcome this pipeline must prevent; `\"any\"` and a forced tool name both guarantee a tool call happens.\nUpdated 2026-11-03: distractor no longer refers to option letters, which are shuffled in this item.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q60","(Select TWO) Which two practices directly help prevent a model from fabricating values during structured extraction?",["Making every field required so the model is forced to always provide a value","Including few-shot examples showing correct null/absent-field handling","Increasing `max_tokens` substantially","Marking fields nullable/optional when the source document may not contain them"],[1,3],"Making fields nullable removes the pressure to invent a value just to satisfy a \"required\" constraint, and few-shot examples of correct null/absent-field handling model the desired behavior directly.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q7","Your policy requires that refunds under $100 can be auto-approved, but refunds of $100+ must first have the customer's identity verified via `get_customer`. Some `get_customer` calls fail due to network timeouts, and the agent currently retries the same call several times before eventually calling `escalate_to_human`. You want to *guarantee* that `process_refund` can never be called for $100+ unless `get_customer` has already returned a verified ID in the conversation — not just make it likely. Which mechanism enforces this?",["A `PreToolUse` hook that blocks `process_refund` for amounts at or above $100 until a verified-ID flag from `get_customer` is present in the conversation","A `PostToolUse` hook that appends a reminder to the agent after `process_refund` succeeds, noting that identity should have been verified first","A `PostToolUse` hook that normalizes `get_customer` results into a canonical verified/unverified format","A system-prompt instruction stating that identity verification is required before large refunds"],[0],"Only a `PreToolUse` hook can block `process_refund` *before* it executes, which is what \"guarantee\" requires here.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q8","(Select TWO) Your team wants to fix confusion between `check_return_eligibility` and `check_warranty_status`, two tools that return similar-looking metadata but serve different purposes and are frequently called for the wrong purpose. You're applying the standard tool-description fix ladder before reaching for anything more disruptive. Which TWO of the following are appropriate first-step improvements?",["Rename the tools to `is_return_eligible` and `is_product_under_warranty`, and add descriptions that explain when to use each, including explicit non-use cases","Add 5 few-shot examples showing correct routing between the two tools, in a dedicated prompt section, before touching the tool definitions themselves","Merge bo
