he exam guide lists it as an unreliable escalation trigger.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q47","A validation-retry loop needs to correct a structural JSON error (a nested array flattened incorrectly) on the second attempt. What should the follow-up prompt include?",["Nothing — `tool_use` with schemas should never produce structural errors, so no retry should be needed","The original document, the failed extraction output, and the specific validation error describing the structural mismatch","A brand-new, unrelated example document","Only a repeated instruction to \"format correctly this time\""],[1],"A structural error like a flattened array is retry-fixable, but only if the follow-up gives the model something to correct against: the original document, the failed output, and the specific validation error. A bare 'format correctly' adds no new information.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[4,0,"Mock exam 3 · Q48","Which statement correctly distinguishes what `tool_use` with a JSON schema does and does not guarantee?",["It guarantees syntactic (schema-compliant) validity but not semantic correctness (e.g., values landing in the wrong field or totals not summing)","It guarantees both syntactic validity and semantic correctness of extracted values","It guarantees neither, and offers no benefit over plain-text JSON output","It guarantees semantic correctness but not syntactic validity"],[0],"`tool_use` with a schema guarantees the output parses and matches the schema's structure (syntactic validity). It cannot check that values are semantically correct, such as a total that doesn't match its line items or a value in the wrong field. That needs separate validation.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q49","An enum field for expense category needs to remain useful even as new, unanticipated categories appear in documents over time. What schema pattern handles this well?",["An enum with an `\"other\"` value paired with a free-text `category_detail` field","A required string field with no enum constraint at all","Multiple boolean flags, one per possible category","A closed enum with no fallback option"],[0],"Pairing an `\"other\"` enum value with a free-text `category_detail` field lets the schema absorb novel categories without breaking validation while still capturing detail.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q50","Which best describes the purpose of a `detected_pattern` field attached to each automated finding in a review or extraction pipeline?",["It flags whether a finding is retryable","It enables systematic downstream analysis of which specific patterns trigger findings, useful for spotting recurring false-positive causes","It stores the model's self-reported confidence","It determines whether `tool_choice` should be `\"auto\"` or `\"any\"`"],[1],"Tagging findings with the specific pattern that triggered them turns one-off fixes into an aggregate signal for spotting recurring false-positive causes.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q51","Few-shot examples are added to an extraction prompt specifically to handle documents with varied structures — some using inline citations, others using bibliographies, some embedding methodology details inline versus in a separate section. What is the main benefit?",["Few-shot examples primarily reduce token usage","They guarantee the model will never omit a field","They eliminate the need for a JSON schema entirely","They demonstrate correct handling of structural variety, helping the model generalize to formats not explicitly shown"],[3],"Examples across genuinely different document structures teach the underlying judgment (how to find methodology or citations regardless of layout), so the model generalizes to formats it hasn't seen. They don't guarantee completeness or replace the schema.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q52","An extraction pipeline is being scaled from a 20-document pilot to a 5,000-document production run using the Message Batches API. What should happen before the full run?",["Skip validation entirely for the full run since the pilot already passed","Switch to synchronous calls for the full run instead of batch","Submit all 5,000 immediately to save time","Refine the prompt against a smaller sample set first to maximize first-pass success and reduce costly iterative resubmission at scale"],[3],"At 5,000-document scale, with batch turnaround of up to 24 hours and no latency SLA, finding a prompt flaw only after the full run is very costly. Refine the prompt on a smaller sample first to maximize first-pass success, then submit the full batch.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q55","Two extracted values for the same metric conflict because they come from two source documents published a year apart, representing a genuine change over time rather than an error. What structured field, if present, would have prevented this from being misread as a contradiction?",["`errorCategory`","`tool_choice`","Publication or data-collection date fields on each extracted value","`isRetryable`"],[2],"Attaching a publication or data-collection date to each extracted value lets downstream synthesis recognize a legitimate change over time rather than flag a contradiction.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q56","Which best describes when retrying a failed extraction is NOT likely to help?",["When the required information is genuinely absent from the source document entirely","When a nested array was flattened incorrectly","When the validation error indicates a structural/format mismatch that's fixable through clearer instructions","When the model swapped two adjacent fields"],[0],"Retrying only helps when there's new information or clearer instruction to converge on; if the value was never in the source document, no retry can invent it.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q57","An extraction schema requires `stated_total` and also asks the model to compute `calculated_total` from the line items. What is the purpose of including both?",["To reduce the number of required fields elsewhere","Redundancy for its own sake","Enabling downstream detection of semantic mismatches (the two numbers disagree) that schema validation alone wouldn't catch","To satisfy `tool_choice: \"any\"` requirements"],[2],"Requiring both the stated total and a model-computed total creates a check that schema validation alone can't perform: if the two disagree, something is semantically wrong even though the JSON is valid.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q1","Your resolution agent has a `PreToolUse` hook that blocks `process_refund` calls exceeding $750. Logs show the hook is working correctly — every blocked refund is correctly identified. However, first-contact resolution dropped 12% in the last month. Investigation reveals that many customers' refund requests between $400–$750 are now being incorrectly escalated even though policy allows them, and the agent is calling `escalate_to_human` before ever attempting `process_refund`. What's the issue?",["Replace the hook with a system-prompt instruction that lists the threshold explicitly","The hook is correct, but the agent's premature escalation suggests the `process_refund` tool description doesn't make clear that it handles amounts up to the threshold","The hook should use `PostToolUse` instead of `PreToolUse` to allow the refund attempt first","The threshold is set too high; lower it to $500 to prevent false escalations"],[1],"The hook enforcement is doing its job; the defect is upstream.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q2","Your support agent integrates with two MCP tools: `lookup_legacy_order` (for orders from 2+ years ago) and `lookup_recent_order` (for current orders). Both return `{\"isError\": true, \"message\": \"Lookup failed\"}` for any failure — timeout, invalid order ID, or permission denied. The agent sometimes retries timeouts unnecessarily and sometimes gives up on permission errors that should escalate instead. What's the root cause?",["The tools need better descriptions so the agent picks the correct one first","The tool results lack structured error metadata (`errorCategory`, `isRetryable`); the agent can't distinguish a retryable timeout from a non-retryable permission failure","The agent should use `tool_choice: \"any\"` to force it to select one of the two tools","The MCP server is responding too quickly; add artificial delays so the model sees a timeout signal"],[1],"A flat `isError: true` with no category tells the agent nothing about whether to retry, escalate, or move on.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[5,0,"Mock exam 4 · Q3","A customer named \"Utkarsh Agarwal\" matches 5 accounts in the system: four inactive, one active from last month. The agent selects the active account without asking for clarification. That account belongs to a different customer with the same name — the agent processes a $340 refund for the wrong person. What's the correct behavior when a lookup returns multiple matches?",["Ask the customer for an additional identifier before proceeding","Process the request against all matching accounts and let the customer confirm afterward","Pick the most recently active account, since it's the most likely match","Escalate immediately, since multi-match lookups are inherently too ambiguous to handle autonomously"],[0],"Ambiguous multi-match lookups should never be resolved by a heuristic like recency; ask for another identifier (email, phone, order number) to disambiguate safely.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q4","A customer messages: \"I need to return a wireless headset AND I'm being charged twice for my subscription.\" The agent decomposes this into two concerns and investigates the billing dispute first, finding a duplicate charge and auto-refunding $15. Only afterward does it address the return, discovering the headset was purchased as part of a non-refundable promotional bundle 45 days ago, and escalates the return. The customer is upset because the billing refund had already gone through before the return was found to be ineligible. What went wrong?",["The agent needed stronger prompting to handle multi-concern messages","The agent picked the wrong concern to address first; pure ordering shouldn't matter otherwise","The agent should have investigated eligibility/prerequisites across both concerns before issuing any refund, not resolve one item to completion before even starting to investigate the other","The agent should have escalated both concerns immediately instead of attempting autonomous resolution"],[2],"The failure isn't that the agent worked on the wrong concern first — it's that it fully executed one concern (issuing a refund) before checking prerequisites relevant to the other.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q5","Your agent has access to four tools: `get_customer`, `lookup_order`, `process_refund`, and `escalate_to_human`. Metrics show 65% of cases that call `escalate_to_human` are actually routine refunds that could have been auto-resolved, while autonomous resolution succeeds 78% of the time on the clear-cut cases it does attempt. The agent is over-escalating standard cases while handling some genuinely ambiguous ones autonomously. What's the most effective fix?",["Keep all four tools, but restrict `escalate_to_human` so it can only be called after both `get_customer` and `lookup_order` have already returned substantive data","Rewrite tool descriptions to be more explicit about when to escalate","Remove `get_customer` and `lookup_order` from the toolset, leaving only `process_refund` and `escalate_to_human`, to reduce tool confusion","Add explicit escalation criteria to the system prompt, with few-shot examples of cases to escalate versus resolve"],[3],"This is the exam guide's own sample case: easy cases are escalated while hard ones are handled autonomously. The guide's fix is explicit escalation criteria (ideally with few-shot examples) in the system prompt. Gating `escalate_to_human` behind other tool calls would break the rule that an explicit request for a human is honored immediately, and it would not stop the agent from handling ambiguous cases on its own.\nExam-guide check 2026-11-03: answer changed from gating the escalation tool to explicit escalation criteria.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[5,0,"Mock exam 4 · Q6","A 12-turn conversation about a disputed order involves: the customer claims a $60 charge on order #7742, the agent verifies the charge exists, and by turn 8 a running summary has condensed the details down to \"customer disputes a charge.\" On turn 11, the customer references \"like the $50 I got back last month for the same vendor,\" but the agent has lost the original $60 figure in the summarized history and asks the customer to repeat the amount. What fix would prevent this?",["Never summarize; keep the full raw conversation history in every turn","Maintain a persistent \"case facts\" block (amount, order ID, dates) carried alongside every message, outside the narrative summary that gets condensed","Increase the context window size","Lower the temperature to make behavior more consistent across long conversations"],[1],"A persistent case-facts block (amount, order ID, dates) carried alongside the narrative prevents exactly this kind of detail loss during summarization.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[1,0,"Mock exam 4 · Q9","Your team escalates any case that reaches 8 conversational turns, on the theory that long conversations indicate complex cases. Data shows this rule escalates many routine multi-step refunds (identity verification + refund processing routinely takes 6–8 turns) while some genuinely ambiguous policy-exception cases stay in autonomous resolution because they happen to resolve in fewer turns. What's wrong with using turn count as an escalation signal?",["Add a per-turn confidence score and escalate when the average drops below a threshold","Turn count is orthogonal to case complexity — the same routine workflow can take 3 turns or 10 depending on how the customer communicates. Escalation should trigger on an actual policy gap or ambiguity the agent can't resolve, not on conversation length","It's actually a reasonable proxy for complexity; just raise the threshold to 12 turns","Escalate based on customer sentiment instead of turn count"],[1],"Turn count doesn't track complexity — the same routine workflow can span very different numbers of turns depending on the customer's communication style.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q10","A case is escalated to a human with a structured handoff containing: customer ID, disputed order number, refund amount, and a recommended action (\"Approve $85 refund, order is within the 30-day window\"). The human approves the refund. Two days later, the customer says the refund never arrived and demands to know why the agent didn't just process it. Investigation shows the AI agent never actually called `process_refund` — it only reasoned that a human should approve one. What element is missing from the escalation structure that would have prevented this confusion?",["A confidence score, so the human knows how uncertain the agent was","The customer's original message, verbatim, to confirm the request was genuine","A field documenting exactly what the agent already attempted, and explicitly stating that no refund action was taken by the agent itself — only a recommendation","The full unedited transcript, so the human can re-trace the entire investigation themselves"],[2],"The handoff records *what the agent recommended* but never states *whether the agent itself took any action*.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q11","At the start of a Claude Code session a developer runs `/memory` and sees the project `CLAUDE.md` loaded, but not the `.claude/rules/database.md` rule (which has `paths: [\"src/db/**/*.ts\"]`). They ask Claude a general question about migration conventions and the answer ignores the rule. Later, after Claude reads `src/db/migration.ts`, its answers follow the rule. What explains this?",["The `paths` glob requires an exact filename match, not a directory wildcard pattern","The file must be committed to git before glob-based rules will apply to it","A path-scoped rule isn't loaded at session start; it loads when Claude reads, writes, or edits a file matching its `paths` glob","The developer needs to re-run `/memory` to refresh the rule cache"],[2],"Rules with `paths` frontmatter are conditional: they enter context when Claude uses Read, Write, or Edit on a matching file (including files created mid-session), not at launch. Directory globs like `src/db/**/*.ts` are supported, git status is irrelevant, and `/memory` only shows what is loaded.\nUpdated 2026-11-03: rewritten: memory docs say path-scoped rules load when Claude touches a matching file, so the old 'frozen at session start' key was false.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q12","A team creates a `/document-api` skill with `allowed-tools: [\"Write\"]` in its `SKILL.md` frontmatter, intending to restrict the skill to only writing documentation files. During a run, Claude still calls `Bash` and a connected MCP schema tool (each going through the normal permission prompt). Why didn't the frontmatter stop this, and what would?",["Skill invocation automatically escalates all tool restrictions from the skill to the parent session","MCP tools must be separately allowlisted via a dedicated `allowed-servers` frontmatter field, which is missing here","Add `tool_choice: \"required\"` to the frontmatter so the skill can call only its listed tool","`allowed-tools` only pre-approves the listed tools for that turn; it doesn't remove others. To take tools away while the skill is active, use `disallowed-tools` (or permission deny rules)"],[3],"Per the skills docs, `allowed-tools` grants permission without prompting for the listed tools during the invoking turn; every other tool, built-in or MCP, stays callable under normal permission settings. `disallowed-tools` removes tools from Claude's pool while the skill is active, and deny rules block them everywhere. There is no `allowed-servers` field, and `tool_choice` is an API parameter, not skill frontmatter.\nUpdated 2026-11-03: rewritten: allowed-tools pre-approves rather than restricts (built-in or MCP); disallowed-tools is the restriction field.\nExam-guide check 2026-11-03: accurate for current Claude Code docs, but if an exam question asks which frontmatter field restricts a skill's tools, the guide's answer is `allowed-tools`.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q15","A `/release-notes` skill converts raw commit messages into user-facing changelog entries. Across five runs on similar commits, the results vary: sometimes technical jargon that should be simplified is kept as-is, other times breaking-change details are oversimplified into vague language. The prompt already says \"write for a non-technical audience while preserving important details.\" What's the most effective next fix?",["Split the skill into two skills — one for breaking changes, one for routine fixes — to reduce the range of cases each has to handle","Add a stronger prompt clause: \"Always balance technical accuracy with customer-friendly language\"","Add 2–3 concrete before/after examples that show exactly which terms to simplify, which details must survive simplification (e.g., breaking changes), and how each should be phrased","Generate five variants per commit and have a human manually pick the best one each time"],[2],"When the same kind of transformation gives inconsistent results despite clear prose instructions, 2–3 concrete before/after examples pin down the boundary: which terms to simplify, which details must survive, and how to phrase them. Stronger wording or more variants don't remove the ambiguity.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q21","A coordinator delegates research on climate-policy evolution to five subagents — recent legislative news, long-form policy documents, emerging green-tech companies, synthesis, and report generation. All five complete without errors. The synthesis subagent's output is coherent, but the final report heavily emphasizes legislative updates and barely mentions green-tech market dynamics, despite the coordinator having requested balanced coverage. Each subagent's individual findings contain relevant material on their assigned topic. Where is the defect most likely located?",["The coordinator's decomposition never established weighting or integration instructions, so synthesis had no guidance on how to balance the two domains","The green-tech subagent silently failed to execute its task properly","The synthesis subagent's tool access is too narrow to retrieve the green-tech material it needs","The report-generation subagent is intentionally suppressing green-tech findings due to its writing style"],[0],"Every subagent executed correctly, which rules out execution-level defects. The imbalance traces back to the coordinator, which never gave synthesis any weighting or integration guidance for balancing the domains.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q22","A web-search subagent completes research on a regulatory topic and returns its findings to the coordinator. The coordinator then delegates a follow-up task to a synthesis subagent. The synthesis subagent immediately asks what \"approval timeline\" refers to — a term defined only in the earlier search results, which the coordinator has but did not include in the new invocation. Why is this the expected behavior rather than a bug?",["Subagents automatically inherit all prior coordinator messages and tool outputs, but only if explicitly \"enabled\" in the invocation — which wasn't done here","Passing context explicitly is optional in principle; the model's training data typically fills in plausible prior search results","Subagents have isolated context by design and do not automatically receive prior conversation history; the coordinator must explicitly pass whatever context a subagent needs into its invocation prompt","The synthesis subagent's context window is smaller than the coordinator's, so large search results are silently truncated before being passed along"],[2],"Subagents don't automatically inherit the coordinator's conversation history — this is by design, not a defect.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q23","A coordinator needs to search academic papers, government filings, and corporate financial disclosures on a renewable-energy topic. It currently delegates to one subagent, waits, delegates to a second, waits, then delegates to a third — a fully sequential chain that takes 45 seconds per research cycle. The three lookups don't depend on each other's output. What change reduces elapsed time while keeping the coordinator in control of synthesis?",["Use `Bash` to shell out to a script that invokes all three subagents in parallel, bypassing the `Task` tool","Reduce each subagent's context window so results come back faster","Emit all three `Task` tool calls within a single coordinator turn so the subagents run concurrently","Combine all three into one subagent that internally parallelizes the three lookups itself"],[2],"Emitting multiple `Task` calls within a single coordinator turn is what runs subagents concurrently.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q25","A research coordinator's usual flow is: search → wait → analysis (with search results) → wait → synthesis. On complex topics, the coordinator sometimes needs analysis and synthesis dispatched together right after search results land; on simple topics, synthesis should start the moment analysis returns, without an extra coordinator round-trip. The right next step genuinely depends on what each stage discovers. What orchestration approach fits best?",["Merge search, analysis, and synthesis into one subagent operating in a single context window","A dynamic orchestrator that inspects results after each step and decides which subagents to invoke next based on what it finds","Let each specialist subagent independently decide when to hand its output to the next stage, without the coordinator tracking overall progress","A fixed four-step prompt chain that always runs in the same order, on the theory that predictability beats adaptive logic"],[1],"When the right next step depends on what a stage actually finds, a dynamic orchestrator that inspects results and decides what to delegate next is the fit. A fixed chain can't adapt, and letting subagents hand off among themselves removes the coordinator's oversight.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[5,0,"Mock exam 4 · Q28","A draft report synthesized from three subagents' findings states a renewable-energy adoption statistic with no source citation, even though the search subagent originally found this figure in a credible government report and passed it along with a source reference. The synthesis subagent had both the number and the source in its input; the citation was simply dropped during synthesis. What should have been required from the start to prevent this?",["A checklist forcing the synthesis subagent to manually copy-paste every source reference verbatim into the output","A separate \"sources\" file kept entirely outside the synthesis subagent's input context","A confidence score on each claim, so synthesis can prioritize high-confidence findings","Structured claim-source mappings — each assertion explicitly linked to its source document, excerpt, date, and methodology — that synthesis is required to preserve rather than compress away"],[3],"Structured claim-source mappings (claim, excerpt, source, date, methodology), carried through as a required part of the handoff, are what stop provenance from being silently dropped during synthesis. A separate sources file the synthesis agent can't see, or confidence scores, don't keep claims tied to sources.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[1,0,"Mock exam 4 · Q29","A coordinator delegates in parallel to three subagents: clinical-trial outcomes, healthcare policy documents, and emerging medical technologies. Trials and policy both return successfully. The technology subagent errors out because a source is temporarily unreachable. A report can still be produced, just with a coverage gap on emerging technologies. What should the coordinator do?",["Escalate the whole pipeline to a human, since any subagent failure should halt the process regardless of how much useful work the others completed","Produce the partial report from the two completed subagents, clearly annotating the coverage gap and why it exists, and let the reader judge whether that gap matters for their purposes","Retry the failed subagent indefinitely and block the report until it eventually succeeds","Discard the two successful results too, since the three-subagent pipeline was defined as all-or-nothing"],[1],"A partial, clearly annotated report lets the reader judge whether the coverage gap matters, while still delivering the value the two successful subagents produced. Halting everything, retrying forever or discarding good results are all worse.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[5,0,"Mock exam 4 · Q30","A multi-turn synthesis is tracking housing-policy changes across a decade — early turns cover 2015–2018 findings, later turns add 2019–2024. By turn 5, the synthesis subagent starts referencing \"typical housing-policy patterns\" in vague generalities instead of the specific policy names, agencies, and dates it correctly cited in turn 2. The coordinator's messages keep growing, but the output keeps getting vaguer. What's the most direct fix?",["Restart the research from scratch with no prior context, since this kind of degradation is unavoidable in long sessions","Maintain a persistent findings-summary artifact (key facts, dates, policy names, sources) that the coordinator re-injects into every synthesis turn, countering attention loss on details buried in the middle of a growing context","Raise `max_tokens` so the model has more room to generate detailed responses","Swap in a larger model mid-session to regain synthesis quality"],[1],"A persistent findings summary (key facts, dates, policy names, sources) re-injected into every synthesis turn is the direct countermeasure to specific facts getting buried and generalized away in a long, growing context. More tokens or a bigger model don't fix where the facts sit.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[2,0,"Mock exam 4 · Q33","A developer wants to compare one function's signature across three branches (`main`, `develop`, `staging`) — just the definition line and its parameter list in each. What's the most efficient combination of built-in tools?",["Use `Read` on the entire repository per branch, then search the combined content manually","Use `Grep` to locate the function's definition line in each branch, then `Read` only the small region around each match","Use `Glob` to enumerate every source file first, then `Read` each one looking for the signature","Use `Bash` to run `git diff` across the branches and parse the raw output"],[1],"`Grep` is the right tool for finding a pattern (the function definition) inside file contents, and `Read` is then used narrowly on just the matched region.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q35","A custom MCP server queries a proprietary internal database for team-wide metrics. It needs credentials that must never be committed to git, and the server configuration itself must be shared across every developer's checkout. Where should this be configured, and how should the credential be referenced?",["In a root-level `.env` file, referenced from `.mcp.json` by its literal filename","In `~/.claude.json`, with the credential hardcoded, distributed manually to each teammate","In `CLAUDE.md`, inside a fenced code block, with a note asking developers not to commit it","In `.mcp.json`, referencing `${DATABASE_API_KEY}` for environment-variable expansion, with each developer setting that variable locally"],[3],"Project-scoped `.mcp.json`, committed to version control, with `${DATABASE_API_KEY}` expanded from each developer's own environment, keeps the server config shared while keeping the secret out of git.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q38","A developer unfamiliar with a codebase wants to find where HTTP request validation happens before requests reach business logic, without reading every file upfront. What's the recommended exploration order?",["Use `Glob` for `**/*.ts`, then `Read` every result and ask Claude to identify validation logic after the fact","Use `Grep` for validation-related terms (\"validate\", \"schema\", \"middleware\") to find candidate files, then use `Read` on just those matches, following imports to trace the flow from entry points","Use `Bash find` to list files, pipe the output somewhere, and ask Claude to infer the pattern from the file list alone","Use `Read` on every file under `/handlers` first, to understand overall structure"],[1],"Search first, read second: `Grep` for validation-related terms surfaces candidate files, then `Read` on just those matches (following imports from there) builds understanding incrementally.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q41","A CI pipeline reuses a single Claude Code session across a queue of 6–8 PRs to amortize session startup overhead. By the third PR, review comments start referencing prior PRs (\"similar to the previous refactoring\"); by the seventh, findings are generic and don't address the actual diff in front of it. Why, and what's the fix?",["The session is carrying forward reasoning and context from earlier PRs, biasing later reviews toward prior patterns; use a fresh Claude Code session per PR instead","The session's context window is exhausted; raise `max_tokens` to give each invocation more room","The CI runner is incorrectly caching findings between invocations; clear the runner's cache","Run all PR reviews simultaneously in parallel instead of sequentially, to avoid context accumulation"],[0],"Reusing one session across several PRs lets earlier reasoning and context bleed into later reviews, producing generic, prior-PR-flavored comments instead of a focused read of the current diff. Use a fresh session per PR.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q42","A `PostToolUse` hook with `matcher: \"Bash|Read|Edit\"` normalizes tool responses into a consistent JSON structure to make review output more uniform. In CI, the same hook also fires on an unrelated test-execution Bash step that emits raw plain-text test output, and normalizing that output breaks the downstream test-result parser, which now fails the build. What's the most precise fix?",["Disable `Bash` tool access for the entire CI review run and use only `Read` and `Edit`","Remove the hook entirely and give up on normalizing tool responses in CI","Narrow the hook's `matcher` (or add a condition) so it only fires on review-related tool invocations, not on the unrelated test-execution step","Move the hook from `PostToolUse` to `PreToolUse`, since that runs earlier and can skip non-review steps"],[2],"The hook's logic is sound; its scope is too broad.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q43","A CI review prompt spells out separate false-positive-reduction criteria for nine finding categories (security, performance, coverage, etc.), totaling roughly 280 tokens of criteria alone. Traces show the model applies these criteria inconsistently and sometimes seems to forget earlier categories' rules by the time it reaches later files in the same pass. What's the underlying issue?",["Add 5–8 few-shot examples per category showing correct criterion application","Set `temperature: 0` to force strictly rule-following, deterministic behavior regardless of prompt length","The criteria are too strict; loosen them so the reviewer becomes more confident overall","Packing many fine-grained, per-category rules into a single pass causes attention dilution; split the review into per-category (or per-file) passes, or move some of the criteria into a deterministic post-generation validation layer"],[3],"Nine categories of fine-grained criteria packed into one pass causes attention dilution: the model can't reliably hold and apply that many rules while also reading many files. Split the review into focused passes, or move mechanical checks into deterministic validation.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q44","A team runs a blocking pre-merge review with an SLA of under 8 minutes, and a separate nightly technical-debt scan with no time constraint. They want to move workloads to the Message Batches API for the 50% cost discount. Which is the correct call?",["Batch both; the cost savings are worth accepting whatever latency impact results","Batch the pre-merge check too — the Batches API typically finishes within about 2 hours, which is fine for most teams' merge cadence","Batch only the nightly scan; moving the pre-merge check to the Batches API would only make sense if the team is willing to accept processing delays of up to 24 hours on merge decisions, which conflicts with the stated SLA","Keep both synchronous; the Batches API isn't appropriate for any CI-adjacent workflow"],[2],"The Message Batches API has no latency SLA and can take up to 24 hours, which is incompatible with an under-8-minute blocking pre-merge check. The nightly scan has no time constraint, so it is a good fit for batch.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q46","A team wants to guarantee that review never runs on a PR lacking a linked issue-tracker ticket — unlinked PRs currently produce findings that just get ignored downstream anyway. The review prompt already says \"never review PRs without a linked ticket,\" but reviews keep running regardless, since prompt instructions are followed probabilistically. What's the most deterministic enforcement point?",["Strengthen the prompt further: \"CRITICAL: you MUST refuse to review PRs without a confirmed linked ticket. Non-negotiable.\"","Add a `PreToolUse` hook that checks the ticket-link prerequisite via the issue tracker's API and blocks the review-related tool call outright if the check fails","Build a custom `/review` skill that checks for a linked ticket as a documented step in its instructions before invoking the reviewer","Let review run as normal, then filter out and discard any findings after the fact if the PR turns out to lack a linked ticket"],[1],"A non-negotiable prerequisite needs enforcement outside the model's voluntary compliance.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[4,0,"Mock exam 4 · Q52","A pipeline has `extract_receipt`, `extract_invoice`, and `extract_contract`, each with its own schema, and uses `tool_choice: \"any\"` so a call is always guaranteed. A borderline document — a receipt-like form that also includes itemized line items — keeps getting routed to `extract_invoice`, whose required fields (like `PO_number`) don't exist on the source, so the model fabricates them. Retrying with the same `tool_choice: \"any\"` setting produces the same misrouted result again. What's the root issue and the most direct fix?",["Switch to `tool_choice: \"auto\"` so the model has the option to fall back to a plain-text response instead of a tool call","Add 2–3 few-shot examples distinguishing a borderline receipt from an invoice, then retry","`tool_choice: \"any\"` only guarantees *a* call, not the *right* one; add a validation step that detects field-presence mismatches against the chosen schema, returns a structured error naming the better-fitting schema, and lets the model retry against that feedback","Drop the contract schema — most real documents are receipts or invoices anyway, and fewer options should reduce misrouting"],[2],"`tool_choice: \"any\"` guarantees that a tool is called, not that it's the right one. A validation step that detects field-presence mismatches, names the better-fitting schema, and feeds that back for a retry fixes the misrouting; plain retries with the same setting just repeat it.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[5,0,"Mock exam 4 · Q53","A pipeline routes extractions below 0.70 overall confidence to human review and auto-approves the rest. After 1,000 documents, fabricated vendor names almost never get caught by review — they only surface weeks later downstream — while extractions that land at 0.68–0.72 confidence (right at the boundary) turn out to be correct almost every time they're checked. What's actually wrong with the routing, and what closes the gap?",["The threshold is simply too high; drop it to 0.50 so more extractions get reviewed","Switch from overall confidence to the minimum field-level confidence as the routing signal instead","Confidence is poorly calibrated specifically for fabrication — the model can be very confident about an invented value; add stratified random sampling of a small percentage of *high*-confidence extractions specifically to surface the failure patterns confidence scoring can't see","Field-level confidence is too fine-grained; collapse everything into one binary approve/review decision"],[2],"Confidence scores are a poor signal specifically for fabrication, since a model can be highly confident about an invented value.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q55","`payment_method` was originally required, and extraction never failed the schema — but downstream audits found it was frequently fabricated (e.g., \"Paid by credit card\" invented for documents that never mention payment method at all). Making the field nullable stopped the fabrication, but now roughly 5% of receipts extract with `payment_method: null` — and some of those actually do state \"Paid by credit card\" clearly, which the model simply missed. What schema-design principle addresses both problems at once?",["Add a `payment_method_confidence` field so low-confidence nulls can be distinguished from high-confidence ones","Keep the field optional, but add a `source_location` (or equivalent evidence field) so \"genuinely absent from the source\" can be distinguished from \"present in source but missed by the model\" — the latter is a prompt/extraction bug worth fixing, the former isn't","Default to the string `\"unknown\"` instead of `null`, so the field is always populated","Revert to required and rely on better prompting to make extraction more reliable"],[1],"Making the field optional stops fabrication but merges two different situations under one null. A `source_location` (evidence) field separates 'genuinely absent from the source' from 'present but missed by the model'; only the second is an extraction bug worth fixing.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q60","After 50,000 documents over three months, the pipeline's error tracking only records `validation_failed: true/false` — nothing about *why*. The team suspects failures cluster around specific vendors, date formats, or document types, but can't confirm it or prioritize fixes with the data they're currently logging. What should be added to enable systematic root-cause analysis?",["A random UUID per extraction, to trace failures back to their source documents","A `detected_pattern` field describing what characteristic triggered the extraction path taken (e.g., `\"date_format_ddmmyyyy\"`, `\"vendor_from_email_subject\"`, `\"amount_with_currency_symbol\"`), so failures can be aggregated by pattern and the highest-impact ones prioritized","A `retry_count` field, to deprioritize documents that keep failing repeatedly","A `model_version` field, to compare accuracy across model updates over time"],[1],"A `detected_pattern` field recording what characteristic drove each extraction path turns a flat pass/fail log into data that can be aggregated by pattern, so the highest-impact failure causes can be prioritized.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[1,0,"Mock exam 5 · Q1","Your support agent has an intake subagent that classifies incoming requests (simple: tracking/password/status | complex: refund/damage/billing), and an investigation subagent that handles complex cases. The intake subagent correctly marks requests as \"simple\" about 85% of the time, but 40% of requests marked simple still reach the investigation subagent, adding unnecessary latency. The system prompt says \"skip investigation for simple cases,\" but logs show it's ignored. What's the most reliable fix?",["Increase the intake classification model's temperature to make decisions more decisive","Add a step in the coordinator that reads the intake classification and only invokes the investigation subagent for cases marked complex","Include 5 few-shot examples in the intake prompt showing requests classified as simple","Increase the token budget for the intake subagent so it has more confidence in its decisions"],[1],"A system-prompt instruction (\"skip investigation for simple cases\") provides only probabilistic compliance.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[2,0,"Mock exam 5 · Q2","Your `process_refund` and `request_refund_exception` tools have descriptions: \"Process a refund\" and \"Request an exception for refund eligibility.\" Both accept the same inputs (order_id, amount, reason). The agent calls the wrong one 25% of the time on policy-edge cases. You've already tried improving the descriptions with input formats, but misrouting persists. What's the next step on the fix ladder?",["Merge both tools into one and add an internal `action: \"approve\" | \"request_exception\"` input parameter","Add 8 few-shot examples showing correct tool selection for ambiguous cases","Rename `request_refund_exception` to `escalate_refund_exception_review` and add explicit \"use this when policy does NOT allow the refund\" guidance","Split the tools into separate subagents, each with their own tool, to eliminate the choice entirely"],[2],"Once description improvements alone haven't fixed the misrouting, renaming the ambiguous tool so its purpose is unmistakable (`escalate_refund_exception_review`), with explicit 'use this when policy does NOT allow the refund' guidance, is the next step. Merging or splitting into subagents is a bigger restructure than needed.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q4","You've split the support system into a coordinator plus two subagents: one for order investigation and one for risk assessment. A case arrives: \"I want a $500 refund due to damaged goods.\" Both subagents run, but the coordinator receives only risk-assessment findings (\"Low risk, proceed\") and no findings from the order-investigation subagent. Production logs show the order-investigation subagent ran but hit a backend timeout. The coordinator can't distinguish \"no issues found\" from \"investigation failed,\" so it proceeds with incomplete information. What change would best solve this?",["Add a retry loop in the coordinator that automatically re-invokes failed subagents","Merge the two subagents into one","Restructure the case so order investigation always runs first, and risk assessment only if investigation succeeds","Require both subagents to output a status field indicating success/failure/partial, plus structured error context (`errorCategory`, `isRetryable`) when something goes wrong"],[3],"The coordinator needs a structured signal that separates 'nothing was found' from 'the investigation failed'. A status field (success/failure/partial) plus structured error context lets it retry, re-delegate or escalate instead of proceeding on incomplete information.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[5,0,"Mock exam 5 · Q9","Production analysis shows an inverted pattern: simple requests (resend tracking link, password reset) are escalated 35% of the time, while complex policy cases (international damage claims, subscription billing disputes) are resolved autonomously 28% of the time — both wrong outcomes. Investigation reveals the agent escalates using a heuristic: \"if the conversation has more than 5 turns, escalate.\" But simple cases often need 6–8 turns for data gathering (a customer didn't provide an order number initially, or an email needed clarifying), while some policy cases resolve in 3–4 turns given the right expertise. Why is this heuristic unreliable, and what should replace it?",["Escalate only when the model's confidence score drops below 50%","Use conversation length but adjust the threshold per case type; simple cases get a higher turn limit","Always escalate cases with more than 4 tool calls, since tool-call count indicates complexity","Escalation should be based on explicit, measurable criteria — policy ambiguity in the documentation, required customer data the customer can't provide, or conflicting information from backend systems — not proxy metrics like turn count"],[3],"Turn count doesn't track complexity: a routine case can need extra turns just to gather data, while a genuinely complex policy case can resolve quickly. Escalation should be driven by explicit criteria such as policy ambiguity, missing customer data or conflicting backend information.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q10","A coordinator invokes a refund-decision subagent with a highly prescriptive prompt: \"Check if customer is verified AND order exists AND refund window is open AND damage evidence is provided. If all true, approve. If any false, escalate. If customer is verified but evidence is unclear, gather more details.\" On standard, well-documented cases this works, but on unusual cases (a customer claims damage but has no photo, or the return window is ambiguous due to international shipping), the subagent either escalates unnecessarily or asks for details the coordinator already tried to gather. What's the architectural flaw?",["The subagent needs the full conversation history passed explicitly","The prompt over-specifies decision steps with rigid if-then-else logic, leaving no room for the subagent to reason about nuanced cases; it should instead receive investigation tools and clear decision criteria, but be allowed to assess independently whether those criteria are met","The coordinator should call a different subagent for unusual cases","The refund-decision subagent shouldn't have access to investigation tools at all"],[1],"A rigid, fully enumerated if-then-else prompt leaves the subagent no room to reason when a real case doesn't fit the listed conditions (missing photo evidence, ambiguous international return windows). Give it clear goals and decision criteria and let it judge whether they are met.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q11","Mid-session, a developer creates `.claude/skills/` in a project for the first time (the directory didn't exist when the session started) and adds a `/generate-component` skill there. Typing `/generate-component` in that same session isn't recognized, but a teammate who starts a brand-new session sees it immediately. Meanwhile, edits to existing skills in `~/.claude/skills/` show up without a restart. Why the difference?",["Claude Code wasn't watching a top-level skills directory that didn't exist at session start; running `/reload-skills` picks it up","`argument-hint` is required before a new skill can be invoked","Every skill change, including edits to existing skills, needs a full restart to take effect","The skill name conflicts with a reserved keyword"],[0],"Claude Code watches existing skill directories and picks up added, edited, or removed skills within the current session. A top-level skills directory created after the session started isn't being watched yet, so you run `/reload-skills` to load it (and again after later changes there until a new session). No restart is needed for edits in watched directories.\nUpdated 2026-11-03: rewritten: skills docs say watched skill dirs are live-reloaded; only a newly created top-level skills dir needs /reload-skills.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q12","A `/refactor-tests` skill encodes a company's standard test-refactoring pattern. It was originally created at `~/.claude/skills/refactor-tests/SKILL.md` to test locally. Now 40 engineers need to use it consistently. What's wrong with the current location, and what's the correct migration path?",["Convert the skill into a slash command instead, since skills can't be shared across a team","The user-level location is personal and not version-controlled; the skill should move to `.claude/skills/refactor-tests/SKILL.md` in the repo so every engineer inherits it via git and uses identical logic","Create a duplicate at the project level while keeping the user-level version, so team members can use either","Personal skills are faster; keep it at the user level and have each engineer copy the file manually to their own machine"],[1],"User-level configuration is personal and never shared through version control, no matter how good the skill is.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q16","A `/code-review` skill is configured with `allowed-tools: [\"Read\", \"Grep\"]` in its frontmatter, and the team's intent is that it must never be able to run Bash, even though Bash is enabled in the parent session. During a review, Claude suggests running a diagnostic script and requests to use Bash. What actually happens?",["The request is blocked only if the user is not present to approve it in real time","The request is silently blocked, because Bash isn't in `allowed-tools`","Claude can still request Bash — `allowed-tools` pre-approves the listed tools for that turn rather than removing other tools, so the Bash request goes through the normal permission flow (and runs if Bash is already allowed)","`allowed-tools` and `disallowedTools` are equivalent; listing tools in one automatically excludes every other tool"],[2],"`allowed-tools` is a pre-approval list, not a restriction: tools left off it remain callable under the session's normal permission rules. To meet the team's intent that the skill never runs Bash, add `disallowed-tools: Bash` to the frontmatter (or a Bash deny rule).\nUpdated 2026-11-03: clarified per current skills docs and aligned with Q84/Q231/Q310 (now also docs-based); disallowed-tools is the real restriction.\nExam-guide check 2026-11-03: accurate for current Claude Code docs, but if an exam question asks which frontmatter field restricts a skill's tools, the guide's answer is `allowed-tools`.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q19","A `.claude/rules/api-validation.md` file has frontmatter `paths: [\"src/api/**/*.ts\"]`, containing rules about validating all API inputs. A developer creates `src/api-client/index.ts` — a sibling directory, not a subdirectory of `src/api/` — and asks Claude to implement an API client there. The validation rules never apply to this file. Why?",["The glob `src/api/**/*.ts` only matches paths under `src/api/`; `src/api-client/` is a different directory that happens to share a name prefix, so the pattern simply doesn't match it — a broader pattern would be needed to cover both","Glob patterns are case-sensitive and the path casing doesn't match","`.claude/rules/` files only apply to files that already existed when the session started","Rule paths require an exact directory match, and sibling directories are always excluded by design"],[0],"Glob matching is literal path matching: `src/api/**/*.ts` only matches paths under `src/api/`, and `src/api-client/` is a separate sibling directory that happens to share a name prefix. A broader pattern (or a second path) is needed to cover both.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q21","A coordinator has already built up a long investigation in its own session — sources gathered, data cleaned, key facts noted. It now needs to explore two mutually exclusive hypotheses on top of that shared work: \"policy X accelerates adoption\" and \"policy X has no measurable effect.\" Exploring them one after the other in the same session, it finds reasoning built for the first hypothesis leaking into the write-up for the second. Fresh subagents would avoid the leak but would have to redo the accumulated work. What's the most direct fix?",["Have the synthesis agent automatically detect and remove cross-hypothesis contamination after the fact","Parallel `Agent` calls cannot accept differing prompts; switch to strictly sequential delegation in the same session instead","Fork the session at the point where the branches diverge, so each hypothesis is explored in its own isolated copy of the accumulated investigation state, then compare the two forks' conclusions afterward","Add `\"Agent\"` to the coordinator's `allowedTools`, since exploring branches requires it"],[2],"Forking the session at the point where the hypotheses diverge gives each branch its own copy of the accumulated investigation state, so neither branch sees the other's reasoning; compare the two forks' conclusions afterward. After-the-fact cleanup is unreliable, parallel subagent calls can take different prompts, and allowedTools has nothing to do with branch isolation.\nUpdated 2026-11-03: premise reworded: leak now comes from exploring both branches in one session (not isolated fresh subagents); Task renamed Agent in options.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q22","A coordinator delegates \"research the EU's approach to a regulatory topic\" to a named search subagent, and later delegates \"research the US's approach to the same regulatory topic\" to that same subagent. In between, the coordinator's own conversation has built up 15 turns of discussion establishing shared terminology and which document sources are authoritative for this topic. The second delegation comes back sparse and generic, as if the subagent doesn't share any of that established framing. What's the most accurate explanation?",["Subagents automatically inherit the coordinator's full conversation history, so the sparseness must mean the second request itself was too narrow","A subagent only receives what's explicitly included in its own invocation prompt; context the coordinator built up in its own conversation — terminology, source guidance — isn't automatically available to a subagent unless the coordinator restates it in that subagent's prompt","The first delegation exhausted the subagent's usable sources, degrading the second","Subagents share a temporary memory keyed by topic, but that memory had already expired between the two delegations"],[1],"A subagent only has what's explicitly included in its own invocation prompt.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[5,0,"Mock exam 5 · Q24","A research pipeline runs parallel subagents, then sends their combined output straight to a report-writing step with no intermediate check. Reviewers later find citation mismatches (a claim attributed to one source that actually came from another) and outright contradictions between two sections of the same report. Every individual subagent's own output looks reasonable in isolation. Where is the defect, and what's the most effective fix?",["Add an explicit coordinator-level checkpoint that evaluates the combined findings against citation-accuracy and cross-section-consistency criteria before handing off to report generation","The problem is in how tool responses format citations; normalize citation format with a hook","The report-writing step is introducing the citation errors itself; add a citation-cleanup pass after report generation","One specific subagent must have misattributed a source; re-run that subagent with stricter instructions"],[0],"Every subagent looking correct in isolation doesn't guarantee the combined output is coherent. An explicit coordinator checkpoint that evaluates the aggregated findings for citation accuracy and cross-section consistency catches these problems before report generation; cleanup after the report is written is later and less reliable.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q25","A coordinator launches three subagents in parallel — search, document analysis, and synthesis — for a request that fundamentally depends on reconciling conflicting findings across topics. Search and document analysis both succeed; synthesis crashes partway through with an unrecoverable internal error. The coordinator now has two successful results and one hard failure, for a task where the missing synthesis step was the part actually responsible for resolving the conflicts the user asked about. What should the coordinator do?",["Always return the two successful results as a partial report, since some information is better than none","Retry the synthesis step exactly once more and return whatever it produces, succeed or fail","Reason about whether the failed piece was essential to what was actually asked — since here the synthesis step was the entire point (reconciling conflicts), a partial report without it would misrepresent the state of the research, so this case should escalate rather than quietly return partial output","Discard everything and start the whole three-subagent pipeline over"],[2],"The right call depends on whether the failed piece was essential to what was actually asked.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q29","A coordinator runs one named search subagent through three sequential, topically distinct tasks in a row — renewable-energy policy, nuclear regulation, carbon pricing — clearing its own coordinator-side history between each. To save setup time, it resumes the same subagent (using the agent ID returned by the first run) for tasks two and three. The third response includes stray references to nuclear regulation, and the second mentions the first task's subject. Each response is factually correct about its own topic. Why is this happening?",["The subagent is configured to automatically retain context across every invocation by default","The coordinator didn't fully clear its own history, so the subagent must be inferring context from coordinator-side leftovers","Resuming a subagent continues its existing transcript, so it still holds its earlier tasks' context; spawn a fresh subagent invocation for each independent task","The underlying search tool is caching and returning stale results from the earlier queries"],[2],"Each new subagent invocation starts with a fresh context, but resuming a subagent by its agent ID continues that subagent's full prior conversation, so earlier topics bleed in. Clearing the coordinator's history doesn't touch the subagent's transcript. Fresh invocations per independent task, with everything needed in the prompt, fix it. Subagents don't retain context by default, and a search cache wouldn't inject unrelated topics.\nUpdated 2026-11-03: rewritten around documented subagent resume behavior; the old 'prompt template thematic association' claim isn't in any Anthropic doc.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[5,0,"Mock exam 5 · Q30","A team completes a multi-day research project on a fast-moving regulatory topic, citing a dozen sources. Two weeks later, they resume the same line of research to expand on one sub-topic, and simply re-inject all the prior findings as-is into the new session before continuing. A week after publishing the expanded report, they learn that two of the originally-cited sources have since been formally retracted or substantially revised, and the report's now-outdated claims are actively misleading readers. What practice would have caught this before publication?",["Have a policy of never citing anything more than six months old","Re-run the entire original research pipeline from scratch every time any new work touches the same topic","Store every source as a permanent, stable URL so readers can always find the original text themselves","When resuming research after a significant time gap, explicitly validate whether previously-cited sources are still current before re-using them, rather than re-injecting old findings wholesale and treating them as still authoritative"],[3],"Time-sensitive research doesn't stay valid forever. Resuming after a real time gap and re-injecting old findings as if they were still current risks publishing on retracted or revised sources, so validate previously cited sources before reusing them.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q33","During analysis, an agent needs the contents of three unrelated source files as baseline context before proposing any changes. It currently reads file A, waits for the result, reads file B, waits, then reads file C — three sequential tool-use round trips for three independent, non-dependent reads. What change improves efficiency here without changing what's actually being read?",["Use a single Bash command to concatenate all three files with a shell glob instead of using the file-reading tool","Emit all three read calls together in one response, as separate tool-use blocks, so the client can execute them concurrently and return all three results at once","Split the analysis across three separate sessions, one file per session","Keep reading sequentially, but cache each file's contents locally to avoid reading it again later"],[1],"When several reads are independent, emitting them together as separate tool-use blocks in one response lets the client run them concurrently and return all the results at once, cutting the sequential round trips without changing what is read.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q35","A developer-productivity agent has 22 tools available at once: 5 built-ins, 12 MCP tools for various kinds of code search (keyword search, cross-reference lookup, type-hierarchy exploration, and more), and 5 more for generating boilerplate. Logs show the agent occasionally reaches for a slower, more generic search tool when a faster, more specific one would clearly have been better — even after descriptions were already improved. What's the next lever to pull?",["Narrow which tools are actually available per task type — e.g. an exploration-focused pass gets only a handful of high-signal search tools, while an implementation-focused pass gets the editing and boilerplate tools — reducing the live decision space itself rather than relying on ever-better descriptions alone","Switch to a model with a larger context window so tool-selection reasoning has more room","Build a separate preprocessing step that decides which tool to call before the agent ever sees the request","Cut the least-used tools until the total count is 10 or fewer"],[0],"Narrowing which tools are available for a given task phase reduces the live decision space, which is a more direct fix for misselection among 22 similar-looking tools than ever-better descriptions. A bigger context window doesn't reduce choice, and a pre-router bypasses the model's judgment.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q36","A system requires that all file modifications stay within an explicitly approved `workspace_root` directory. A developer asks an agent to \"clean up unused dependencies,\" and without any programmatic boundary check in place, the agent occasionally ends up running Bash commands that touch directories outside that approved root. What is the most reliable way to enforce this boundary?",["Add a hook that runs after the Bash command completes, checking whether it touched an out-of-scope path and rolling back if so","Have the agent itself run a path-check command before the real modification, as a self-imposed safeguard","Add a prompt instruction stating the boundary rule and monitor logs afterward for any violations","Add a hook that runs *before* the Bash tool executes, validates the target path against `workspace_root`, and blocks the command outright with feedback if it falls outside that boundary"],[3],"A hook that runs before the Bash tool executes can validate the target path against `workspace_root` and block the call when it falls outside. It is the only option here that prevents the violation; an after-the-fact hook, a self-imposed check or a prompt rule can all fail or come too late.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[4,0,"Mock exam 5 · Q43","A code-review job outputs structured findings (`line_number`, `severity`, `description`) via enforced JSON schema output. Reviewing a sample of findings, several reference line numbers well outside the actual range of lines the PR touched — for example, a finding at line 287 on a PR that only modified lines 42–156. These out-of-range findings still get posted as PR comments, where they read as irrelevant noise. What's the most reliable way to stop out-of-bounds findings from being posted?",["Add an instruction to the review prompt: \"only report findings within the changed lines of the diff\"","Before posting each finding as a comment, validate its `line_number` against the PR diff's actual line range, and discard (or hold for manual review) anything that falls outside it","Switch to a larger model on the theory that it will have a better understanding of file scope","Lower the sampling temperature so line numbers come out \"more precise\""],[1],"A prompt instruction to 'only report changed lines' doesn't stop the model from producing an out-of-range line number. Validating each finding's `line_number` against the diff's real range before posting is deterministic and catches every case.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[4,0,"Mock exam 5 · Q44","A `.claude/rules/security.md` file scoped with `paths: [\"src/**/*.ts\"]` contains guidance like \"wrap all async operations in try/catch.\" Applied uniformly, this guidance also fires on test files such as `src/auth.test.ts`, where patterns like `expect(promise).rejects.toThrow()` are the idiomatic way to test a rejection and genuinely don't need a surrounding try/catch. Developers have started dismissing these findings as \"doesn't apply to tests.\" What's the best way to separate production guidance from test-file guidance here?",["Add an informal exception clause directly into the security guidance's prose: \"...except in test files\"","Add a second rule file scoped to test files specifically (e.g. `paths: [\"src/**/*.test.ts\"]`) containing test-aware guidance, so test files get conventions appropriate to tests instead of inheriting production-oriented rules wholesale","Remove all path-scoped rules and rely solely on a single root-level project memory file for every convention","Turn the security guidance off entirely until someone manually reviews every future finding"],[1],"A second rule file scoped specifically to test files lets test-appropriate conventions apply on their own terms, instead of test files inheriting a production rule (like mandatory try/catch) that doesn't fit idiomatic test code.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q45","A test-generation prompt says \"write thorough unit tests,\" and the resulting tests assert on implementation details — e.g. checking that a specific internal helper function was called a specific number of times — rather than on observable outcomes. The tests pass initially, but as soon as the implementation is reorganized (with identical external behavior), they break, generating churn complaints even though nothing user-facing changed. The prompt already includes \"focus on behavior.\" What's the most effective next step?",["Provide 2–3 concrete before/after examples contrasting an implementation-detail test with a behavior-driven test for the same function, and document the distinction as a standard in `CLAUDE.md`","Switch to a larger model, expecting it to have an inherently better grasp of testing philosophy","Lower `max_tokens` to force shorter, and hopefully simpler, tests","Have developers manually rewrite every generated test to remove implementation-detail assertions"],[0],"'Focus on behavior' hasn't resolved the ambiguity because 'behavior' needs to be pinned down concretely. Before/after examples that contrast an implementation-detail assertion with a behavior-driven one, plus the standard documented in CLAUDE.md, give the model a clear target.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q51","An invoice-extraction pipeline using `tool_use` with a strict JSON schema produces syntactically valid JSON every time, but a downstream review flags that a `vendor_name` value like \"Acme Corp\" sometimes appears in the output even though no such name exists anywhere in the source document. The schema defines `vendor_name` as a required string. What change would most reliably catch this kind of hallucination going forward?",["Make `vendor_name` nullable instead of required","Add a `vendor_source_location` field (e.g., \"letterhead,\" \"signature block,\" \"table header,\" or null) documenting where in the source the vendor name was actually found, forcing the extraction to ground its claim in something checkable","Add a few-shot example that explicitly instructs the model not to hallucinate","Lower the temperature to force more deterministic output"],[1],"Schema validity only confirms the JSON is well-formed, not that a claimed value actually exists in the source.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q52","A contract-extraction pipeline has two tools: one for prose clauses, one for tabular terms. Many real contracts contain both. The two tool descriptions currently say one extracts \"contract text\" and the other extracts \"document tables,\" but in practice the model tends to call only one of the two tools even on documents that clearly contain both prose and tables. What's the most direct fix?",["Add a preprocessing step that physically splits every document into separate table-only and prose-only files before extraction","Rewrite both descriptions to clearly state which data each tool covers, and explicitly note that documents containing both prose and tables should trigger both tools in sequence","Force `tool_choice` to a single specific named tool","Merge the two tools into a single combined extraction tool"],[1],"Tool descriptions are the primary signal driving selection; when they're vague about scope and silent on documents that need both tools, the model has no reason to call more than one.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[5,0,"Mock exam 5 · Q53","A team processes 40 vendor invoices as a single long batch within one conversation. The first 10 or so extract cleanly, but starting partway through the batch, later invoices begin returning vendor names, account numbers, or reference codes that actually belong to an earlier invoice in the same batch, not the one currently being extracted. What change would most reliably eliminate this cross-document carryover?",["Increase `max_tokens` to give the model more room to extract carefully","Lower the model's temperature","Add a scratchpad listing every vendor and reference number seen so far, instructing the model to avoid reusing any value already on the list","Split the batch into independent single-invoice extraction calls instead of processing all 40 within one shared conversation"],[3],"Processing all 40 invoices in one shared conversation lets details from earlier documents bleed into later extractions as context builds up. Independent single-invoice calls give each document a clean context, which removes the carryover.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q54","A purchase-order extraction schema requires a `po_number` field and also has a `document_type` enum (`\"purchase_order\" | \"invoice\" | \"quote\"`). In practice, many documents get classified as `\"purchase_order\"` even though they're actually invoices that never contained a PO number at all — and validation, which runs only after the full extraction is returned, then fails on the missing `po_number`. What change would most reliably improve accuracy here?",["Make `po_number` nullable so invoices no longer fail validation, while keeping `document_type` required as-is","Keep retrying the same prompt until validation happens to pass","Restructure extraction into two steps: first classify the document type from its structure/headers, then only require `po_number` when that first step actually confirms the document is a purchase order","Drop the `po_number` requirement from the schema entirely"],[2],"Whether `po_number` should even be expected depends on the document actually being a purchase order. Classifying the document type first and only then requiring `po_number` stops invoices from being forced into the purchase-order schema.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q55","A contract-extraction schema has a required `contract_start_date` field. Some contracts state both an \"executed date\" (when the parties signed) and a separate \"effective date\" (when obligations actually begin), and these differ. The model picks inconsistently between the two across otherwise-similar contracts, and adding a couple of generic few-shot examples hasn't resolved the inconsistency. What's the next step?",["Add few-shot examples that include the explicit reasoning for the choice (e.g., \"when both dates appear, prefer the effective date, since that's when obligations actually begin\") plus a schema-level comment stating that precedence rule directly","Merge both dates into a single freeform text field instead of picking one","Switch to a larger model and hope it infers the right precedence on its own","Increase `max_tokens` to give the model more room to reason about which date to pick"],[0],"Generic examples weren't enough because they didn't show why one date should be preferred over the other. Adding the explicit precedence reasoning to the examples, plus a schema-level note stating the rule, gives the model a consistent basis for the choice.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q58","A team processes 500 supplier invoices every business day and wants to move extraction to the Message Batches API to capture a meaningful cost discount. Current same-day processing takes about 2 hours from submission. Downstream financial-close processes need results by 9 AM the next business day. The Batches API carries no latency SLA and can, in the worst case, take up to 24 hours. If a batch is submitted at 6 PM, what's the latest it might reasonably return under that worst case, and what does that imply?",["Always by 8 AM the next morning, so the move is safe as planned","Within roughly 2 hours, the same as the current synchronous process","There's a documented, guaranteed 18-hour turnaround specifically for financial workloads","As late as 6 PM the following day (24 hours after submission) in the worst case — which would blow past the 9 AM downstream deadline entirely, meaning this workflow shouldn't rely on the Batches API for its full volume without a real fallback plan"],[3],"With no latency SLA, a 6 PM submission could in the worst case take the full 24 hours, landing right around 6 PM the following day — well past the 9 AM downstream deadline.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q60","Six months into production, a team wants to analyze why certain extractions get rejected by downstream reviewers. Current logs record only `document_id`, `field_name`, `extracted_value`, and a final `disposition` of accepted or rejected — nothing about the document itself. The team suspects failures cluster around things like poor-quality scans, handwritten amounts, very long multi-page contracts where key terms appear late in the document, or particular vendor formats, but the existing logs give no way to confirm or prioritize any of that. What should be added to enable real root-cause analysis?",["A recurring manual review of a random sample of rejections, done by hand, to look for patterns","A random UUID per extraction, purely for tracing a record back to its source document","A separate machine-learning model trained specifically to predict which documents are likely to fail","Structured document metadata logged alongside each extraction — source type (scanned vs. native), an OCR-quality signal where applicable, page count, and roughly wh
