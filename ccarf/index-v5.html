th tools into a single `check_product_status` tool that returns eligibility and warranty status in one call","Expand both descriptions with input formats (e.g., \"accepts order ID + SKU\"), example queries, and explicit boundaries (e.g., \"use this for return eligibility only, not refund amounts\")"],[0,3],"Both are description-quality fixes: A renames the tools and adds explicit non-use cases, D adds input formats, example queries, and explicit boundaries. These are the first rung on the fix ladder.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[3,0,"Mock exam 4 · Q13","A `.claude/settings.json` hook is configured with `matcher: \"Bash\"`, `type: \"command\"`, intended to block any Bash invocation that references production credentials. The hook's script correctly detects and prints the matched credential key name in logs, but Bash commands referencing those credentials still execute anyway. What's the most likely fix?",["Change the matcher from `\"Bash\"` to a regex like `\"Bash.*\"` so it matches the tool name correctly","Make sure the hook's script exits with code 2 (or prints a JSON deny decision) when it detects a match — printing a log line, or exiting with 1, does not block the tool call","Move the hook from `PreToolUse` to `PostToolUse`, since that's when the final decision on the Bash call is made","Add a separate `{\"type\": \"approval\"}` hook entry alongside the existing command hook"],[1],"A command hook blocks a `PreToolUse` call only when it exits with code 2 or returns a deny decision in JSON; exit 1 and other codes are non-blocking errors, and log output alone changes nothing. The `Bash` matcher is already correct, `PostToolUse` runs after the command has executed, and there is no `approval` hook type.\nUpdated 2026-11-03: reworded: only exit code 2 (or a JSON deny decision) blocks; 'any non-zero exit' was incorrect per hooks docs.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[3,0,"Mock exam 4 · Q14","A developer needs to add one new database index to speed up a slow, already-diagnosed query. The change touches one file, is 5–10 lines, and the team has already agreed on which index to add. Should this go through plan mode first?",["No — plan mode is built for exploring multiple valid approaches on complex, multi-file work; a single well-understood, already-decided change doesn't need that overhead","No, but only because this is a bug fix; any new feature work should always go through plan mode","Yes — plan mode should review the indexing strategy before any implementation","Yes — plan mode is required to check the index doesn't affect other queries"],[0],"Plan mode earns its overhead on multi-file work with several genuinely valid approaches; a single-file, already-decided, five-to-ten-line change gets nothing extra from a planning pass and only adds latency.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q16","A convention that all new database migrations follow a specific naming/structure pattern needs to apply to files under both `migrations/` and `tools/legacy-migrations/` — two directories with no other relationship. What's the most maintainable way to enforce this?",["Create `migrations/CLAUDE.md` and `tools/legacy-migrations/CLAUDE.md`, each repeating the same convention","Create a single `.claude/rules/migrations.md` with `paths: [\"**/migrations/**/*.sql\", \"**/legacy-migrations/**/*.sql\"]` frontmatter","Add a \"Migration\" section to the root `CLAUDE.md`","Build a custom `/migration-check` skill that developers must remember to run before creating a migration file"],[1],"A single glob-scoped `.claude/rules/` file with paths covering both migration directories applies the convention wherever migration files live, without duplicating it across directory CLAUDE.md files (A), bloating the root CLAUDE.md (C) or relying on someone to run a skill (D).","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[3,0,"Mock exam 4 · Q18","An automated PR review pipeline deliberately uses a fresh, independent Claude Code instance to review code rather than reusing the session that generated the fix. A reviewer complains that this independent reviewer still misses a subtle cross-function interaction bug that seems obvious once pointed out. Is the independent-instance design itself the problem?",["No — the point of an independent instance is specifically to avoid the generation session's own reasoning bias, which otherwise makes it less likely to challenge its own prior decisions; this particular miss is a separate issue, not evidence the pattern is wrong","Yes — both steps should run in the same session so context carries over cleanly","Yes — the independent instance should be given the original session's generation reasoning so it has more context to work with","No, but the reviewer instance should switch models between runs to add perspective diversity"],[0],"This is intentional design: a session that generated the fix keeps its own reasoning and is less likely to challenge its own decisions, so an independent reviewer is used to avoid that bias. One missed bug is a separate issue (for example, the review needs a cross-file pass), not evidence the pattern is wrong.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q19","A skill's `SKILL.md` sets `context: fork` and `argument-hint: \"Describe the target API\"`. A developer expected that invoking it with no arguments would make Claude Code prompt them to describe the API. Instead, the hint text appears in autocomplete while typing, and invoking it without arguments simply runs the skill with an empty `$ARGUMENTS`. Is this the correct, documented behavior of `argument-hint`?",["No — `argument-hint` should block invocation until an argument is supplied; running with empty arguments is a bug","No — `context: fork` disables prompting behavior for any skill run as a sub-agent","Yes — `argument-hint` is only hint text shown during autocomplete; it doesn't prompt for, require, or validate arguments","Yes, but only because `argument-hint` silently validates the argument against a schema before running"],[2],"Per the skills frontmatter reference, `argument-hint` is a hint shown during autocomplete to indicate expected arguments. It doesn't prompt, enforce, or validate anything, and `context: fork` doesn't change that. If arguments are needed, the skill body should handle a missing `$ARGUMENTS`.\nUpdated 2026-11-03: premise corrected: argument-hint is autocomplete text only and never prompts.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q26","A finance-research system has `fetch_market_data` (stock prices, trading volumes, market indices) and `fetch_economic_indicators` (GDP, unemployment, inflation from government sources), described only as \"Retrieves market information\" and \"Retrieves economic information\" respectively. Logs show the synthesis subagent frequently calls `fetch_market_data` for inflation figures and `fetch_economic_indicators` for stock prices — both tools work correctly when called, they're just being selected for the wrong job. What's the most effective first fix?",["Remove one of the two tools and route all lookups through the survivor","Rewrite both descriptions with specific input formats, example queries, the exact data types each returns, and explicit boundaries (e.g., \"use `fetch_market_data` only for prices and trading volumes, never macroeconomic aggregates\")","Add 10 few-shot examples showing correct tool selection for each data type","Add a keyword-based pre-router that intercepts the request and picks the tool before the model sees it"],[1],"Thin, near-identical descriptions (\"Retrieves market information\" / \"Retrieves economic information\") give the model no basis for correct selection.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[5,0,"Mock exam 4 · Q27","(Select TWO) A synthesis task is combining three credible sources on green-energy job creation: a 2019 peer-reviewed study reporting X%, a 2023 government report reporting a different Y%, and a 2024 corporate survey reporting Z%, close to Y%. Which TWO practices best support reliable synthesis without misrepresenting what the evidence actually shows?",["Attach the publication/collection date to each figure, so a reader can tell a genuine trend over time apart from a real contradiction between sources","Report only the most recent figure (Z%), since 2024 data is presumably the most accurate","Preserve each figure with its own source attribution, methodology, and date, and explicitly flag the disagreement rather than silently resolving it","Average the three figures into a single blended estimate so the reader gets one clean number"],[0,2],"Dating each figure lets a reader separate a genuine trend over time from an apparent contradiction (A), and keeping each figure with its source, methodology and date while flagging the disagreement (C) avoids silently resolving it. Reporting only the newest figure or averaging them misrepresents the evidence.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[2,0,"Mock exam 4 · Q32","An MCP server `code_analyzer` exposes `find_pattern` (pattern/regex matching over code) and `trace_dataflow` (semantic, cross-function-boundary analysis that can follow unsanitized input to a security-critical sink). `trace_dataflow` is strictly more capable for this class of investigation, but logs show Claude consistently reaches for `find_pattern` instead, even on tasks that clearly call for cross-boundary tracing. What's the most likely cause?",["Claude prefers MCP tools over built-ins by default, so some other, unrelated setting must be suppressing that preference here","The MCP server needs to be reconfigured at the network level to expose `trace_dataflow` with higher priority","`trace_dataflow`'s description doesn't clearly explain its semantic, cross-boundary capability or when it should be chosen over simple pattern matching","The built-in `Grep` tool has higher precedence than any MCP tool and is preferred by default"],[2],"Tool selection is driven primarily by description quality; a thin or vague description for the more capable tool loses to a familiar, simpler alternative by default.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q34","An `Edit` call's anchor text matches three times in the target file — in three copies of the same duplicated boilerplate block, so even several surrounding lines are identical at each occurrence. Only the third occurrence should change. The call fails because the anchor isn't unique. What's the reliable next step?",["Retry `Edit` with a longer anchor that includes a few more surrounding lines","Use `Bash grep -n` to get the line number, then build a new `Edit` call anchored on that line number","Tell the user ambiguous anchors are a hard limitation and the edit must be done manually","Use `Read` to load the full file, manually identify the correct occurrence, then use `Write` to save the corrected full-file version"],[3],"Here the surrounding lines are identical at every occurrence, so lengthening the anchor still won't make it unique. The reliable fallback is `Read` to load the whole file, identify the correct occurrence, then `Write` the corrected full-file version. `Edit` has no line-number anchor, and the edit doesn't need to be handed back to the user.\nUpdated 2026-11-03: stem reworded so a longer anchor can't become unique, leaving Read+Write as the one defensible answer.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[2,0,"Mock exam 4 · Q36","A developer wants to try out a prototype MCP server for dependency-graph analysis that no one else on the team needs yet, and that might be misconfigured and break things while they experiment. Where should this go so it doesn't affect teammates or clutter shared config?",["In `~/.claude.json` on their own machine","In `.mcp.json` at the repo root, flagged with an `\"experimental\": true` field","In a new `.claude/experimental-mcp.json` file in the project","In a `.mcp-local` file added to `.gitignore`"],[0],"`~/.claude.json` is the user-scoped location intended for exactly this: a personal, experimental server that shouldn't be pushed into the shared project configuration or risk breaking anything for teammates.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q48","A reviewer keeps flagging functions as \"missing error handling\" even when a `try/catch` is clearly present. The instruction \"flag only critical cases where error handling is missing\" hasn't helped, and adding 4–5 illustrative good/bad examples hasn't moved the false-positive rate either. What additional specificity is actually needed?",["Replace the vague instruction with an explicit, codebase-specific rule — e.g., \"flag only when function X is called outside a try/catch, and the uncaught exception types are Y or Z, which can cause data loss or DB inconsistency\"","Increase the example count from 4–5 to 15+, covering more edge cases","Switch to a larger, more capable model","Disable the \"missing error handling\" category entirely until a dedicated, separately-trained classifier can be built for it"],[0],"'Flag only critical cases' is still a subjective judgment. An explicit, codebase-specific rule (naming the function, the exception types and the concrete consequence that matters) removes the ambiguity that generic examples alone couldn't.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[3,0,"Mock exam 4 · Q49","(Select TWO) A team's multi-file PR reviews show inconsistent depth (some files get thorough analysis, others superficial), the same pattern flagged in one file but waved through in another, and missed cross-file dependencies. Which TWO changes address this without ballooning API cost or gutting review depth?",["Consolidate everything into one large single-pass prompt covering the whole PR, to force consistent standards","Split into per-file local-analysis passes for focused precision, followed by a dedicated cross-file integration pass to catch consistency and cross-file issues","Reuse one Claude Code session across multiple PRs' reviews to build up consistent standards over time and save on session startup cost","Run each PR's review as an independent Claude Code invocation, so no prior PR's reasoning carries over and biases the current one"],[1,3],"Per-file passes plus a separate integration pass directly address inconsistent depth and missed cross-file issues (B); independent instances per PR prevent one PR's reasoning from biasing the next (D).","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[4,0,"Mock exam 4 · Q51","A receipt pipeline adds OCR to pull text from vendor logos on scanned images. The model now confidently fills the vendor field with plausible-sounding names that don't appear anywhere in the OCR text, the original image, or the email body — but schema validation passes, since `vendor` is syntactically a valid string. These hallucinated vendor names carry high confidence scores (0.92) and bypass human review entirely, surfacing only weeks later during downstream reconciliation. What should be added to the schema first to catch this?",["A higher `max_tokens` budget, giving the model more room to \"think\" before extracting","A required `ocr_confidence` field, so low-OCR-quality documents can be skipped","An `is_hallucinated` boolean that the model self-reports","A `source_location` field (e.g., \"header\", \"footer\", \"email_body\", \"ocr_image\") tracking where each extracted value came from, enabling a validation step that checks the value actually appears in the identified location"],[3],"Schema validity guarantees the JSON is well-formed, not that the value is grounded in the source.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[4,0,"Mock exam 4 · Q54","An `amount` field keeps extracting as the string `\"1234 dollars\"` instead of the required numeric type. A retry loop feeds back the original document, the failed output, and the exact validation error each time, but four consecutive retries reproduce the identical mistake. What should happen next, and why is a fifth retry not the answer?",["Recognize this as a schema-design problem, not a retry problem: accept `amount` as a string, add a deterministic post-processing step to parse \"1234 dollars\" into `1234`, and move that specific validation out of the pre-approval retry loop entirely","Persist through up to 10 retries — enough repetition eventually corrects this class of error","The tokenizer is likely confusing the word \"dollars\" with the number; rephrase the validation error using only numerals and currency symbols","Retry a fifth time with a larger `max_tokens` budget, in case the model needs more room to reason through the fix"],[0],"Four identical retries hitting the same wall show the problem is the schema, not the prompt. Accept the value as a string, parse it deterministically afterward, and take that check out of the retry loop; more retries or more tokens won't change the outcome.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",0],[5,0,"Mock exam 4 · Q57","(Select TWO) A confidence-based review process flags everything below a threshold and auto-approves the rest, but three failure classes never surface through it: vendor hallucinations on less-common vendors, category misclassification on ambiguous purchases, and date-parsing errors in non-US formats — all emerging only in downstream audits weeks later. Which TWO additions would help catch these specific classes of failure?",["Stratified random sampling that specifically targets high-confidence extractions the review process would otherwise never look at, to surface patterns confidence scoring structurally can't see","Mandatory human review for any extraction involving a newly-encountered vendor name or document type the model hasn't handled before","Raise the confidence threshold to 0.95 so nearly everything routes to human review","Run a second, independent extraction pass on the same document, and route to human review whenever the two passes disagree on any field"],[0,1],"Stratified sampling of high-confidence extractions targets exactly the blind spot a threshold-only review has (A); mandatory review for new vendors or document types catches cases the model has no track record on yet (B).","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[4,0,"Mock exam 4 · Q58","A pipeline computes per-field confidence (amount 0.95, vendor 0.93, category 0.38, date 0.87) and an `overall_confidence` as their geometric mean (0.78), auto-approving anything above 0.75. An audit finds approved receipts where category confidence was as low as 0.32 (masked by high amount/vendor scores) and the category field was wrong in downstream processing — while receipts where every field sits around 0.72, yielding an overall_confidence of 0.72, are correctly categorized every time they're checked. What's the actual design flaw?",["Geometric mean is the wrong statistic; switch to arithmetic mean instead","A single very low field can be masked by the rest and still cause a real downstream failure; use a minimum-field threshold (e.g., auto-approve only if every field individually clears 0.70) instead of any single aggregate statistic","Confidence scoring in general is unreliable here; replace it with a fixed percentage-based approval quota instead","The 0.75 threshold is simply too high; lowering it to 0.60 would reduce review workload without changing anything else"],[1],"A geometric mean lets one very weak field hide behind several strong ones, which is exactly how a category confidence of 0.32 got auto-approved.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[4,0,"Mock exam 4 · Q59","A vendor-name extraction repeatedly returns \"AMZN\" instead of \"Amazon.\" A retry loop re-prompts with \"always expand vendor names to their full legal name\" and retries, but after five attempts on the same document, the model still returns an abbreviation roughly 20% of the time. On a different, unrelated validation failure (\"vendor missing entirely\"), a single retry with the error message resolves the issue 85% of the time. What does this contrast suggest, and what's the right fix for the abbreviation case specifically?",["Increase retries to 10 for this category too — persistence eventually pays off","The model is reproducing a real-world abbreviation it has strong prior associations with, and re-prompting won't reliably override that; add a deterministic post-processing step — an alias lookup table (e.g., \"AMZN\" → \"Amazon\") — applied before downstream validation, instead of relying on the retry loop","This points to a model-capability gap; switch to a different model better suited to entity extraction","Treat any abbreviation as a hard validation failure and reject the extraction outright rather than retrying"],[1],"A retry loop that plateaus, compared with another failure type where one retry usually works, shows the model is drawing on a strong learned association ('AMZN') that re-prompting won't reliably override. A deterministic alias lookup applied before validation fixes it every time.","blob/main/mock-exam/exam-4-answers.md","2026-07-25",1],[5,0,"Mock exam 5 · Q3","After 12 turns investigating a disputed charge, your agent has verified the customer, retrieved three years of billing history, and identified the root issue ($200 overcharge on order #7743 from March). But when asked to \"process the refund,\" it hesitates and asks \"just to confirm, the order with the issue was...?\" instead of recalling the specific order number. What's the problem, and how should it be fixed?",["Require the customer to re-state the order number before proceeding","The model's context window is too small; increase it to preserve history better","Extract a persistent \"case facts\" block containing critical details (customer ID, order number, issue amount, dates) that's carried separately from the narrative conversation history","Reduce the number of turns allowed before summarization"],[2],"This is context loss in a long investigation: specific numbers and identifiers can fade from a narrative history even though the conversation is nominally still \"about\" the same case.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q5","The MCP backend exposes tools that list available refund policies, approved return-reason codes, escalation-queue names, and supported regions. In production, every new case triggers 4 discovery tool calls to learn what exists, consuming roughly 800ms of latency before any customer-specific lookup happens. These lists change weekly but are read-only. Logs show the agent burns token budget on discovery before it can act. What's the most appropriate integration change?",["Create a single `get_system_metadata` tool that returns all four catalogs at once","Cache the tool outputs in a `CLAUDE.md` file so the agent reads them once","Require the agent to skip discovery entirely and rely on its training knowledge of policies","Expose these catalogs as MCP **resources** (URI-addressable reference data) rather than **tools**, so the agent can read them directly without consuming a model decision or a round-trip"],[3],"Read-only, rarely-changing catalogs that exist to be discovered rather than acted upon belong in MCP resources, not tools — removing the round-trip decision cost entirely.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[5,0,"Mock exam 5 · Q6","A case is escalated to a human agent with a 72% confidence score and a note saying \"case seems complex.\" But investigation shows: customer identity is verified, order exists, refund window is open, damage evidence is clear, and refund amount is within policy. The escalation was triggered by an engineer's \"confidence < 80% → escalate\" rule. The confidence actually dropped to 72% only because the agent was uncertain whether a small warehouse fee was refundable, not because the case itself was complex. What's fundamentally wrong with this escalation signal?",["The confidence threshold is too strict; raise it to 60%","Confidence scores should be averaged across the whole case, not reported per-turn","Self-reported model confidence is poorly calibrated: it correlates weakly with actual case complexity, so it can be confidently wrong on hard cases and uncertain on genuinely simple ones","Use turn count instead of confidence; escalate after 6 turns regardless of complexity"],[2],"Self-reported confidence is a poorly calibrated proxy for case complexity: it can dip on one unresolved sub-question even when everything else about the case is clear-cut, which is exactly what happened here. Escalation should follow explicit criteria, not a confidence threshold.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[1,0,"Mock exam 5 · Q7","A customer asks, \"Can you process my refund now?\" The agent's response includes a tool-use block for `process_refund` with correct parameters, but the response text also says \"I've processed your refund — you should see it in 3–5 business days.\" The application's agentic loop terminates after seeing this final text and never executes the pending tool call, so the customer gets a confirmation message but no refund is actually issued. What's the design flaw?",["The loop must check whether `stop_reason` is `\"tool_use\"` to know a tool call is pending; if so, it must execute the tool and continue the loop rather than treating the response as final just because text is also present","The model should never generate customer-facing text in the same response as a tool call","Add a deterministic check for phrases like \"processed\" in the text to prevent premature loop termination","The response should be split into two separate API calls to avoid mixing concerns"],[0],"The loop must check whether `stop_reason` is `\"tool_use\"` to know a tool call is pending, and execute it regardless of any accompanying text. Treating the presence of text as 'done' is the anti-pattern that let the confirmation go out without a refund.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q8","(Select TWO) Your tools `validate_refund_eligibility` (checks policy, return window, customer history — slower, high compute) and `quick_eligibility_check` (under-48-hours, no prior returns — fast, lightweight) are frequently chosen incorrectly for each other's use case. Additionally, both tools return a generic `{\"error\": \"backend unavailable\"}` for timeouts, invalid input, and permission errors alike, so the coordinator can't distinguish retryable from non-retryable failures. Which TWO changes would best improve reliability?",["Consolidate into a single tool with a `check_level: \"quick\" | \"full\"` input parameter","Expand both tool descriptions with explicit use cases: e.g., \"`quick_eligibility_check`: under-48-hour simple returns only; `validate_refund_eligibility`: all other cases, including policy exceptions\"","Structure error responses to include `errorCategory: \"timeout\" | \"validation\" | \"permission\" | \"policy\"` and `isRetryable: true | false`","Give both tools identical descriptions so the agent has flexibility in choosing"],[1,2],"Option B fixes the tool-selection confusion by making each tool's intended use case explicit, and option C gives the coordinator structured error metadata so it can tell retryable failures from non-retryable ones. Merging the tools or giving them identical descriptions makes selection worse.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q13","During a long codebase exploration, a developer accumulates a large volume of context from verbose grep output, file reads, and traces. Claude starts answering vaguely — \"typical patterns\" instead of specific class names. The developer runs `/compact` with no arguments, and afterwards answers are still vague because the summary dropped the specific class names and file paths they care about. What's the most effective next step?",["Run `/compact` twice; the first invocation only validates configuration","Run `/compact` with focus instructions (e.g. `/compact keep the auth module's class names, file paths and call chain`) so the summary preserves those specifics","Compaction only takes effect if the session is fully restarted afterward","Pass a verbose flag to `/compact` so it keeps every tool output verbatim"],[1],"`/compact [instructions]` accepts optional focus instructions that steer what the summary keeps, so naming the class names and paths you need (B) preserves them while still freeing context. There is no validation-only first pass (A), no restart requirement (C), and no verbose flag for `/compact` (D); keeping everything verbatim would defeat compaction anyway.\nUpdated 2026-11-03: rewritten: no verbose/debug flag exists for /compact; commands docs document /compact [instructions] focus text.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q14","A skill spawns a subagent with `context: fork` to explore third-party API documentation and produce a long reference document summarizing it. When control returns to the main session, the developer asks Claude to use that reference for code generation, and Claude says it has no knowledge of any such reference. What's the underlying issue?",["`context: fork` writes to an isolated temporary sandbox, and any file the fork creates never exists outside it","A forked subagent's internal reasoning and any artifacts it produced are not automatically available to the parent session; whatever the fork returns as its final result must be explicitly passed back as context (or written somewhere the main session actually reads) for the main session to use it","Subagents are not permitted to produce long-form output when `context: fork` is set","The reference exists, but the developer must use a memory-inspection command to view fork-isolated outputs"],[1],"A forked subagent's internal reasoning and any artifacts it generates don't automatically flow back to the parent session — only whatever the fork explicitly returns as its result does.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q15","A project has two `PostToolUse` hooks configured in `.claude/settings.json` for the same `Edit|Write` matcher: one runs a formatter, the other validates the edited file against the team's linter. After an edit, the formatter reformats the code, but the linter — which ran moments earlier, before the formatter — reports a false violation based on the pre-formatted version of the file. What's the most likely cause, and the fix?",["Hooks always run concurrently regardless of configuration, so this failure is unavoidable","This is expected; the linter should be configured to tolerate whatever formatting prettier-style tools produce","The hooks are configured to run in an order where the linter executes before the formatter; the fix is to reorder them (or have the linter re-read the file after the formatter has run) so validation happens against the final, formatted version","Matching hooks for the same event run in parallel, so there is no execution order to rely on; the fix is to combine both actions into a single hook script that formats first and then lints the result"],[3],"Claude Code runs all matching hooks for an event in parallel, so the linter can read the file before the formatter has rewritten it. Hook order in settings.json is not a sequencing mechanism, so reordering cannot fix it; one script that runs the formatter and then the linter guarantees validation sees the final file. Concurrency is the cause, but the failure is avoidable, and tolerating false violations hides the real problem.\nUpdated 2026-11-03: answer changed: hooks docs say matching hooks run in parallel (no configurable order), so combining into one script is the fix.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q17","A developer is implementing a distributed caching layer in a service they've never worked with before. They ask Claude to implement it directly, with a long, detailed prompt describing the desired behavior. After review, they discover the design doesn't account for TTL-based expiry, an important pattern in that service, forcing a rework. On a second, similar task in the same unfamiliar service, they instead ask Claude to first surface open design questions before writing any code; Claude asks about TTL handling, consistency guarantees, and cache scope, all of which shape the eventual implementation. Why did this approach work better here?",["The interview approach forces more thorough documentation as a side effect","The interview approach is faster because it skips implementation","In an unfamiliar domain where the relevant tradeoffs and constraints aren't already known, surfacing design questions before coding catches gaps that a single detailed upfront prompt is likely to miss, since the prompt-writer doesn't yet know what they don't know","Interviewing Claude before implementation always produces objectively better code, regardless of context"],[2],"The interview pattern earns its value specifically in unfamiliar territory, where the person writing the prompt doesn't yet know which tradeoffs matter (like TTL-based expiry here) and so can't have specified them upfront.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q18","A developer is refactoring a function signature used across 30 files and updating its 15 call sites. After 12 files, they discover the new signature breaks an edge case they hadn't planned for and need to work out a fix. Should they fork the session to explore the fix, or keep working in the main session?",["Restart the whole task from scratch with updated requirements","Fork the session to explore the fix in isolation, then bring the result back into the main refactoring","Forking is only appropriate for documentation work, never for code changes","Continue in the main session — it retains full context of the 12 files already changed, avoiding lost work; forking here would isolate the fix but strip away the surrounding refactoring context the fix actually needs"],[3],"Continuing in the main session keeps the accumulated context of the 12 files already changed, which the fix depends on. Forking would isolate the fix from that context, and restarting throws the completed work away.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q23","A synthesis agent constantly needs to fact-check small claims mid-report — \"is 2023 the right year for that report,\" \"did that agency actually issue this,\" \"is this within the stated margin of error.\" Every check currently routes through the coordinator to a full-capability search subagent, adding a few seconds of round-trip latency each time, and the synthesis agent makes 80+ such checks per report. What tool-distribution change is most appropriate?",["Give the synthesis agent unrestricted access to the same web-search and document-analysis tools the other subagents use","Give the synthesis agent one narrow, scoped tool built specifically for quick single-fact verification, so the common case resolves locally, while genuinely complex verification still routes through the coordinator","Batch all 80+ checks into one large request sent to the coordinator at the very end","Remove fact verification from the synthesis step entirely to save latency"],[1],"A narrow, purpose-built verification tool for simple single-fact checks lets the frequent, low-complexity case resolve locally without a coordinator round trip, while genuinely complex verification still goes through the coordinator. Unrestricted search access invites misuse.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[2,0,"Mock exam 5 · Q26","A document-analysis subagent is scoped to extract findings only from a fixed, pre-approved set of internal PDFs. To let it double-check facts against the source text, it's given general-purpose web-search access as well. Within weeks, logs show it routinely uses that web-search access to pull in and cite outside sources the coordinator never approved, expanding scope well past the original document set. What's the most direct fix?",["Remove web search entirely and tell the subagent, via the system prompt, to rely only on the approved documents","Replace the general web-search tool with a narrowly scoped verification tool that can only check claims against the specific approved document set, not the open web","Let the coordinator strip out any external citations from the subagent's output after the fact","Add a stronger prompt warning against using search to expand scope"],[1],"The scope creep is a tool-design problem, not a prompting problem. Replacing general web search with a tool that can only verify claims against the approved document set makes scope expansion impossible, while keeping the legitimate need to double-check facts.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[5,0,"Mock exam 5 · Q27","(Select TWO) A synthesis agent is combining three findings on the same projected metric: one from a widely-cited academic paper published years ago, one from a very recent single industry report with no other source corroborating it, and one that's been independently confirmed by three unrelated sources. As currently configured, the synthesis agent assigns its highest confidence to the uncorroborated single industry report simply because it's the most recent, and treats the triple-corroborated finding as merely \"one opinion among several.\" Which TWO changes would most improve synthesis reliability here?",["Require every finding subagents pass to synthesis to carry its publication/collection date, methodology notes, and how many independent sources support it","Instruct synthesis to prioritize whichever finding is most recent, regardless of how many sources support it, since newer information supersedes older information by default","Have synthesis explicitly weight corroboration — a finding confirmed by multiple independent sources should be treated as stronger evidence than a single uncorroborated report, recency aside","Instruct synthesis to exclude any finding that isn't from the most recent source, to avoid outdated information entirely"],[0,2],"Requiring date, methodology and corroboration-count metadata on every finding (A) gives synthesis what it needs to judge evidence quality, and weighting corroboration over raw recency (C) fixes the specific error here. Preferring or keeping only the newest finding repeats the mistake.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[5,0,"Mock exam 5 · Q28","A multi-day research session is interrupted right after the search subagent finishes but before document analysis begins. The team wants to resume without re-running search from scratch. They restart the coordinator, and it sends document analysis a fresh prompt describing the new task — but never tells it what search already found. What's the most maintainable way to resume this kind of interrupted pipeline?",["Manually copy-paste the search subagent's raw output into every future prompt for the rest of the session","Just resume and let document analysis redo any lookups it needs; some redundant work is an acceptable tradeoff","Have each subagent export its completed state to a known location as it finishes, and have the coordinator load a manifest of that state on resume, re-injecting whatever a subsequent step actually needs","Discard everything from before the interruption and start the whole pipeline over"],[2],"Structured state exports plus a coordinator-loaded manifest on resume is the reliable recovery pattern: each subagent's completed work is saved in a known location, and resuming means loading that manifest and passing the next step what it needs.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q31","An agent explores a repository using an MCP tool for definition lookup and another for call-site discovery. Some calls fail during a long exploration session, and the integration currently returns every failure as `{\"isError\": true, \"message\": \"Tool unavailable\"}`, whether the cause is a transient network blip, a malformed query, or a rate limit. The agent retries every failure the same way, sometimes looping for a long time on a query that will never succeed no matter how many times it's retried. What must be added to the tool responses to fix the retry logic?",["Raise the maximum retry count and add exponential backoff uniformly across all retried calls","Remove the retry mechanism entirely and fail immediately on any error","Add an `errorCategory` (e.g. transient / validation / permission) and an `isRetryable` boolean to each error response, so the agent can distinguish a worthwhile retry from a hopeless one","Log additional detail in the failure message so a human can read it later"],[2],"An `errorCategory` plus an `isRetryable` flag lets the agent tell a worthwhile retry (transient) apart from a hopeless one (a malformed query that will fail identically every time).","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q32","A shared catalog of approved integrations (REST APIs, webhook destinations, supported SDK versions) is exposed as an MCP tool, `list_integrations`. During a typical 2-hour exploration session, the agent calls this tool 15+ times just to check what's available, and each call consumes a tool-use decision step even though the underlying list rarely changes within a session. What's the most efficient way to expose this catalog?",["Merge several related discovery tools into one larger tool with a more detailed description","Cache the tool's output into `CLAUDE.md` so the agent can reference it as static project memory","Expose the integration catalog as an MCP **resource** rather than a tool, so it can be read directly without spending a tool-use decision each time","Add the integration list as literal text in the system prompt"],[2],"A catalog that's mostly static within a session and exists to be looked up, not acted on, is a textbook fit for an MCP resource — it can be read directly without spending a tool-use decision on every check.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[2,0,"Mock exam 5 · Q34","One MCP database tool returns `{\"isError\": true, \"errorCategory\": \"transient\", \"isRetryable\": true}` on one call and `{\"isError\": true, \"errorCategory\": \"validation\", \"isRetryable\": false}` on a different call. If the agent's recovery logic treats every error identically and simply retries both the same way, what actually happens?",["Both fail regardless, and the agent should escalate both to a human immediately","The transient failure may well succeed on retry, but the validation failure (a malformed query, say) will keep failing identically every time, since retrying with the same bad input doesn't fix the input — wasting attempts and context on a call retrying can't help","Both eventually succeed on retry; the transient one just takes a bit longer","Neither will ever succeed, so all retries should simply be disabled everywhere"],[1],"Treating every error the same wastes effort on the validation failure, since retrying the same malformed input fails the same way every time. Only the transient failure has a real chance of succeeding on retry.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 5 · Q37","An MCP tool call returns an error with `errorCategory: \"permission\"`. What does this most likely indicate, and what should the agent do next?",["The operation timed out and will likely succeed if retried with backoff","The agent lacks sufficient authorization for this operation (missing credentials or an insufficient scope); retrying the same call won't change that outcome, so the right move is to escalate, request different credentials, or skip the operation rather than keep retrying","The input was malformed and should be reformatted before retrying","The operation actually succeeded, just with an empty result, and can be treated as a no-op"],[1],"A `\"permission\"` error category signals an authorization problem — missing credentials or an insufficient scope — which retrying the identical call will never resolve.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[3,0,"Mock exam 5 · Q41","A CI pipeline runs two independent jobs against the same PR: one does a general code review, the other runs a security-focused scan. Each spawns its own separate Claude Code invocation, and both happen to flag the same underlying issue (a missing null check on one specific line). Each job posts its own PR comment, so the same line gets two near-identical comments from two different \"reviewers.\" Developers complain about the redundant notifications. What's the most effective way to prevent this specific kind of duplication?",["Have whichever job runs second receive the first job's findings on the same PR as part of its input, with an instruction to skip anything the other job already flagged","Force the two jobs to run strictly one after the other rather than in parallel, so the second can read a results file the first one wrote","Store every finding in a central datastore and run a deduplication pass across all findings from both jobs before anything is posted to GitHub","Merge the two jobs into a single long-lived session so both sets of findings are produced together and can be reconciled before either is posted"],[0],"When two independent jobs can flag the same issue, giving the second job the first job's findings as input, with an instruction to skip anything already flagged, removes the duplication at the source.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q42","A test-generation step produces unit tests referencing a fixture path like `/opt/ci-fixtures/seed-data.json`. These tests pass on every developer's local machine, but roughly 60% of them fail once run inside the containerized CI runner, where that absolute path doesn't exist. What's the most likely root cause, and the most direct fix?",["The generated code assumes Unix-style paths; rewriting the tests to use Windows-style paths would resolve the CI failures","The test-generation prompt was never told that fixture paths must be relative to the repository root, and the project's `CLAUDE.md` doesn't document the test fixtures, helper utilities, or test-data layout actually available in the CI environment — so generation has no way to know the local absolute path won't exist there","CI containers mount volumes differently than developer machines; the fix belongs in the container configuration, not the generated tests","The test-generation step runs with `context: fork`, which is why it can't see the rest of the repository"],[1],"Nothing available to the test-generation step describes the CI environment's fixture layout, so the model can't know a developer-machine absolute path won't exist there. Documenting the available fixtures and repo-relative paths in CLAUDE.md (and the prompt) fixes the root cause.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q46","A test-generation step is given the existing test file as context specifically to avoid creating duplicate tests. It still generates a new test with the exact same name as an existing one in that file — both are named identically. When the suite runs, the second definition silently overwrites the first, and the original test never executes again without anyone noticing. What's the most direct fix?",["Adopt a policy requiring every test name in the codebase to be globally unique, enforced by developer discipline","Run the test-generation step multiple times and have a developer manually reconcile any conflicts","Disable test generation entirely for any file that already has existing tests","Include an explicit list of the existing test names already present in that file as part of the context, with an instruction to avoid reusing any of them"],[3],"The generation step had the existing test file as context, but nothing told it those exact names were already taken. An explicit list of existing test names, with an instruction not to reuse them, closes that gap directly.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[4,0,"Mock exam 5 · Q48","A code-review tool call returns findings with fields including `finding_type` (an enum: bug / style / performance / security) and `description` (free text). Every finding passes schema validation — the JSON is well-formed and every field has a legal value. But some findings are miscategorized: a finding with `finding_type: \"security\"` has a `description` reading \"variable naming could be more concise,\" which is clearly a style comment, not a security issue. This routes the finding to the wrong downstream review queue, and schema validation doesn't catch it. What's the most reliable fix?",["Add a deterministic post-generation check that cross-references `finding_type` against keyword/pattern signals in `description`, flagging likely category mismatches before the finding is routed anywhere","Lower `max_tokens` to encourage more concise, and hopefully more accurate, categorization","Add more fine-grained values to the `finding_type` enum to reduce ambiguity between categories","Switch to a larger model on the assumption it will have better categorical judgment"],[0],"Schema validation only confirms the JSON is well-formed and each value is a legal enum member — it has no way to check whether the chosen category actually matches the finding's own description.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[3,0,"Mock exam 5 · Q49","(Select TWO) A code-review job runs on every new commit pushed to an open PR. After a developer pushes a second commit that doesn't touch the code around a previously-flagged issue, the review re-flags that exact same still-unresolved issue again, posting a duplicate comment on the same line. Which TWO changes would most directly prevent this specific duplicate-across-commits problem?",["Include the prior review's findings for this PR as input to the new review run, with an explicit instruction to report only issues that are new, and not to re-post issues already flagged on this PR","Add a deduplication step that compares each new finding against the PR's previously-posted findings and drops exact or near-exact repeats before anything is posted","Run every commit's review inside one long-lived session that persists for the life of the PR, so the model's own memory of prior findings prevents repeats","Post every finding regardless, but append \"(also flagged on a previous commit)\" so developers can tell it's not new"],[0,1],"Passing prior findings forward with an instruction not to re-post issues already flagged on this PR (A), and a deduplication step that compares new findings against what's already posted (B), attack the duplication from two sides. A long-lived session invites carry-over bias, and posting duplicates with a label doesn't prevent them.\nExam-guide check 2026-11-03: option A reworded; \"report still-unaddressed issues\" would still re-post the unresolved issue this question is about.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[5,0,"Mock exam 5 · Q57","(Select TWO) An extraction QA process currently routes only low-confidence extractions to human review. Two systematic failure types have been slipping through at high confidence and going unnoticed until much later: (1) extracted values that don't correspond to anything an independent second read of the source document would find, and (2) values correctly extracted from the document but assigned to the wrong field entirely (right value, wrong slot). Both bypass review because both score high confidence. Which TWO changes would most directly help catch these two failure types?",["Add a lightweight second-pass extraction (or reviewer) that checks whether each high-confidence value is actually grounded in the source and assigned to a plausible field, rather than trusting confidence scores alone","Require every extracted field to be paired with a location or evidence reference in the source, so a value with no plausible grounding — or one grounded in a location that doesn't match its assigned field — can be flagged structurally, independent of the model's own confidence score","Raise the confidence threshold across the board so fewer extractions bypass review in general","Rely on the extraction model to self-report when it's uncertain about field assignment, and route only those self-flagged cases to review"],[0,1],"A second-pass check on high-confidence extractions (A) targets the blind spot a confidence-only process can't see, and an evidence or location reference for every field (B) lets ungrounded or misplaced values be flagged structurally. Raising thresholds or trusting self-reports still relies on the same miscalibrated confidence.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",1],[4,0,"Mock exam 5 · Q59","A vendor-management schema classifies every vendor with an enum: `\"supplier\" | \"contractor\" | \"service_provider\" | \"reseller\"`. In practice, some real vendor relationships (joint ventures, co-managed partnerships, regional distributor arrangements) don't cleanly fit any of the four categories, and the model is forced into a misclassification every time one comes up. What schema change best handles this kind of long-tail extensibility?",["Create an entirely separate extraction tool for every additional vendor type as it's discovered","Add a confidence score to the category field and route anything below a threshold to manual review, without changing the enum itself","Drop the enum constraint entirely and make `vendor_category` a free-text string","Add an `\"other\"` value to the enum, plus an optional `vendor_category_detail` string field for a free-text explanation whenever `\"other\"` is chosen"],[3],"An `\"other\"` enum value paired with a free-text detail field keeps the schema structured and queryable for common cases while accommodating the long tail of relationships that fit no predefined category. Dropping the enum loses structure, and a confidence score doesn't stop the forced misclassification.","blob/main/mock-exam/exam-5-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q2","Your refund tool exposes `refund_reason_code` (an enum: \"defective,\" \"not_as_described,\" \"customer_request,\" \"policy_exception\") and `refund_justification` (free text for additional context). Logs show the agent frequently stuffs long explanatory text into `reason_code` and leaves `justification` blank, even on cases where a bare code isn't enough detail for the finance team to evaluate. Both parameters already have descriptions. What's the clearest next fix?",["Rename both parameters to something else entirely, on the theory that new names alone will resolve the confusion","Add a hook that rejects the call outright whenever `justification` is empty","Expand both parameter descriptions with concrete guidance: `reason_code` gets \"must be exactly one of the enum values, never free text\"; `justification` gets an example of what to write when the code alone doesn't capture enough context","Merge them into a single free-text `refund_reason` field and parse category and detail out of it server-side"],[2],"Concrete guidance in the parameter descriptions (exactly what belongs in the enum versus the free-text field, with an example of when justification is needed) is the direct, lowest-effort fix for this kind of field misuse. A hook rejecting empty justifications doesn't teach the model what to write.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[5,0,"Mock exam 6 · Q6","Your written policy explicitly covers defective items (90-day window) and wrong items shipped (30-day window), but says nothing about unopened, resalable items returned outside either window — a real request that comes up in about 5% of cases. The agent currently escalates every one of these, which is dragging down first-contact resolution, even though the policy's spirit plausibly supports approving some of them. Under what condition should a case like this actually go to a human?",["When the agent has genuinely run out of applicable policy to reason from — the request falls into real silence or ambiguity in the documented rules — and further tool calls won't resolve that gap","Whenever sentiment analysis on the customer's message indicates frustration or urgency","Once the agent has made at least three tool calls, since that indicates a thorough-enough investigation","Whenever it involves more than one order or a large dollar amount"],[0],"Escalate when the documented policy is genuinely silent or ambiguous and no further investigation can resolve the gap. Proxies like order count, dollar amount, tool-call count or sentiment don't track whether the agent actually has policy to reason from.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[1,0,"Mock exam 6 · Q7","A pilot workflow needs three sequential checks — eligibility, account reconciliation, fraud assessment — where a red flag at any step should escalate immediately rather than continuing to the next step. The current coordinator runs all three regardless, and only checks for red flags once every step has already finished, wasting effort on cases that should have escalated at step one. What's the best fix?",["Remove the subagent layer and have one agent call all the underlying tools directly with branching logic","Run all three checks in parallel, then escalate afterward if any of them raised a flag","Bake a rigid, fully-enumerated if-then-else decision tree directly into the coordinator's prompt","Have the coordinator inspect each subagent's result before dispatching the next one, and escalate immediately the moment a red flag appears, instead of always running the full sequence"],[3],"Checking each step's result before dispatching the next lets the coordinator escalate the moment a red flag appears, instead of always paying for every remaining step regardless of outcome.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[2,0,"Mock exam 6 · Q8","(Select TWO) A new `recommend_resolution` tool suggests a refund, replacement, or store credit for a given order. Two problems compound in production: (1) when the order ID doesn't exist or the backend times out, it returns a flat `{\"error\": \"backend unavailable\"}`, giving the agent no way to tell a hopeless case (bad ID) from a worth-retrying one (timeout); (2) its description (\"Suggests a resolution\") is generic enough that agents sometimes reach for it instead of the more targeted `check_refund_eligibility` tool, missing important nuance that tool captures. Which TWO changes would most directly improve reliability here?",["Rewrite the description with explicit use cases and a clear boundary against `check_refund_eligibility` — including example queries and an explicit \"don't use this for X\" note","Add structured error fields — an `errorCategory` (e.g. \"transient,\" \"validation,\" \"business\") and an `isRetryable` boolean — so the agent can tell a timeout worth retrying from an invalid order that isn't","Merge `recommend_resolution` and `check_refund_eligibility` into one tool to remove the choice entirely","Give both tools identical descriptions so the model has maximum flexibility in choosing between them"],[0,1],"Option A fixes the selection confusion by drawing an explicit boundary against `check_refund_eligibility`, and option B lets the agent tell a retryable timeout from an invalid order that will never succeed. Merging the tools or giving them identical descriptions makes selection worse.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q9","A subagent tasked with verifying a customer's shipping address calls an address-validation tool twice; both attempts time out. It returns `{\"status\": \"complete\", \"findings\": \"Address verification unavailable\"}`. The coordinator reads this as \"verification succeeded, address is fine\" and proceeds to process the refund — but the address was actually wrong, and the shipment later fails. What's the core issue, and the fix?",["The coordinator should automatically escalate any case where address data comes back unavailable","The subagent's retry logic is too conservative; it should keep retrying until the backend eventually responds","The subagent needs a way to clearly distinguish \"I investigated and got a definitive answer\" from \"I was unable to investigate at all,\" using a distinct status or explicit failure marker — so the coordinator can't mistake an inability to verify for a successful verification","Address validation is too unreliable to be part of this workflow and should be removed"],[2],"The subagent needs a way to say 'I could not verify this' that is structurally distinct from 'I verified this and it's fine'. Without that distinction the coordinator can't avoid treating an inability to check as a clean result.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q17","Before implementing a cache-eviction strategy in a service the developer has never worked in, they want Claude to first surface open design questions (TTL vs. LRU, single- vs. multi-tier, what triggers invalidation) rather than go straight to an implementation. Which technique fits best?",["Plan mode, working from a detailed architectural brief the developer writes upfront","Test-driven iteration, backed by a comprehensive test suite covering cache behavior","The interview pattern — have Claude ask clarifying design questions before proposing any implementation","Direct execution, just with a longer and more specific initial prompt"],[2],"The interview pattern fits a domain unfamiliar enough that the developer can't yet know which trade-offs (TTL vs. LRU, single vs. multi-tier, invalidation triggers) matter. Having Claude ask design questions first surfaces them before any code is written.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q18","Your `.claude/settings.json` has two separate `PreToolUse` hooks: one matching `Write` that runs a formatting check, and one matching `Edit` that runs a type-checking validation. A developer performs an `Edit` on a file that would fail the formatting check but pass type-checking. Which hook(s) actually run?",["Only the type-checking hook runs, since it matches `Edit`; the formatting hook is scoped to `Write` and doesn't fire here at all","Neither hook runs, since hooks are only evaluated for `Write`, never for `Edit`","The formatting hook runs first alphabetically, blocks the call, and type-checking never runs","Both hooks run regardless of which tool was called — formatting is checked, then type-checking"],[0],"Hooks are scoped by their `matcher`; a hook matching `Write` simply doesn't fire for an `Edit` call, and vice versa.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q19","A skill at `.claude/skills/security-audit/SKILL.md` has `allowed-tools: [\"Read\", \"Grep\"]` in its frontmatter, meant to keep it to pure file analysis. Mid-run, it decides it needs to execute a quick `node --check` on a module and attempts to use `Bash`. What actually happens?",["`Bash` isn't in the skill's `allowed-tools` list, so the skill cannot invoke a tool outside that set","The `Bash` call is still possible: `allowed-tools` only pre-approves `Read` and `Grep` for that turn, so the `Bash` call goes through the session's normal permission rules (prompted, allowed, or denied as usual)","`Bash` is categorically disallowed inside any skill, regardless of configuration","The `Bash` call runs without any permission check, because skills inherit blanket approval for every tool in the parent session"],[1],"Per current docs, `allowed-tools` grants prompt-free use of the listed tools during the invoking turn; it does not restrict others, so `Bash` remains callable and is governed by normal permission settings (B). It isn't blocked by the list (A), skills have no blanket Bash ban (C), and nothing grants blanket approval (D). To keep the skill off `Bash`, use `disallowed-tools: Bash`.\nUpdated 2026-11-03: answer changed: current skills docs say allowed-tools pre-approves rather than restricts.\nExam-guide check 2026-11-03: accurate for current Claude Code docs, but if an exam question asks which frontmatter field restricts a skill's tools, the guide's answer is `allowed-tools`.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[2,0,"Mock exam 6 · Q23","A coordinator has access to a `discover_available_sources` tool that returns a static, pre-curated catalog of about 150 approved research sources. In practice, the coordinator calls this tool near the start of almost every research task just to see what's available, before doing anything else — an extra round-trip nearly every time, for content that barely changes. What's the most appropriate fix?",["Improve the tool's description so its purpose is clearer","Expose the source catalog as an MCP **resource** instead of a tool, since it's read-only reference material the coordinator needs to see, not an action the model is actively deciding to take","Force `tool_choice` so the discovery call always happens as the very first step","Hard-code the entire source list directly into the coordinator's system prompt"],[1],"A largely static, read-only catalog that exists to be looked up, not acted on, is what MCP resources are for. The coordinator can read it directly without a tool decision and round trip on every task.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[2,0,"Mock exam 6 · Q26","A synthesis subagent frequently needs to verify simple facts mid-synthesis — a publication date, an author's name, a cited statistic — and today every single one of these routes through the coordinator to a full search subagent and back, even though roughly 85% of these checks are genuinely simple lookups. The remaining 15% require real investigative depth. What's the best fix?",["Give the synthesis subagent unrestricted access to the same full search and analysis tools every other subagent uses","Give the synthesis subagent one narrowly scoped `verify_fact`-style tool for the common, simple case, while still routing the rarer, genuinely complex checks through the coordinator","Batch every verification and run them all in one dedicated pass only after synthesis has otherwise finished","Drop fact verification from the synthesis step entirely to reduce latency"],[1],"A narrowly scoped verification tool lets the simple 85% of checks resolve locally without a coordinator round trip, while the rarer complex 15% still go through the coordinator, where that overhead is worth it.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q27","(Select TWO) A synthesis step processes findings drawn from 40+ source documents in one pass to produce a report outline. The result is coherent overall, but source-specific detail steadily disappears as the report goes on: early sections name exact publication dates and sample sizes, while later sections describe their sources only in vague, generic terms. Which TWO changes would most directly improve this?",["Require every source to carry structured metadata (date, methodology, sample size) and require the synthesis output to preserve that metadata alongside whatever claim it's attached to, rather than letting it fall away during synthesis","Process all 40+ sources within a single, maximally long context window, on the theory that more surrounding text improves coherence","Require subagents to hand off structured claim-source mappings (claim text, source, date, a short excerpt) that synthesis is required to preserve rather than paraphrase away","Add a coordinator-level quality gate that checks the finished report for citation mismatches before it's considered final"],[0,2],"Requiring metadata to travel with every claim (A) and requiring structured claim-source mappings that synthesis must preserve rather than paraphrase (C) both target why specificity disappears: the details are being compressed away during synthesis. A longer context or an after-the-fact gate doesn't stop that.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q28","A search subagent times out partway through and returns structured context: \"provider timeout, transient, retryable, 60 of an expected 150 results collected.\" The coordinator now has to decide whether to return the partial 60 results, retry, or escalate to a human. What should actually drive that decision?",["Always return the partial results immediately, since some information beats none","Always escalate, since any incomplete research inherently needs a human to weigh in","Judge whether the 60 results already collected are enough to satisfy what the user actually asked for; if the missing 90 would plausibly change the conclusions, retry or escalate instead of quietly returning a report built on an incomplete picture","Keep retrying indefinitely until the full 150 results are eventually collected"],[2],"Whether to return partial results, retry or escalate should depend on whether the 60 collected results actually answer what the user asked, not on a blanket rule to always return what exists (A), always escalate (B) or retry forever (D).","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q30","A synthesis pass works through 50 research documents in one long invocation to build a report outline. Reviewers notice a clear pattern: the first 15 sources are cited with real specificity (exact dates, study design, sample sizes), while by document 40 the synthesis is only extracting broad, generic themes. Early report sections are well-supported; later ones are coherent but noticeably vaguer about their sources. What's the most effective architectural fix?",["Split synthesis into two phases: a \"map\" phase that extracts detailed, specific claims from each source independently, followed by a \"reduce\" phase that reconciles and synthesizes across those per-source outputs","Increase the context window so the model can hold onto specificity across all 50 documents at once","Simply process fewer source documents per run, trimming to whatever the model's effective attention span seems to be","Have the model attach a confidence score to each claim and drop everything below a cutoff from the final report"],[0],"A 'map' phase (detailed per-source extraction, each source getting full attention) followed by a 'reduce' phase (synthesis across those detailed outputs) directly counters the attention tapering across 50 documents. A bigger context window or fewer documents doesn't fix it structurally.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[3,0,"Mock exam 6 · Q45","Your team wants materially different review standards for code PRs (correctness, performance, security) versus documentation-only PRs (accuracy, link validity, tone), but both currently load the exact same root `CLAUDE.md`, so doc-only PRs end up getting flagged with irrelevant guidance about concurrency and database migrations. Where should the code-specific guidance move so it only loads when actual code files are involved?",["A `.claude/rules/code-standards.md` file with `paths` frontmatter scoped to source file patterns (e.g. `src/**/*.{js,ts}`), so it only loads when those files are actually being touched","Two separate root files, `code-review-CLAUDE.md` and `docs-review-CLAUDE.md`, with CI deciding which one to load based on PR labels","Move the code standards into an MCP tool the model can optionally call if it thinks it's relevant","Leave everything in the root `CLAUDE.md` and trust the model to disregard whatever doesn't apply"],[0],"A path-scoped rules file means the code-specific guidance only loads when Claude works with matching source files, so doc-only PRs aren't affected. Two full root files duplicate content, and an optional MCP tool or 'trust the model' relies on inference.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[4,0,"Mock exam 6 · Q48","A review schema includes a `performance_impact_ms` integer field. A finding claims \"this change saves 15ms,\" and the JSON is perfectly valid with every required field present — but the PR in question contains no benchmark, profiler output, or any other measurement backing that number up; it's pure speculation dressed as data. The schema itself allows any integer. Where should a check for this actually go?",["Add a post-generation validation step that checks whether a performance claim is actually backed by concrete evidence present in the PR (a benchmark, a profiler trace, a measurement comment) before it's allowed to stand","Lower the model's temperature to reduce how speculative its claims are","Remove the `performance_impact_ms` field from the schema entirely to eliminate the possibility of speculation","Add stricter JSON-schema-level constraints that ban integers outside some plausible range"],[0],"Schema validity only confirms the JSON is well-formed and the value is an integer — it says nothing about whether that number is actually grounded in anything.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,0,"Mock exam 6 · Q49","(Select TWO) A CI review agent occasionally needs to explain *why* a finding matters using a short supporting quote from the relevant internal policy or style-guide document, in addition to producing its structured JSON findings for downstream automation. A teammate suggests enabling the API's citations feature alongside the existing JSON-schema tool-use output so every explanation comes with an auditable source excerpt. Which TWO statements about this idea are accurate?",["Citations and structured JSON tool-use output can't be combined in the same request; if grounded excerpts are needed alongside structured findings, the schema itself should include an explicit evidence/excerpt field instead","The right fix is to add a `source_excerpt` (or similarly named) string field directly to the findings schema, populated from whatever policy text was actually provided in context, rather than trying to layer the citations feature on top of schema-enforced tool use","Citations work seamlessly together with structured, schema-enforced tool-use output in the same request, so the teammate's suggestion can be implemented exactly as proposed","Enabling citations will automatically populate every finding's `remediation` field with the correct fix, regardless of what schema is in use"],[0,1],"Citations and schema-enforced tool-use output can't be combined in the same request, so the way to attach a grounded excerpt to a structured finding is an explicit evidence/excerpt field in the schema itself (A, B). Citations don't populate schema fields like `remediation`.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[4,0,"Mock exam 6 · Q52","A vendor tax-ID field keeps returning plausible, correctly-formatted values that pass a regex check but fail when cross-referenced against the company's actual vendor registry — spot checks show some extracted IDs are off by a single digit from the real registered value. What change would most improve accuracy here?",["Make the field optional and validate it downstream instead of at extraction time","Tighten the regex further to reject more implausible-looking formats","Cross-check extracted tax IDs against the vendor registry before accepting them, or require a source-location/evidence field so the model has to point to exactly where in the document it read the ID","Raise the model's temperature to encourage more varied output"],[2],"A plausible, correctly formatted value can still be wrong. A registry cross-check or a source-location/evidence requirement catches that; a regex only verifies shape, not whether the specific digits match the real ID.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q53","(Select TWO) An extraction pipeline processes 50 supplier contracts as one long sequence of turns within a single conversation. Audit logs show a clear pattern: starting partway through the batch, some later contracts return a vendor name, payment term, or clause structure that actually belongs to an earlier contract in the same batch, not the one currently being extracted — roughly 7% of the batch shows this kind of cross-document leakage. Which TWO changes would most directly eliminate this?",["Process each contract as its own separate, isolated call rather than continuing all 50 within one shared conversation","Split the 50-contract batch into several smaller batches (e.g., 10 contracts per conversation instead of 50)","Add a validation pass that checks whether each extracted vendor name actually appears in that specific document's text","Lower the model's temperature to reduce variance between extractions"],[0,1],"Cross-document leakage inside one long shared conversation is a context-carryover problem. Isolating each contract in its own call (A) removes the shared context, and smaller batches (B) reduce how much context accumulates. A vendor-name check can detect some leaks but doesn't stop them happening.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[5,0,"Mock exam 6 · Q57","(Select TWO) A QA process auto-approves high-confidence extractions and sends low-confidence ones to human review. Audits find real errors slipping through in both directions — some high-confidence extractions turn out to have values with no real basis in the document, and some low-confidence ones sent to review turn out to have actually been correct all along. Which TWO additional checks would best catch the specific class of problem that confidence scoring is missing here?",["Route to review if the extracted vendor name doesn't actually appear anywhere in the source document's text","Route to review if extracted dates fail a basic business-rule check (e.g., a renewal date that falls before the effective date)","Lower the confidence threshold so a larger share of extractions get routed to review, without adding any new structural check","Route to review whenever the source document is flagged as handwritten or heavily scanned, based on OCR metadata alone"],[0,1],"Checking whether an extracted vendor name actually appears in the source (A) and checking dates against a basic business rule (B) are structural checks that catch a wrong value regardless of the model's confidence. Lowering the threshold or routing on OCR metadata alone doesn't target ungrounded values.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",1],[4,0,"Mock exam 6 · Q58","A team processes 8,000 invoices daily. Processing currently kicks off at 2 PM and results must be loaded into the accounting system by 5 PM the same day — a roughly 3-hour window. A cost-reduction proposal suggests moving this workload to the Message Batches API to capture a real cost discount. Is this workflow, as currently timed, a good fit?",["Yes — process the full daily batch via the Batches API; the window will comfortably cover it","Partially — only use the Batches API for the portion submitted early enough in the day that a worst-case delay still lands before 5 PM, and keep the rest on synchronous calls","No — the Batches API has no latency SLA and can, in the worst case, take up to 24 hours; that's fundamentally incompatible with a same-day, hard-deadline workflow like this one, so it should stay on synchronous calls entirely","Yes, but only if every indivi
