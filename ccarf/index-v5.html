dual invoice document stays under a certain file size"],[2],"With no latency SLA and a worst case of up to 24 hours, the Batches API is incompatible with a hard same-day, 3-hour deadline. Treating 'up to 24 hours' as something that will fit the window, even partially, puts the deadline at risk.","blob/main/mock-exam/exam-6-answers.md","2026-07-25",0],[4,2,"Example item 1","A dental-supply wholesaler extracts supplier invoices into its accounting system with tool use and a JSON schema. About a third of the invoices carry no purchase-order number. The schema marks `po_number` as a required string. An audit finds invoices with plausible-looking PO numbers that appear nowhere in the source document. Which change fixes this most directly? (Select ONE)",["Add \"Never invent a PO number\" to the system prompt.","Make `po_number` optional and nullable, so the model can return null when the invoice has no PO number.","Set tool_choice to force the extraction tool on every call.","Retry each extraction with the validation error appended to the prompt."],[1],"A third of the invoices have no PO number, yet the schema demands one. A required field pushes the model to fill it, so it invents a value; making it optional and nullable lets it return null honestly.","blob/main/reference/example-items.md","2026-10-27",0],[2,2,"Example item 2","A 12-person agency wants every developer who clones its repository to get the same issue-tracker MCP server in Claude Code. The server needs an API token, and the security lead forbids secrets in git. Which TWO actions together meet both requirements? (Select TWO)",["Ask each developer to add the server to their user-level config (`~/.claude.json`).","Paste the token into `.mcp.json` and add `.mcp.json` to `.gitignore`.","Define the server in the project's `.mcp.json` at the repository root and commit it.","Reference the token in that config as an environment variable, such as `${TRACKER_TOKEN}`, which each developer sets on their own machine."],[2,3],"Two requirements, so two actions. 'Every developer who clones' means team-wide, so the config is committed at project scope in `.mcp.json`. 'No secrets in git' means the token comes from an environment variable each developer sets.","blob/main/reference/example-items.md","2026-10-27",0],[2,2,"Example item 3","A developer-productivity agent must list every database migration file in a large monorepo before planning an upgrade. Migration files can sit in any folder, and their names always end in `.migration.sql`. Which built-in tool should the agent reach for first? (Select ONE)",["Glob, with the pattern `**/*.migration.sql`.","Read, opening the files in each folder to see which are migrations.","Bash, running a command that prints every file in the repository.","Grep, searching for the text \"migration\" across the repository."],[0],"The files are identified by their name, not by what is inside them, so Glob with `**/*.migration.sql` is the right first tool. Grep searches contents and would match unrelated files that mention 'migration'.","blob/main/reference/example-items.md","2026-10-27",0],[5,2,"Example item 4","A utility company's billing-support agent handles long chats. To stay inside the context window, older turns are summarised every 20 messages. Customers complain that late in a chat the agent quotes the wrong refund amount and forgets the callback date it promised. What is the most reliable fix? (Select ONE)",["Extract amounts, dates and promised actions into a structured case-facts block that is sent with every request, outside the summarised history.","Move to a model with a larger context window and stop summarising.","Summarise more often, so each summary is shorter.","Tell the agent, in the summarisation prompt, to take care to keep numbers exact."],[0],"What gets lost is exact transactional facts (an amount, a date, a promised callback), and progressive summarisation is what blurs them. A structured case-facts block sent with every request, outside the summarised history, keeps them exact.","blob/main/reference/example-items.md","2026-10-27",0],[1,2,"Example item 5","A team's research agent ends its loop when the assistant's reply contains the word \"done\". In testing it sometimes stops halfway (\"I'm done with the first source, moving on to the second\") and sometimes keeps going after the task is finished. How should the loop decide when to stop? (Select ONE)",["Stop after a fixed 10 iterations.","Continue while the response's stop_reason is \"tool_use\" and stop when it is \"end_turn\".","Stop as soon as a response contains any text rather than only tool calls.","Keep the word check, but switch to a rarer token such as `TASK_COMPLETE`."],[1],"The stop signal belongs to the structure of the response, not to the wording of the text. Loop while `stop_reason` is `tool_use` and stop on `end_turn`; word checks, text detection and fixed caps are all anti-patterns.","blob/main/reference/example-items.md","2026-10-27",0],[1,1,"practice-questions.md · Q1","Your agentic loop sometimes exits before the support agent has finished processing a refund. Inspecting the code, you find the loop terminates whenever the model's response contains any text content, on the assumption that text means a final answer. What is the correct termination condition?",["Terminate when the response's `stop_reason` is `\"end_turn\"`; continue executing tools when it is `\"tool_use\"`","Terminate when the model's text contains a completion phrase such as \"resolution complete\"","Terminate when the model stops requesting the `process_refund` tool for two consecutive turns","Terminate after a fixed maximum of 10 iterations to bound cost and latency"],[0],"`stop_reason` is the loop's control signal: on `\"tool_use\"`, run the tools and continue; on `\"end_turn\"`, finish. A fixed iteration cap as the main stop, parsing text for completion phrases, and heuristics about which tools were called are all named anti-patterns.","blob/main/practice-questions.md","2026-11-02",0],[1,1,"practice-questions.md · Q2","In your research system, the coordinator invokes the web search subagent, which returns findings. The coordinator then invokes the synthesis subagent, but the synthesis output ignores the search findings entirely and produces generic content. What is the most likely cause?",["The synthesis subagent's temperature is too high, causing it to ignore grounding data","The coordinator did not include the search findings in the synthesis subagent's prompt — subagents do not inherit the coordinator's conversation history","The synthesis subagent needs `allowedTools` to include the web search tools so it can re-fetch the findings","The Task tool truncated the findings because subagent prompts have a much smaller context limit"],[1],"Subagents run with isolated context and never inherit the coordinator's history, so findings must be passed explicitly in the subagent's prompt. Temperature (A) is a red herring, giving it search tools (C) would make it redo work rather than receive it, and the Task tool doesn't silently truncate prompts (D).","blob/main/practice-questions.md","2026-11-02",1],[1,1,"practice-questions.md · Q3","A compliance requirement states that account changes must never be executed until two-factor identity verification has succeeded. Your system prompt states this rule prominently, and testing shows 99.2% compliance. The compliance team says 99.2% is unacceptable. What should you do?",["Move the rule to the top of the system prompt and repeat it before each tool definition","Add few-shot examples demonstrating verification-first ordering in ambiguous cases","Add a programmatic prerequisite gate that blocks account-change tool calls until the verification tool has returned success","Lower the model temperature to make instruction-following more deterministic"],[2],"When deterministic compliance is required, prompt-based approaches (A, B) always retain a non-zero failure rate — 99.2% proves the point. A programmatic prerequisite gate guarantees ordering.","blob/main/practice-questions.md","2026-11-02",1],[1,1,"practice-questions.md · Q4","Your coordinator delegates to four subagents sequentially, waiting for each to finish before starting the next, even though their tasks are independent. Total latency is 4× a single agent. How do you run them in parallel?",["Have the coordinator emit all four Task tool calls in a single response","Set `parallel: true` in each subagent's AgentDefinition","Start four separate coordinator sessions, one per subagent","Move the four subagents into a single combined agent with all tools"],[0],"Parallel subagents are spawned by emitting multiple Task tool calls in a single coordinator response. B is a nonexistent option; C loses coordination; D destroys specialization and worsens tool selection.","blob/main/practice-questions.md","2026-11-02",1],[1,1,"practice-questions.md · Q5","Different MCP tools in your support stack return dates as Unix timestamps, ISO 8601 strings, and locale-formatted strings, and the agent occasionally miscompares them. Which mechanism normalizes these before the model reasons about them?",["A system prompt instruction listing every date format and how to convert each","A PostToolUse hook that transforms all tool results into a canonical date format before the model processes them","A dedicated `normalize_dates` tool the agent is instructed to call after every lookup","Few-shot examples demonstrating correct date comparisons across formats"],[1],"PostToolUse hooks intercept tool results and transform them before the model processes them, which is the deterministic way to normalize mixed formats. Prompt rules (A) and few-shot examples (D) are probabilistic, and a separate normalize tool (C) still depends on the model remembering to call it.","blob/main/practice-questions.md","2026-11-02",1],[1,1,"practice-questions.md · Q6","You analyzed a codebase in a session yesterday and want to compare two refactoring strategies today, each starting from that same analysis. Which session mechanism fits best?",["`--resume` the session twice in a row, trying one strategy after the other","`fork_session` to create two independent branches from the shared analysis baseline","Start two fresh sessions and re-run the full analysis in each","Use `/compact` to compress the analysis, then explore both strategies in the same session"],[1],"`fork_session` exists precisely for exploring divergent approaches from a shared analysis baseline. A serializes and lets strategy 1 contaminate strategy 2's context; C wastes the baseline; D doesn't create independent branches.","blob/main/practice-questions.md","2026-11-02",1],[1,1,"practice-questions.md · Q7","Since yesterday's analysis session, a teammate merged changes to 3 of the ~60 files you analyzed. You want to continue the investigation today. What's the best approach?",["Resume the session and inform the agent which 3 files changed so it re-analyzes only those","Resume the session as-is; the agent will notice stale results when it reads files again","Always start fresh after any code change; re-run the full 60-file analysis","Resume the session and run `/compact` to purge stale tool results"],[0],"When prior context is mostly valid, resume and tell the agent exactly which files changed so it re-analyzes only those. Resuming as-is (B) risks stale reasoning, since the agent won't spontaneously re-read; starting over (C) is disproportionate for 3 of 60 files; and /compact (D) doesn't refresh stale results.","blob/main/practice-questions.md","2026-11-02",1],[2,1,"practice-questions.md · Q8","Your document agent has `analyze_document` (\"Analyzes a document\") and `analyze_content` (\"Analyzes content\"), and routinely picks the wrong one. Which change most directly fixes the misrouting?",["Rewrite both descriptions to differentiate purpose, expected inputs/outputs, and when to use each versus the other — renaming them for specificity if needed","Add a preprocessing classifier that routes each request to the right tool before the model sees it","Set `tool_choice: \"any\"` so the model is forced to commit to one of them","Merge them into a single `analyze` tool that inspects its input to decide the backend"],[0],"Tool descriptions are the primary selection mechanism, and near-identical descriptions are the root cause, so differentiate them (and rename if needed). A pre-router (B) is over-engineered and bypasses the model, `any` (C) forces a choice without informing it, and merging (D) hides the problem inside one tool.","blob/main/practice-questions.md","2026-11-02",1],[2,1,"practice-questions.md · Q9","Your `lookup_order` MCP tool returns the string \"Operation failed\" for timeouts, malformed order IDs, and discontinued-product policy blocks alike. The agent responds by retrying everything three times. What should the tool return instead?",["Structured error metadata: an `errorCategory` (transient/validation/business), an `isRetryable` boolean, and a human-readable description","A stack trace so the agent can diagnose the failure itself","An empty result set, letting the agent infer failure from the absence of data","Distinct HTTP status codes for each failure type"],[0],"Structured error metadata (category, `isRetryable`, description) lets the agent retry transient failures, fix validation input, and explain business blocks to the customer.","blob/main/practice-questions.md","2026-11-02",0],[2,1,"practice-questions.md · Q10","Your synthesis subagent currently has all 18 tools available in the system \"for flexibility,\" and logs show it occasionally runs web searches and file writes mid-synthesis, degrading output quality. What's the right tool distribution?",["Keep all 18 tools but add system prompt instructions never to use non-synthesis tools","Restrict the synthesis agent to its role-relevant tools, optionally adding one scoped cross-role tool (e.g., `verify_fact`) for its high-frequency verification need","Remove all tools from the synthesis agent so it can only produce text","Give every subagent the same toolset so behavior is uniform and predictable"],[1],"Scoped tool access: role-relevant tools only, with a narrow cross-role tool for the high-frequency need. A is probabilistic; C removes a legitimate need; D maximizes the too-many-tools selection problem.","blob/main/practice-questions.md","2026-11-02",1],[2,1,"practice-questions.md · Q11","Your team shares a Jira MCP server; you also want to experiment with a personal scratch MCP server without affecting teammates. Where does each configuration belong?",["Both in `~/.claude.json`, since MCP servers are always user-scoped","Team server in CLAUDE.md; personal server in `.claude/rules/`","Team server in project `.mcp.json` (committed, with `${JIRA_TOKEN}` env expansion); personal server in user-level `~/.claude.json`","Both in `.mcp.json`, with the personal one commented out before committing"],[2],"Project `.mcp.json` for shared team servers (with env-var expansion for credentials), `~/.claude.json` for personal/experimental. Both are available simultaneously.","blob/main/practice-questions.md","2026-11-02",0],[2,1,"practice-questions.md · Q12","An agent exploring an unfamiliar codebase needs to find every file matching `**/*.repository.ts`, then locate which of them reference `LegacyConnection`. Which built-in tool sequence is right?",["Glob to find the matching file paths, then Grep to search those files' contents for `LegacyConnection`","Grep to find the file paths, then Glob to search their contents","Read every file in the repository and filter in the model's context","Bash `find` piped to Bash `cat`, loading everything into one response"],[0],"Glob finds files by path pattern; Grep searches contents. B reverses them; C and D bulk-load and blow context — exploration should be incremental.","blob/main/practice-questions.md","2026-11-02",1],[2,1,"practice-questions.md · Q13","Agents keep making a dozen exploratory `list_*` and `describe_*` tool calls just to discover what data your internal knowledge base contains before doing real work. Which MCP feature addresses this directly?",["Increase the tool-call budget so exploration completes reliably","Expose the content catalog (available collections, schemas, summaries) as MCP resources so agents see what exists without exploratory calls","Cache exploratory tool results in a PostToolUse hook","Add the full catalog to every tool description"],[1],"MCP resources exist to expose content catalogs so agents have visibility without exploratory tool calls. A pays the cost instead of removing it; C still requires the calls once per session; D bloats every tool description.","blob/main/practice-questions.md","2026-11-02",1],[3,1,"practice-questions.md · Q14","You wrote thorough coding standards in `~/.claude/CLAUDE.md` and they work great for you. A new teammate clones the repo and Claude ignores all the standards for them. Why?",["The teammate needs to run `/memory` once to activate memory files","User-level `~/.claude/CLAUDE.md` applies only to your machine and isn't in version control; the standards belong in a project-level CLAUDE.md","CLAUDE.md files require an `@import` directive in the repo root to activate","The teammate's Claude Code version predates CLAUDE.md support"],[1],"User-level memory isn't shared through version control. Team standards belong at project level (root CLAUDE.md or `.claude/CLAUDE.md`). `/memory` (A) is a diagnostic, not an activation step.","blob/main/practice-questions.md","2026-11-02",1],[3,1,"practice-questions.md · Q15","Your team has a `/deploy-checklist` skill that produces extremely verbose environment-scan output, which afterwards crowds out the main conversation's context. Which frontmatter change fixes this?",["`allowed-tools: [Read]` to limit how much the skill can scan","`context: fork` so the skill runs in an isolated sub-agent context and only its result returns to the main conversation","`argument-hint` so users scope the skill to one environment","Move the skill to `~/.claude/skills/` where output is automatically summarized"],[1],"`context: fork` runs the skill in an isolated sub-agent context, keeping verbose output out of the main conversation. A limits capability, not output volume; C reduces but doesn't isolate; D describes nonexistent behavior.","blob/main/practice-questions.md","2026-11-02",1],[3,1,"practice-questions.md · Q16","SQL migration files live in `db/migrations/`, `services/*/migrations/`, and `tools/seed/`, and all must follow the same conventions. What's the most maintainable way to apply the conventions exactly when those files are edited?",["A `.claude/rules/migrations.md` file with YAML frontmatter `paths:` globs matching all three locations","A CLAUDE.md in each of the three directories, kept in sync manually","A section in root CLAUDE.md titled \"Migration conventions,\" relying on Claude to notice when it applies","A `/migrations` slash command developers run before editing migration files"],[0],"Path-scoped rules with glob frontmatter apply conventions deterministically to files spread across directories. B duplicates content; C relies on inference; D requires manual invocation.","blob/main/practice-questions.md","2026-11-02",1],[3,1,"practice-questions.md · Q17","Task A: fix an off-by-one in one function, with a failing test and clear stack trace. Task B: migrate the codebase from REST to gRPC, touching ~50 files with several viable sequencing strategies. How should you run each?",["Direct execution for A; plan mode for B","Direct execution for both — plan mode just adds latency","Plan mode for both — planning never hurts","Plan mode for A; direct execution for B"],[0],"Direct execution suits well-scoped single-file fixes; plan mode suits large-scale, multi-approach architectural work.","blob/main/practice-questions.md","2026-11-02",0],[3,1,"practice-questions.md · Q18","In CI, your re-review job comments on every PR update, repeating the same findings each time a developer pushes a fix commit, burying new feedback. What's the fix?",["Include the prior review's findings in context and instruct Claude to report only new or still-unaddressed issues","Have Claude post a single consolidated comment and edit it in place via the API","Only run the review once per PR, on the first commit","Deduplicate comments post-hoc by string similarity before posting"],[0],"The documented pattern: include prior findings in context and instruct Claude to report only new or still-unaddressed issues. Running only once per PR abandons the value of re-review; editing a single comment or string-matching duplicates treats the symptom, not the missing context.","blob/main/practice-questions.md","2026-11-02",0],[4,1,"practice-questions.md · Q19","Your CI reviewer's \"maintainability\" category has an 80% false-positive rate, and developers have started ignoring all findings, including accurate security ones. What's the best immediate response?",["Temporarily disable the maintainability category to restore trust, while developing explicit criteria (with code examples) for it","Instruct the reviewer to \"be conservative and only report high-confidence maintainability issues\"","Lower the model temperature for review runs","Ask developers to keep triaging; false positives are inherent to LLM review"],[0],"High false-positive categories undermine trust in accurate categories, so disable the noisy category temporarily while writing explicit categorical criteria with concrete examples.","blob/main/practice-questions.md","2026-11-02",0],[4,1,"practice-questions.md · Q20","Your invoice extraction uses tool_use with a strict JSON schema. Syntax errors are gone, but you still see line items that don't sum to the stated total and amounts placed in the wrong field. Why, and what helps?",["Switch from tool_use to raw JSON output with a validation regex","The schema isn't strict enough; adding stricter types will catch these","Strict schemas eliminate syntax errors, not semantic errors — add semantic validation (e.g., extract `calculated_total` alongside `stated_total` and flag discrepancies) with retry-on-error feedback","The model is too small; upgrade to a larger model to eliminate semantic errors"],[2],"Strict schemas via tool use eliminate syntax errors but not semantic errors. The fix is semantic validation — e.g., `calculated_total` vs `stated_total` discrepancy flags — plus retry-with-error-feedback.","blob/main/practice-questions.md","2026-11-02",0],[4,1,"practice-questions.md · Q21","Some vendor documents legitimately lack a `purchase_order_number`. Since that field is `required` in your extraction schema, the model has begun inventing plausible-looking PO numbers. What's the fix?",["Add a system prompt instruction: \"never fabricate PO numbers\"","Make `purchase_order_number` nullable/optional so the model can return null when the document doesn't contain it","Retry the extraction until a real PO number is produced","Post-process outputs to remove PO numbers that don't match a known list"],[1],"Required fields push the model to fabricate values when the information is absent. Making the field nullable lets it truthfully return null. A prompt rule (A) is probabilistic, retrying (C) can't produce data that isn't there, and post-filtering (D) treats the symptom.","blob/main/practice-questions.md","2026-11-02",1],[4,1,"practice-questions.md · Q22","You must OCR-extract and classify 40,000 archived contracts, with results needed within one week, and separately run a compliance check that blocks each new contract upload until it passes. Which API strategy fits?",["Synchronous API for both, to keep the codepaths identical","Batches for the blocking check (it's small) and synchronous calls for the archive (it's important)","Message Batches API for the 40,000-contract archive job; synchronous API for the blocking upload check","Message Batches API for both, since 50% savings applies at any scale"],[2],"Batch API: 50% savings, up to 24h, no SLA → perfect for the latency-tolerant archive with a week of headroom; wrong for a blocking upload check where someone waits. Match each API to its latency requirement.","blob/main/practice-questions.md","2026-11-02",0],[5,1,"practice-questions.md · Q23","In hour-long support conversations, your agent's rolling summarization works, but late in conversations it misquotes refund amounts and promised dates that were correct earlier. What's the most effective fix?",["Increase the summary length so fewer details are dropped","Pull the transactional details (amounts, dates, order numbers, statuses) out into a persistent case-facts block included in every prompt, outside the summarized history","Disable summarization entirely and pass the full transcript until the context limit is hit","Instruct the summarizer to \"keep all important details\""],[1],"Progressive summarization erodes numbers, dates and stated expectations. Keep transactional facts in a structured case-facts block outside the summarized history. Longer summaries (A) or 'keep all details' (D) leave preservation probabilistic, and disabling summarization (C) just delays hitting the context limit.","blob/main/practice-questions.md","2026-11-02",1],[5,1,"practice-questions.md · Q24","A customer's first message is: \"This is ridiculous. I want to talk to a human RIGHT NOW.\" Logs show your agent responds by running `get_customer` and `lookup_order` to investigate before replying. Per escalation best practice, what should the agent do?",["Run sentiment analysis to confirm the frustration is genuine before escalating","Ask the customer to describe the problem first so the handoff summary is complete","Escalate to a human immediately, honoring the explicit request without first attempting investigation","Continue investigating — resolving the issue quickly is the best de-escalation"],[2],"An explicit customer request for a human is an immediate escalation trigger — honor it without first attempting investigation.","blob/main/practice-questions.md","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your monorepo has a 1,400-line root CLAUDE.md holding the standards for every package. Engineers in packages/web report that Claude applies PCI logging rules from packages/payments to UI code, and sessions start with most of the context window already spent. The standards already exist as separate files in docs/standards/, and each package's maintainers know which ones their package needs. What is the best restructure?",["Give each package its own CLAUDE.md that @imports only the standards files its maintainers select","Reorganize the root CLAUDE.md into one headed section per package and tell Claude to use the matching one","Turn every standards file into a skill and have the root CLAUDE.md say when each one should be invoked","Move each package's standards into ~/.claude/CLAUDE.md for the engineers who work on that package"],[0],"Per-package CLAUDE.md files with @import load only the standards each package needs, chosen by the people who know the package.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your infra repo's CLAUDE.md says, in bold, \"Never run terraform apply. Only run terraform plan.\" An audit of 300 sessions finds two where Claude ran terraform apply against a shared environment, both late in long sessions. The platform lead wants this to be impossible, not just unlikely. What should you change?",["Move the rule to the first line of CLAUDE.md and repeat it at the end of the file as a final reminder","Add a PostToolUse hook that pages the on-call engineer whenever a terraform apply command has run","Put the rule in a .claude/rules/ file whose paths frontmatter matches only the terraform/ directory","Add a deny rule for terraform apply to the permissions block in the project's .claude/settings.json"],[3],"A permission deny rule is evaluated deterministically before the command runs. CLAUDE.md is guidance, delivered as context, and compliance is never guaranteed.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",1],[3,1,"d3-exam-quiz-2026-10-16.html","A developer on a 9-person team wants Claude to know their personal staging sandbox URL and that they like verbose test output. Both apply only to this repository. Teammates must not see these notes, and the developer's other repositories must not pick them up either. Where should the notes go?",["In a CLAUDE.local.md at the project root, which stays out of version control","In a personal skill in ~/.claude/skills/ that the developer invokes in each session","In ~/.claude/CLAUDE.md, which is only ever loaded by this developer's own sessions","In the project's root CLAUDE.md under a section headed with this developer's username"],[0],"Two axes: who (me vs team) and where (this project vs all). CLAUDE.local.md is me + this project, and it is gitignored.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your team's /analyze-deps skill walks the dependency graph and reads dozens of manifests. It leaves about 30,000 tokens of intermediate output in the conversation. Developers usually keep working in the same session afterwards and notice Claude losing track of earlier instructions. They only need the final summary. What is the best change?",["Add a line to SKILL.md telling Claude to keep its final report under 500 words","Restrict allowed-tools in the skill's frontmatter to the Read and Grep tools only","Tell developers to run /compact right after every invocation of the skill","Set context: fork in the skill's frontmatter to run it in an isolated sub-agent"],[3],"context: fork runs the skill in an isolated sub-agent context. The verbose exploration stays there and only the result returns to the main session.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","All 14 engineers should get a /release-notes skill from the repo. One senior engineer wants a version with a different changelog layout for their own use. The team's version must not change for anyone else. What setup meets both needs?",["Commit the team skill to .claude/skills/ and keep the variant in ~/.claude/skills/ under a new name","Commit the team skill to .claude/skills/ and make it switch layout based on who is running it","Commit both skills to .claude/skills/ and note in CLAUDE.md which engineer should use which","Add both skills to ~/.claude/skills/ on every laptop through the team's onboarding setup script"],[0],"Project skills in .claude/skills/ are version-controlled and reach everyone. A personal variant in ~/.claude/skills/ with a different name leaves the team skill untouched.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your TypeScript repo keeps tests next to the code they cover, as *.test.ts files across about 60 directories. The 300 lines of testing conventions sit in the root CLAUDE.md. They load in every session, including infra-only work, and adding them to new directories keeps getting missed. What is the best place for them?",["A CLAUDE.md in each directory that holds tests, every one carrying the same testing conventions","A .claude/rules/ file with paths frontmatter set to **/*.test.ts, loaded when tests are edited","The root CLAUDE.md under a Testing heading that tells Claude to apply it only to test files","A testing skill, plus a hook that invokes it whenever Claude opens any file ending in .test.ts"],[1],"A path-scoped rule with a glob follows test files wherever they live and loads only when a matching file is in play.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",1],[3,1,"d3-exam-quiz-2026-10-16.html","Your team will replace Moment.js with date-fns. The decision is final and a function-by-function mapping table is already written. A quick search shows about 120 files import Moment, some through shared wrappers that other modules also depend on. How should you run this with Claude Code?",["Direct execution file by file, since the target library and the mapping are already agreed","Plan mode for the whole job, approving each file's edit inside plan mode as it is proposed","Direct execution with a Stop hook that runs the full test suite after every file is changed","Plan mode to map call sites and order the wrappers, then direct execution of the approved plan"],[3],"A migration across 100+ files with shared wrappers is plan-mode scope even when the target is decided: the order of changes is the open question. Then execute the approved plan directly.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",1],[3,1,"d3-exam-quiz-2026-10-16.html","You need to change how session tokens are validated in a 400-file legacy service. Last time, Claude spent the first hour tracing the auth flow with dozens of searches and file reads. By the time it started editing, it had forgotten constraints you gave it at the start. What should you do differently this time?",["Start a fresh session for the edits and paste in the full search output from the earlier session","Ask Claude to use narrower search patterns and keep only the lines it decides look relevant","Delegate the discovery phase to the Explore subagent and keep only its summary in the session","Run discovery in plan mode, because plan mode keeps tool output out of the main context window"],[2],"The Explore subagent isolates verbose discovery and returns a summary, keeping the main context for the implementation phase.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","You asked Claude for a function that normalizes customer names to \"Last, First M.\" form. After three rounds of prose corrections it still varies. Particles like \"van der\" are dropped in some runs, suffixes like \"Jr.\" move around in others, and each fix seems to undo a different case. What should your next message contain?",["One name format at a time, confirming each one works before you move on to the next format","A longer prose rule set that spells out exactly how particles, suffixes and initials are handled","Two or three concrete input and output pairs that cover the particle and the suffix cases","A request for Claude to list the name formats it expects and to support the common ones"],[2],"When prose is read inconsistently, concrete input/output examples specify the transformation exactly, and sending the cases together stops one fix from undoing another.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Reviewing Claude's rewrite of a CSV importer, you find three problems. Dates are parsed in UTC instead of the account's timezone. The dedup key is built from the parsed date, and so late-evening rows collide with the next day's rows. Rows with a null email are also dropped by the dedup step. How should you hand these back?",["Describe all three in one message, explaining how the date bug feeds the dedup key","Ask for a fresh rewrite of the importer, noting that dates and nulls need extra care","Fix the timezone bug first and raise the dedup problems after that change is verified","Open three separate sessions, one per problem, and then merge the three diffs together"],[0],"The problems interact: the timezone bug changes the dedup key, and the null rule lives in the same dedup step. Interacting problems go in one detailed message. Sequential fixing is for independent ones.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your CI job runs a Claude Code review and a script posts each finding as an inline PR comment. The script parses the text output with a regex and fails on about one run in eight when the wording or layout shifts. What is the most reliable fix?",["Run with -p, --output-format json and a --json-schema with file, line and message","Use --output-format stream-json and parse the findings out of the final text message","Add a CLAUDE.md section requiring every finding to be written as file:line: message","Pass the text output to a second Claude call that converts it to JSON for the script"],[0],"--output-format json with --json-schema makes the output machine-parseable and schema-constrained. -p runs it non-interactively.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[3,1,"d3-exam-quiz-2026-10-16.html","Your CI review job runs on every push to an open PR. Developers complain that each push re-posts comments on issues raised before, including ones they already fixed, and they have started ignoring the bot. Each run currently starts with only the PR diff. What change best fixes this?",["Supply the prior findings and ask Claude to report only new or still-unaddressed issues","Report only high-severity findings on later pushes and keep full reviews for the first","Have the posting script skip any finding whose text exactly matches an existing comment","Limit each run to reviewing the diff from the newest commit rather than the whole PR"],[0],"Give the review its own history: prior findings in context, with an instruction to report only what is new or still open.","blob/main/tutor/d3-exam-quiz-2026-10-16.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your contract-extraction tool schema marks termination_notice_days as a required integer. An audit of 400 supplier contracts finds that 18% contain no termination clause at all. Every one of those extractions still has a value, almost always 30 or 90. Legal relies on this field for renewal alerts. What is the most effective fix?",["Add a prompt instruction telling the model never to guess values absent from the text","Make the field nullable and not required so a missing clause is returned as null","Add a validator that rejects any extraction whose notice period is exactly 30 or 90","Force the extraction tool with tool_choice so the model cannot skip the schema fields"],[1],"A required field with no source value forces fabrication. Nullable/optional lets the model represent absence honestly.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",1],[4,1,"d4-exam-quiz-2026-10-13.html","Your PR review bot posts about 40 comments per pull request and developers dismiss 70% of them. Most dismissed comments concern naming style and comment wording, and real bugs are now being ignored alongside them. The current prompt says \"Only report issues you are highly confident about.\" What change most improves precision?",["Cap output at the five highest-severity findings per pull request to cut the noise","Add a second instance that keeps only findings a senior engineer would care about","Replace the confidence line with explicit categories to report and categories to skip","Raise the bar by telling the model to report only findings it rates 9 of 10 or higher"],[2],"Confidence-based filtering does not improve precision; specific categorical criteria (bugs, security yes; style, local patterns no) do.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","A nightly Message Batches job extracts data from 10,000 documents. The results show 140 errored requests. Of those, 120 failed because the document exceeded the context limit and 20 failed with transient server errors. What is the best next step?",["Resubmit only the 140 failures by custom_id, chunking the 120 oversized documents first","Rerun the 140 failures unchanged through the synchronous API, since batching caused them","Resubmit the full batch of 10,000 with a higher max_tokens value to clear length errors","Resubmit the 140 failures unchanged in a new batch and retry up to three more times"],[0],"Correlate failures by custom_id, resubmit only those, and modify the ones whose failure is structural (chunk oversized docs).","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your product-spec extractor must output dimensions in centimetres. The prompt already has 600 words of unit-conversion rules. Sources include phrases like \"2 ft-ish\", \"roughly a hand wide\" and \"60x40\", and about 15% of outputs are still inconsistent or null. What is the most effective improvement?",["Add three examples of informal measurements showing input, normalized output and why","Expand the unit rules to cover each informal phrasing found in the failing sample set","Set temperature to 0 so the model applies the existing rules identically every time","Add a regex post-processor that converts any remaining informal units to centimetres"],[0],"When detailed instructions still yield inconsistency, few-shot examples (with reasoning) are the most effective fix and generalize to unseen phrasings.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your invoice pipeline retries failed validations up to 3 times, appending the validator errors each time. Date-format errors are fixed on the first retry in 94% of cases. However, 7% of invoices fail all three retries on a missing po_number. Investigation shows those vendors print the PO number only on a separate purchase order that is not sent to the model. What should you change?",["Add few-shot examples showing where PO numbers usually appear on vendor invoice layouts","Make po_number optional so these invoices pass validation with a null value recorded","Raise the retry limit to five and show the validator error more prominently each time","Stop retrying absent fields; supply the linked purchase order or route it to review"],[3],"Retry-with-feedback is ineffective when the information is absent from the source; supply the external document or route it out of the loop.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your pipeline receives invoices, receipts and purchase orders, and defines one extraction tool per document type. The type is unknown until the document is read. With tool_choice set to \"auto\", 6% of responses come back as a prose summary instead of a tool call, which breaks the parser. What is the most reliable fix?",["Set tool_choice to \"any\" so a tool call is required but the model picks which one","Merge the three tools into one tool whose schema covers every field of all three types","Add a classifier call first, then force the matching extraction tool on a second request","Add a system prompt rule telling the model it must always respond by calling a tool"],[0],"\"any\" guarantees a tool call while letting the model choose among multiple extraction schemas when the type is unknown.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","A refactor PR touches 38 files and is reviewed in a single pass. The review contradicts itself, calling a helper unused in one comment while flagging its changed callers in another. It also misses that a field renamed in the API layer was never updated in 2 consumers. What is the most effective change?",["Ask the reviewer to re-read its findings and delete any that contradict one another","Enable extended thinking so the single pass can reason more deeply across the files","Run per-file passes for local issues, then a separate pass on cross-file data flow","Use a model with a larger context window so all 38 files fit with plenty of room left"],[2],"Large reviews split into focused per-file local passes plus an integration pass avoid dilution and contradictory findings.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your review bot has 5 finding categories. Security and logic findings were accepted 90% of the time, but performance findings are dismissed 85% of the time. Developers now skim the whole review, and security acceptance has fallen to 60%. Rewriting the performance criteria will take about 3 weeks. What should you do now?",["Keep every category but label performance findings low priority so readers can skip them","Disable the performance category now and refine its criteria offline before re-enabling","Add a footer to each review noting that performance findings are still experimental","Tell the model to flag only severe performance regressions until the rewrite is done"],[1],"A high false-positive category undermines trust in accurate ones; temporarily disable it while its criteria are fixed.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",1],[4,1,"d4-exam-quiz-2026-10-13.html","Your invoice extractor uses tool use with a strict JSON schema and has produced zero syntax errors in 3 months. Finance reports that in 3% of invoices the extracted line items do not add up to the extracted total. They cannot tell whether the source invoice is wrong or the extraction misread it. What design best addresses this?",["Run every invoice through extraction twice and accept a result only when both agree","Extract calculated_total and stated_total and set conflict_detected when they differ","Instruct the model to adjust line items so they always sum exactly to the stated total","Tighten the JSON schema with numeric minimums and pattern constraints on each amount"],[1],"Self-correcting validation extracts both values and flags conflicts, separating source inconsistency from extraction error.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your review bot flags empty catch blocks. Some are intentional, such as best-effort cleanup marked with a comment. The team keeps adding acceptable patterns to an exception list, now at 23 entries. The bot ignores those 23 but still flags each new intentional variant it has not seen. Which approach generalizes best?",["Tell the model to use judgment and skip any empty catch block it thinks is intentional","Add a pre-filter that strips any commented catch block before the code reaches the model","Move the exception list into a separate file that is loaded into the prompt at runtime","Replace the list with paired examples of acceptable vs genuine cases, each with a reason"],[3],"Few-shot examples contrasting acceptable patterns and real issues, with reasoning, let the model generalize to novel variants.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Contracts arrive continuously throughout the day. Compliance requires extraction results within 30 hours of a contract arriving. You use the Message Batches API, which can take up to 24 hours, and currently submit one batch at midnight. Which change guarantees the SLA?",["Keep the midnight batch and send contracts arriving after 6pm to the synchronous API","Submit every 4 hours so the longest wait plus 24 hours of processing stays within 30","Keep the midnight batch but mark time-sensitive contracts for priority batch handling","Submit a batch every 8 hours so that no contract waits for more than one batch window"],[1],"Worst case = submission interval + 24h. 4 + 24 = 28 ≤ 30 guarantees it; 8 + 24 = 32 does not.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[4,1,"d4-exam-quiz-2026-10-13.html","Your schema classifies customer feedback with a category enum of billing, shipping, product_quality and account. A review of 2,000 items finds 11% misfiled, mostly into product_quality. They concern topics like accessibility and app crashes, and a few are genuinely ambiguous. What schema change best fixes this?",["Expand the enum with each new topic found in the misfiled sample so all get a category","Drop the enum and make category a free-text string so the model can describe any topic","Add an \"other\" value with a detail string, plus \"unclear\" for ambiguous items","Add a confidence field and send items scoring under 0.7 to a human for reclassifying"],[2],"An \"other\" + detail pattern keeps the enum extensible and an \"unclear\" value lets ambiguity be represented instead of guessed.","blob/main/tutor/d4-exam-quiz-2026-10-13.html","2026-11-02",0],[1,1,"mock-d1.html · D101","Your support agent's loop returns the response to the customer as soon as it contains a text block. The model often writes a short preamble such as 'Let me pull up that order for you' in the same response as a tool_use block. In 9% of sessions the customer receives only that preamble and no tool ever runs. Which change fixes the loop?",["Add a system prompt rule that the agent must never write text in the same response as a tool call, with two worked examples of the correct pattern and one of the wrong one","Treat a response as final only when its text block is longer than 40 characters, so short preambles no longer end the loop","Drive the loop from stop_reason: on tool_use, execute every tool_use block and append the results whatever text accompanies them, and return only on end_turn","Cap the loop at 8 iterations and return the most recent text block when the cap is reached"],[2],"Text content is not a completion signal; a response can carry text and tool_use blocks together. stop_reason is the control signal: tool_use means run the tools and send the results back, end_turn means the model is done.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D102","An audit of 2,000 support sessions finds that 3% ended with neither a completed resolution nor a call to escalate_to_human. The causes were mixed: responses cut off at max_tokens, the 15-iteration safety cap being hit, a tool raising an exception, and customers disconnecting mid-investigation. The system prompt already says to escalate whenever the agent cannot resolve a case. Which design guarantees that every session ends resolved or escalated?",["Move the escalation rule to the top of the system prompt, repeat it at the end, and add a few-shot example of an agent escalating after a tool error so the instruction is harder to miss","Wrap the loop in orchestration code that checks every exit path and, if nothing was resolved, opens a human escalation with a structured handoff","Add a PostToolUse hook on escalate_to_human that validates the handoff payload has a customer ID, root cause and recommended action","Raise max_tokens to 8,192 and the iteration cap to 40 so that sessions stop terminating before the agent reaches a resolution or decides to escalate"],[1],"Every listed cause ends the loop before the model gets a chance to follow its instructions, so no prompt can cover them.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D103","Your agent verifies identity with get_customer before any refund. Across 10,000 refunds, 1.5% were issued against an order that belongs to a different customer — usually a caller quoting a relative's order number. The system prompt already tells the agent to confirm the order belongs to the verified customer before calling process_refund. What is the most reliable fix?",["Gate process_refund in code so it rejects the call unless the order's owner matches the verified customer ID","Add few-shot examples of the agent comparing the order's customer_id to the verified ID, including one where it declines the refund","Have the agent ask the caller to confirm the order is theirs before every refund and log the confirmation in the transcript","Have a second Claude instance review each refund decision against the transcript and flag ownership mismatches to a human"],[0],"A financial operation with a compliance precondition needs a programmatic prerequisite, not better guidance. Prompt instructions, few-shot or not, keep a non-zero failure rate, and confirmations or a second reviewer still let the wrong refund be issued first.","blob/main/tutor/mock-d1.html","2026-11-02",1],[1,1,"mock-d1.html · D104","A customer writes: 'I was charged twice for order 5521, the blender arrived cracked, and please change the delivery address on order 5530.' Logs show that for messages raising 3 or more issues, the agent resolves the first one, ends its turn, and the remaining issues go unaddressed in 22% of cases. First-contact resolution on these chats is 48%. Which approach best fixes this?",["Decompose the message into discrete concerns held as structured state, investigate each one (in parallel where independent) using the shared customer context, and compose one reply once every item is resolved or escalated","Detect messages that raise more than one issue and route them straight to a human agent, since they are the complex cases the agent struggles with","Open a separate agent session for each concern, each started fresh with the customer ID, and send the customer one reply per session","Add a system prompt instruction to address every issue the customer raises before ending the conversation, with an example message that lists three issues"],[0],"Multi-concern requests are decomposed into distinct items, investigated using shared context (in parallel where they do not depend on each other), and synthesized into one unified resolution.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D105","Three MCP tools return dates in different formats: billing returns Unix epoch seconds, orders return ISO 8601, and the shipping carrier returns DD/MM/YYYY strings. In 7% of return requests the agent miscalculates the 30-day return window, for example reading 03/04/2026 as 4 March. The system prompt already documents each tool's format. What is the most effective fix?",["Add a PostToolUse hook that converts every date field in tool results to ISO 8601 before the model processes them","Add a calculate_return_window tool and instruct the agent to call it with the dates it reads from tool results","Run a validation pass after each response that recomputes any date arithmetic and asks the model to correct mismatches","Expand the system prompt's date section with a worked example for each of the three formats and an explicit warning about day-month ordering"],[0],"PostToolUse hooks intercept tool results before the model processes them — the designed place to normalize heterogeneous formats from different MCP tools. Once every date is ISO 8601, there is no ambiguous string left to misread.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D106","Policy requires human approval for refunds above $500, so you added a PreToolUse hook that denies process_refund calls over that amount. Since deployment, 14% of high-value refund sessions end with the agent telling the customer 'I'm unable to process this refund' and nothing further happens. No escalation is recorded for those sessions. What should you change?",["Change the policy so the agent refunds $500 immediately and escalates only the remaining amount for human approval","Keep the hook and add a system prompt instruction that whenever a refund is denied, the agent must call escalate_to_human","Remove the hook and state the $500 limit in the system prompt, instructing the agent to call escalate_to_human for any refund above it","Have the hook itself, on denial, open the human escalation with a structured handoff and return a reason telling the agent the case is now with a specialist so it can inform the customer"],[3],"Interception hooks should block the policy-violating action and redirect it to the alternative workflow. Making the redirect part of the hook keeps the whole path deterministic; adding a prompt rule to escalate after a denial is still probabilistic, and removing the hook loses the guarantee.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D107","Your coordinator runs every query through all four subagents: search, document analysis, synthesis and report. Usage data shows 40% of queries are simple factual lookups such as 'When was the EU AI Act adopted?'. Those take about 90 seconds and cost roughly 12 times a single-agent answer. What is the best change?",["Have the coordinator assess each query's complexity and invoke only the subagents it needs, answering simple lookups with the search subagent alone","Put a keyword-based classifier in front of the coordinator that detects simple factual queries and sends them to a separate, cheaper single-agent system instead","Move all four subagents to a smaller, cheaper model to lower the per-query cost","Run all four subagents in parallel instead of in sequence to cut the 90-second latency"],[0],"The coordinator's job includes deciding which subagents to invoke based on query complexity rather than always routing through the full pipeline.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D108","Briefs ask for desalination cost data across 6 named regions. Reviewers find that 30% of reports omit at least one region entirely, although each subagent's output is accurate for what it covered. The coordinator runs search, analysis and synthesis exactly once per query, then generates the report. What is the most effective fix?",["Give the synthesis subagent the full search and analysis toolsets so it can research any gap it notices itself","Raise the search subagent's results per query from 10 to 30 so that fewer of the regions get missed","Have the coordinator check synthesis against the brief so it can re-delegate searches for gaps","Have the report subagent list any missing regions in a limitations section at the end of the report"],[2],"This is the iterative refinement loop: the coordinator evaluates synthesis output for gaps, re-delegates targeted queries to search and analysis, and re-invokes synthesis until coverage is sufficient.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D109","To cut latency, the team let the document-analysis subagent pass its results straight to the synthesis subagent through a shared queue, skipping the coordinator. Since then, in 5 of 50 runs, synthesis received partial analyses after the analysis subagent failed midway. The coordinator's logs show all 50 runs as successful. What should the team do?",["Have the synthesis subagent check that the analyses look complete before it starts writing","Route analysis output back through the coordinator, which checks its status and decides to retry, re-delegate, or pass it to synthesis","Have the analysis subagent write any failures to a shared error log, which the coordinator reads and reviews once each run has finished","Add retry logic inside the analysis subagent so it re-sends complete results to the queue after a failure"],[1],"In hub-and-spoke orchestration all subagent communication flows through the coordinator, which gives observability, consistent error handling and controlled information flow.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D110","The coordinator passes findings to the synthesis subagent as concatenated prose paragraphs. Final reports attribute 18% of statistics to the wrong source. The search subagents' own outputs carried the correct URL for every finding. What is the most effective fix?",["Pass findings as structured records so each claim stays paired with its URL, document name and page","Instruct the synthesis subagent to double-check every citation against the findings before finalizing the report","Raise the synthesis subagent's max_tokens so that it has enough room to write out every citation in full","Have each search subagent send its findings directly to the synthesis subagent instead of through the coordinator"],[0],"Attribution is lost when claims and their metadata are flattened into prose. Passing findings as structured records that keep content separate from metadata (URL, document, page) preserves the claim-to-source link through synthesis.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D111","For 'Why did Company X lose market share in 2025?', the coordinator follows a fixed 5-step plan: pricing, marketing, product quality, competitors, synthesis. In 2 of 3 runs, step 1 surfaced a regulatory ban in the company's largest market. The remaining steps still researched marketing and product quality as planned, and the report mentioned the ban in one line. What should change?",["Have the synthesis subagent rank all candidate causes by strength of evidence before the report is written, so the strongest cause leads","Run the five steps in parallel, then let synthesis discard the branches that turn out irrelevant","Have the coordinator generate subtasks from each step's findings, re-planning when evidence points to an unanticipated cause","Add a sixth fixed step, regulatory analysis, to the plan so that every future run covers regulation alongside pricing and marketing"],[2],"Open-ended investigation calls for dynamic decomposition: subtasks generated from what each step discovers. A fixed sequence executes regardless of intermediate findings, so the decisive lead was never investigated in depth.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D112","Your boilerplate agent's loop is: while stop_reason is tool_use, run the tools; otherwise return the response as final. In 6% of runs the returned code stops mid-function, and logs show stop_reason was max_tokens on those turns. A teammate proposes having the model end every answer with the marker '// END' and looping until it appears. What should you do?",["Adopt the '// END' marker and loop until it appears, since it directly detects whether the model finished writing","Branch on max_tokens as a non-final state — continue the generation or raise the limit — and treat only end_turn as completion, keeping tool_use as the signal to run tools","Re-send the whole request at temperature 0 whenever the output looks incomplete","Instruct the model to keep every generated file under 200 lines so responses never reach the token limit"],[1],"`stop_reason` has more values than `tool_use` and `end_turn`. `max_tokens` means the output was cut off, so it must not be treated as final; only `end_turn` means the model finished. A text marker like '// END' is the same natural-language-parsing anti-pattern.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D113","Your exploration coordinator must investigate 4 independent modules, each through its own subagent. Logs show it spawns one subagent, waits for the result, then spawns the next, so a run takes about 4 times as long as one module. The modules share no state and their findings are only combined at the end. What change gives the speedup?",["Instruct the coordinator to emit all four Task tool calls in a single response so they run in parallel, each brief carrying its module path and expected output format","Give a single subagent all four module paths so the coordinator only has to wait for one result","Raise the coordinator's maximum turns so it has room to finish all four sequential spawns","Write a shell script that launches four separate SDK processes, one per module, and merges their output files afterwards"],[0],"Parallel subagents come from multiple Task tool calls emitted in one coordinator response, not spread across turns.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D114","An engineer asks the agent to 'add comprehensive tests' to a 400-file legacy service with almost no coverage. The agent generates tests file by file in alphabetical order. After 3 days, 60% of new tests cover rarely used utility modules and the payment module has none. Which approach should the agent have taken?",["Map the structure first so high-impact areas get priority, then adapt the plan as dependencies surface","Keep the file-by-file sequence but order the files by line count, largest first, so the big modules come early","Chain the work: generate tests for each file on its own, then run a single cross-file integration pass at the end","Spawn 400 subagents in parallel, one per file, so that every file in the service gets its tests at the same time"],[0],"Open-ended tasks are decomposed by mapping structure, identifying high-impact areas, and building a prioritized plan that adapts as dependencies are discovered.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D115","On Monday an engineer ran a named session, auth-audit, in which the agent read and analyzed 35 files. On Tuesday and Wednesday, teammates merged 2 pull requests that rewrote 3 of those files; the other 32 are unchanged. The engineer wants to continue the audit on Thursday. What is the best approach?",["Resume auth-audit and continue; the agent will re-read any file it needs when it gets to it","Resume auth-audit with --resume and name the 3 changed files so the agent re-analyzes only those","Fork the session with fork_session so the original stays untouched, then continue the audit in the fork","Start a new session and have the agent re-explore all 35 files, so no stale analysis can leak into the audit"],[1],"When prior context is mostly valid, resume — and inform the agent about the specific files that changed so it re-analyzes those instead of re-exploring everything.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d1.html · D116","After a 2-hour session analyzing a 120,000-line monolith, the team wants to compare two refactoring strategies: strangler-fig and module extraction. Each strategy should build on the full shared analysis. Neither should be influenced by the other's exploration. What should they do?",["Continue in the same session, try the first strategy, then tell the agent to disregard it before trying the second","Start two brand-new sessions and re-run the full 2-hour analysis in each so they share nothing","Resume the analysis session in two terminals at once so both strategies continue from the same history","Use fork_session to create two independent branches from the shared analysis baseline, one per strategy"],[3],"fork_session creates independent branches from a shared analysis baseline — the designed tool for comparing divergent approaches without repeating the baseline or cross-contaminating the branches.","blob/main/tutor/mock-d1.html","2026-11-02",0],[1,1,"mock-d145.html · K01","The agent's loop treats any response that contains a text block as the final answer and shows it to the customer. In 500 logged sessions, 38 ended with the customer seeing 'Let me pull up your last 3 meter reads' and nothing after it. In each of the 38, the same response also held a get_meter_reads tool_use block. What change fixes this?",["Cap the loop at 10 iterations and show the customer the last text block when the cap is hit","Run the tools and loop again when stop_reason is tool_use; finish the turn on end_turn","Finish when stop_reason is end_turn or the reply text has no phrase such as 'Let me'","Add a system prompt rule that a response which calls a tool must contain no text for the customer"],[1],"Claude can return text and a tool_use block in the same response. The loop must branch on stop_reason: on tool_use it runs the tools and sends the results back; on end_turn the turn is done.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K02","To keep requests small, the loop sends each follow-up request with only the system prompt and one new user message holding the latest tool result. In 120 test sessions the model called get_account again on the next turn in 47, and in 19 it asked customers for an account number they had already given. Each repeat call adds about 2 seconds. What should change?",["Add a system prompt line telling the model not to repeat a tool call it has made in this session","Send the full message history each turn, with the assistant's tool_use turn and its tool_result appended","Summarise the session in one paragraph and send that summary along with each new tool result","Cache get_account results in the MCP server and return them at once on any repeat call"],[1],"The API is stateless. Tool results are appended to the conversation history and the whole history is sent each turn; that is how the model reasons about its next step with what it already learned.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K03","An audit of 2,000 sessions found 3% ended with no resolution and no handoff. Some stopped on max_tokens mid-reply, some ended with stop_reason refusal, and a few hit the loop's 25-iteration safety cap; each left the customer with a cut-off reply and no case. The system prompt already says 'Always resolve the issue or escalate to a human before you finish.' What should you add?",["A higher max_tokens of 8,192 and a safety cap of 50 iterations in place of 25","A check in the orchestration code after the loop exits: no recorded resolution means it opens a handoff","Three few-shot examples in the system prompt of sessions that end with an escalate_to_human call","A PostToolUse hook on escalate_to_human that checks the handoff has an account ID and a reason"],[1],"In all three exit paths the model never gets to act on the prompt rule: the session ends in the loop code.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K04","About 0.8% of sessions end with the agent process gone: an unhandled exception in set_payment_plan's client code, or the hosting platform killing a session after 120 seconds. These customers see the chat go silent, and 60% of them call back within a day. Staff taking the calls cannot see the chat transcript. What should you build?",["A system prompt rule telling the agent to call escalate_to_human whenever a tool returns an error","An isError result with a retryable flag for set_payment_plan failures in place of an exception","An MCP server change that retries set_payment_plan 3 times before raising an exception","A wrapper around the loop that opens a human case on any abnormal exit, with account ID, issue and last step"],[3],"Both failures end the process before the model can do anything, and they come from different places.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K05","A customer gives a surname and street, and get_account returns 2 accounts: the customer's flat and a neighbour's flat with the same surname. The agent picks the account with the most recent payment, which was wrong in 9 of 70 such cases last month, and once applied a $60 credit to the wrong home. What should the agent do when get_account returns more than 1 match?",["Escalate to a human agent each time get_account returns 2 or more matches","Ask the customer for one more identifier, such as the account number or meter serial","Pick the account whose address text is the closest match to what the customer typed","Pick the most recent account and confirm the choice with the customer after the credit"],[1],"Several matches call for clarification, not a heuristic pick. One more identifier settles it, and the agent keeps the case.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K06","A customer asks for a credit for food that spoiled during a 9-hour power cut caused by the local network operator. The credit policy covers billing errors and late meter reads and says nothing about outages. In 14 such chats the agent applied the standard $40 goodwill credit 8 times and refused 6 times. What should the agent do with this request?",["Escalate to a human: the credit policy is silent on outage losses","Apply the $40 goodwill credit, which is how the policy treats billing errors","Refuse and explain that the credit policy only covers billing errors and late reads","Ask how upset the customer is and escalate if they rate it 4 or more out of 5"],[0],"A policy gap is an escalation trigger. The policy does not forbid outage credits; it does not address them, and deciding is a human call.","blob/main/tutor/mock-d145.html","2026-11-02",1],[5,1,"mock-d145.html · K07","Home-move chats run 30 or more turns, and after turn 20 older history is summarised to save tokens. In 11 of 200 moves the agent later set the wrong payment plan: the customer had agreed $84 a month, but the summary read 'customer agreed a payment plan' and the agent used $48 from an old bill. The summariser prompt already asks it to keep amounts. What should you change?",["Raise the summary limit from 200 to 600 words and keep the amounts instruction","Call get_account again before set_payment_plan and use the amount it returns","Switch the summariser to a larger model with the same prompt and word limit","Keep agreed amounts and dates in a case facts block outside the summary"],[3],"Transactional facts belong in a persistent case-facts block included in each prompt outside the summarised history. Summaries compress numbers and customer-stated expectations; a separate block is never summarised.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K08","Every question a member asks runs all 3 subagents in order, even 'What did wheat close at in Kansas City yesterday?'. Questions like that make up 45% of traffic, take about 4 minutes and use about 180,000 tokens each. Members want quick answers to quick questions. What should change?",["Run the three subagents on a smaller model for any question under 15 words long","Give each subagent a fixed budget of 20,000 tokens per question it works on","Cache each answer for 24 hours and serve any repeat question from that cache","Have the coordinator assess each question and call only the subagents needed"],[3],"Deciding which subagents to invoke from the query is the coordinator's job. A price lookup needs one search, not the full pipeline.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K09","For the weekly briefing the coordinator searches 3 subtopics: prices, weather and trade policy. Each search is independent and takes about 3 minutes. Logs show the coordinator emits one Task call, waits for its result, then emits the next, and briefings take 10 minutes. How should the searches be launched?",["Have the coordinator emit all 3 Task calls in a single response","Combine the 3 subtopics into one search subagent brief with a longer time budget","Let the prices search subagent spawn the weather and trade policy searches itself","Run 3 coordinator processes, each owning one subtopic, and merge their briefings"],[0],"Parallel subagents are spawned by emitting several Task tool calls in one coordinator response, not one per turn.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K10","The coordinator invokes the synthesis subagent with the prompt 'Using the research the team gathered, write this week's briefing.' In 40% of runs the briefing has no figures from the week's crop reports and reads like general market commentary. The search and document-analysis results are complete in the coordinator's context. What should change?",["Add a few-shot example briefing full of figures to the synthesis system prompt","Turn on a shared memory setting that gives the subagent the coordinator's history","Give the synthesis subagent the web-search tool to gather the figures it needs","Put the full search results and document analyses into the synthesis prompt"],[3],"Subagents do not inherit the coordinator's context. The findings have to be passed explicitly in the subagent's prompt.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K11","A member asks why soybean prices at the local elevator fell 40 cents below futures this month. The system runs a fixed chain: search the news, analyse the latest government crop report, synthesise. The first search turned up reports of a river barge backlog, but the chain moved on to the crop report and the briefing never mentions the barges. What should change?",["Add a fixed fourth step to the chain that searches for barge and transport news","Run the same fixed chain twice and merge the two briefings","Let the coordinator add subtasks from each step's findings, such as the barges","Raise the number of results per search from 10 to 30 in the first step"],[2],"An open-ended \"why\" question needs dynamic decomposition: subtasks generated from intermediate findings. The barge lead should have produced a follow-up subtask.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K12","The document-analysis subagent reads 12 state crop reports a week. When one state's site timed out after 3 local retries, it returned {status: 'error', message: 'analysis failed'} and discarded the 11 reports it had finished. The coordinator then reran the whole analysis, which took 9 more minutes. What should the subagent return?",["An exception that stops the whole briefing run until someone looks at it","The 11 finished analyses marked as success, with the failed state left out","An error with the failure type and the state name, and the 11 analyses left out","The failure type, the URL tried, the 11 finished analyses and alternatives"],[3],"Structured error context — failure type, what was attempted, partial results and alternatives — lets the coordinator decide: retry one source, use a substitute, or proceed with the 11.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K13","The web-search subagent returns an empty list both when the trade-filings search times out and when it finds no filings. In 6 of 40 briefings, the synthesis said 'no new export restrictions on rice this week' when the search had timed out. In most weeks there genuinely are no new filings. What should change?",["Have synthesis treat any empty search result as unknown and write that no data was available","Retry the search until it returns at least one filing, up to 5 attempts in each briefing run","Add a line to the synthesis prompt telling it not to state that something is absent","Report a timeout as an error with its type, and a search with no hits as a successful empty result"],[3],"An access failure and a valid empty result mean different things and must be reported differently. Then \"no restrictions\" is stated only when the search actually ran.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K14","Two credible sources estimate this season's corn ending stocks: a government report says 2.1 billion bushels and a private analytics firm says 1.9 billion. Both cover the same marketing year and were published in the same week. In 3 briefings the synthesis subagent printed only the government figure with no mention of the other. How should this be handled?",["Keep both figures with sources, flag the conflict for the coordinator","Have the search subagent find a third estimate and print the majority value","Prefer the government figure as the more reliable public source","Print the average, 2.0 billion bushels, and cite both sources beside it"],[0],"Conflicting statistics from credible sources are kept and annotated with their sources, not resolved by picking one. Analysis completes with the conflict flagged, and the coordinator decides before synthesis.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K15","Briefings flagged 'conflicting data' on Brazil's soybean exports 7 times this quarter. In one case the two figures were a March estimate published in April and a revised estimate published in July. The subagents' structured outputs carry claim, value and source URL for each figure. What should be added?",["A rule that drops both figures from the briefing whenever they disagree","A publication date and a data-collection date on each figure in the outputs","A fact-check subagent that re-verifies each flagged figure before synthesis","A synthesis prompt rule that the newer source wins whenever two figures disagree"],[1],"Without dates, a revision looks like a contradiction. Requiring publication and collection dates in the structured outputs lets synthesis read the figures in time order.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K1
