ng, scheduling, reporting","Have a 4th subagent dedupe the 3 reports before it reads them","Spawn 6 explorers with that same prompt to raise coverage"],[1],"The coordinator should partition the scope across subagents, giving each a distinct area, which removes the duplication and makes sure every module is covered.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M34","The coordinator's prompt to the explorer is 14 numbered steps: open Program.cs, then Startup.cs, then each controller, and so on. About 30% of modules use a newer folder layout without those files; there the explorer follows the steps anyway and returns empty sections. The team wants it to find the module's structure whatever the layout. How should the coordinator brief the explorer?",["Check the layout first and send 1 of 2 different step lists","Add a 15th step: 'If a file in a step is missing, skip that step'","Add steps for the newer layout, with a branch on the folder name","State the goal and what good findings look like, not the steps"],[3],"Coordinator prompts should specify the research goal and quality criteria rather than step-by-step procedure, which lets the subagent adapt to what it finds, such as a different layout.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M35","An engineer asks why some passengers are charged twice for a day pass. The coordinator runs a fixed 4-step plan: read the payment controller, read the pass service, read the database schema, write a summary. At step 2 the explorer finds the duplicates come from a retry in a payment-gateway adapter the plan never mentions, but the plan moves on to the schema. Which decomposition fits this task?",["A pass per file in the payments folder, then a summary pass","Run the 4 steps in parallel to get to the summary sooner","A fixed plan of 8 steps that covers the gateway adapters too","Adaptive: next subtasks come from each finding, such as the retry"],[3],"Open-ended investigation needs dynamic decomposition: subtasks are generated from what each step discovers. The retry finding should have produced the next subtask instead of the plan's fixed schema step.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M36","The tool reviews each pull request on 3 fixed aspects: security, data access and fare-rule correctness. Most PRs touch 6 to 10 files. One prompt covering all aspects across all files gives shallow notes on the later files and contradictory notes on identical code. Fare bugs often span files: a data-access change in one file alters fares computed in another. Which decomposition fits this review?",["A pass per file covering all 3 aspects, with no cross-file pass","A pass per file for local issues, then a separate cross-file pass","One pass per aspect over all files, then a pass merging the notes","Let the agent design its own review steps for each pull request"],[1],"For a predictable multi-aspect review, prompt chaining fits: analyse each file on its own, then run a separate integration pass for cross-file issues. That avoids the attention dilution causing shallow and contradictory notes.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M37","Last week an engineer's named session, cap-audit, analysed 35 files of the fare-cap logic. Since then a refactor renamed or moved 30 of those 35 files and split 2 of them, so most file paths and tool results in that session are out of date. The engineer's written summary of the conclusions is still accurate. How should they continue?",["Fork cap-audit and continue in the fork, keeping the original","Resume cap-audit and tell it that the files have moved since then","Resume cap-audit and carry on, as it re-reads files when it needs to","New session with the written summary injected as starting context"],[3],"When most prior tool results are stale, starting fresh with an injected summary is more reliable than resuming.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M38","Yesterday an engineer ran 3 sessions in the monolith's folder. The one that matters, named gateway-map, holds 2 hours of analysis of the payment gateways; the most recent one was a 5-minute question about a log file. Nothing in the gateway code has changed since. How should the engineer get back into the gateway analysis?",["claude --fork-session gateway-map","Start a session and re-run it","claude --continue in that folder","claude --resume gateway-map"],[3],"--resume with a session name continues that specific named session. --continue picks the most recent session in the folder, which here is the 5-minute log question.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N01","The agent's loop code checks each response for a text block and returns it to the guest as soon as one appears. On 9% of cancellation chats the response holds a sentence such as \"Let me check that booking\" together with a lookup_booking call, and the guest receives that sentence as the final answer. The tool is never run. What should the loop check to decide whether to continue?",["Whether stop_reason is \"end_turn\" or the response holds any text block","Whether the content array holds more than 1 block of type \"text\"","The stop_reason: run the tools on \"tool_use\", return on \"end_turn\"","Whether the loop has run 5 iterations or stop_reason is \"max_tokens\""],[2],"A response can hold text and a tool_use block together, so the presence of text says nothing about whether the model is done.","blob/main/tutor/mock-final-sim3.html","2026-11-02",1],[1,1,"mock-final-sim3.html · N02","After lookup_booking runs, the loop code sends the next request with only the original guest message and a note saying \"tool succeeded\". The model then asks for the same booking again, and 14% of refund chats repeat lookup_booking 3 or more times. The tool returns correct data each time. What is the fix?",["Cache lookup_booking results in the MCP server and return them faster on repeats","Raise max_tokens and give the model more room to recall the earlier booking lookup","Append the tool_result block with the returned data to the next request","Add a system prompt line telling the model not to call lookup_booking twice"],[2],"The model only knows what is in the messages it is sent. Each tool result has to be appended to the conversation as a tool_result block, so the next iteration can reason about the data and choose the next step.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N03","The coordinator agent spawns a billing subagent through the Task tool to investigate disputed charges. Before spawning it, the coordinator has verified the guest and identified the booking and the 2 disputed charges. In 31% of disputes the billing subagent then asks the guest for the booking number again. The billing subagent's AgentDefinition has a short system prompt and the right tools. What fixes this?",["Add get_guest to the billing subagent's tools and let it look the details up again","Write everything the coordinator has confirmed into the Task prompt that it sends","Tell the billing subagent's system prompt to read the coordinator's history first","Turn on shared memory between the coordinator and its subagents in the settings"],[1],"Subagents run with isolated context: they do not inherit the coordinator's conversation.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N04","Session logs show that 4% of chats end with no resolution and no escalation: the loop hits the max_tokens limit, a tool times out twice, or the guest stops replying while a tool call is pending. In each case the guest's issue is simply dropped. The system prompt already tells the agent to escalate when it cannot finish. What design makes sure every chat ends in a resolution or a handoff?",["Have the agent tell the guest its progress before each tool call it makes","Raise max_tokens and the tool timeout until these early endings become rare","Code that runs after the loop ends and passes unresolved chats to a person","Repeat the escalate-when-stuck rule at the start and end of the system prompt"],[2],"The failures happen when the loop itself ends abnormally, so nothing inside the loop, including the model following its prompt, can be relied on to catch them.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N05","When a refund exceeds the agent's limit, it calls escalate_to_human with the message \"Guest needs help with a refund, please review.\" Human agents cannot see the chat transcript. They spend an average of 7 minutes re-asking guests for details the agent had already confirmed, and most often they re-run the identity check the agent had already passed. What should the escalation pass?",["Guest ID and booking, verified status, root cause, amount and next step","Guest ID and booking, root cause, refund amount and recommended action","Guest ID and booking plus the last 10 messages of the chat as a transcript","Guest ID and booking, the guest's sentiment and a priority from 1 to 5"],[0],"A structured handoff carries what the agent has established, including authorisation state such as verified identity, in fields the human can act on at once: who, which booking, what went wrong, how much, and what to do next.","blob/main/tutor/mock-final-sim3.html","2026-11-02",1],[1,1,"mock-final-sim3.html · N06","Policy says a goodwill adjustment above 20,000 points needs a duty manager's approval. The system prompt states the limit, and the agent gets it right in most chats, but an audit found 17 adjustments above 20,000 points last month made with no manager involved. The group wants the limit to hold in every chat, and the guest's request should still reach someone who can approve it. What should you change?",["A PreToolUse hook that blocks adjust_points over 20,000 and routes to escalation","A PostToolUse hook that flags adjust_points results over 20,000 for a manager","A PreToolUse hook that caps every adjust_points call at 20,000 and lets it run","An adjust_points description saying amounts over 20,000 need a manager first"],[0],"When a business rule must hold every time, a hook that intercepts the outgoing tool call enforces it in code, and it can redirect the blocked request to the escalation workflow.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N07","lookup_booking comes from the booking vendor's MCP server, which the team cannot modify. It returns each booking's status in the hotel's own code: some hotels send numbers such as \"3\", others send words such as \"CXL\" or \"HELD\". In 5% of chats the agent tells a guest that a cancelled booking is still active. A system prompt table of the codes cut the rate only from 6% to 5%. What should you add?",["A fuller system prompt table of every hotel's status codes and meanings","A PostToolUse hook that maps every status in the result to 1 shared code set","A PostToolUse hook that adds each hotel's name next to its raw status code","A PreToolUse hook that adds a plain-status request to each lookup_booking call"],[1],"A PostToolUse hook intercepts each tool result before the model sees it, so code can translate every hotel's status into one shared set. The model then never has to interpret mixed codes.","blob/main/tutor/mock-final-sim3.html","2026-11-02",1],[1,1,"mock-final-sim3.html · N16","The root CLAUDE.md tells Claude to run the formatter (ruff format) after editing any Python file. In 9 of 30 sessions reviewed last week Claude skipped it, and CI then failed on formatting. Moving the line to the top of CLAUDE.md and adding \"IMPORTANT\" made no measurable difference. What makes formatting happen after each edit?",["A .claude/rules/python.md file with paths for **/*.py that repeats the line","A PostToolUse hook on Edit and Write that runs ruff format on the changed file","A PreToolUse hook on Edit that runs ruff format before Claude changes the file","A /format command in .claude/commands/ that developers run after each edit"],[1],"A PostToolUse hook runs after every matching tool call, in code, whatever the model decides.","blob/main/tutor/mock-final-sim3.html","2026-11-02",1],[1,1,"mock-final-sim3.html · N31","Every question goes through all 4 subagents in order: explorer, dependency tracer, test runner and doc writer. A question such as \"which file defines the late-fee rate?\" takes 6 minutes and 4 subagent runs, though the explorer alone answers it. About 70% of questions are lookups like this. What should change?",["Let the explorer skip its work when it judges a question to be simple","Have the coordinator run all 4 subagents in parallel for each question","Add a fifth subagent that answers short lookups before the pipeline starts","Have the coordinator choose which subagents each question needs, if any"],[3],"Part of the coordinator's job is to analyse each query and invoke only the subagents it needs, instead of routing everything through the full pipeline.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N32","Asked to document how a loan payoff is calculated, the system produced a draft that covers interest and fees but says nothing about prepayment penalties. The coordinator's log shows the explorer was never asked about penalties, and the doc writer is told only to write up what it receives. The other 3 sections are accurate. What should the coordinator do?",["Tell the doc writer to add a prepayment penalty section from what it knows","Rerun all 4 subagents on the whole payoff question with a longer prompt","Check the draft for gaps, send the explorer a penalty query, then rerun the writer","Ask the explorer to read every file in the payoff module and resend it all"],[2],"In an iterative refinement loop the coordinator evaluates the output for gaps, re-delegates targeted queries to the right subagent, and re-invokes the writer until coverage is sufficient.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0],[1,1,"mock-final-sim3.html · N33","For a refactoring question, the coordinator sends the same prompt, \"find everything related to escrow accounts\", to 4 explorer subagents in parallel. All 4 search the same 140 files, and 80% of their findings are duplicates the coordinator has to merge. The escrow code covers several separate concerns. How should the coordinator split the work?",["Keep the same prompt and remove duplicates once all 4 explorers finish","Use 1 explorer only and give it the whole escrow question to work on","Give each explorer a distinct escrow subtopic with its own search goal","Split the 140 files into 4 equal batches of 35 in file-name order"],[2],"The coordinator should partition the scope across subagents by distinct subtopic, which minimises duplicated work while keeping the parallelism and keeping each concern whole.","blob/main/tutor/mock-final-sim3.html","2026-11-02",0]]},QS=DATA.QS,SRCS=DATA.SRCS;

 od.forEach((oi,pos)=>{let c="opt";const s=sel.includes(oi);if(r){if(q[5].includes(oi))c+=" ok";else if(s)c+=" bad"}else if(s)c+=" sel";h+=`<button class="${c}" data-i="${i}" data-o="${oi}" ${r&&S.mode==="practice"?"disabled":""}><span class="k">${L[pos]}</span><span>${esc(q[4][oi])}</span></button>`});
 if(!r&&k>1)h+=`<p class="mut" style="font-size:.85rem;margin:6px 0 0">Choose ${k} options${S.mode==="mock"?"":" — the answer is checked once "+k+" are selected"}. ${sel.length}/${k} selected.</p>`;
 if(r){const ok=isOk(i,sel),letters=q[5].map(a=>L[od.indexOf(a)]).sort().join(" + ");
  let note="";
  if(practiceMiss&&mockMiss){const ms=S.mockWrong[i].sel;const same=ms.length===sel.length&&ms.every(x=>sel.includes(x));if(!same){const ml=ms.map(a=>L[od.indexOf(a)]).filter(Boolean).sort().join(" + ");note=` Timed mock answer: ${ml}.`;}}
  h+=`<div class="exp ${ok?"":"wrong"}"><b>${ok?"✓ Correct":"✗ Incorrect — answer "+letters}</b>${note?esc(note):""}${esc(q[6])} <a href="${src.url}/${q[7]}" target="_blank" rel="noopener">Source</a></div>`;
  let btns="";
  if(S.mode!=="mock"&&done(S.picked[i]))btns+=`<button data-act="rq" data-i="${i}">↺ Reset question</button>`;
  if(mockMiss&&!retrying[i])btns+=`<button type="button" data-act="retry" data-i="${i}">Try again</button>`;
  if(btns)h+=`<div style="margin-top:10px">${btns}</div>`;
 }
 return h+"</article>"}
function domainBars(list,pk){return [1,2,3,4,5].map(d=>{const a=list.filter(i=>QS[i][0]==d&&done(pk[i])&&(pk[i].length===need(i))),c=a.filter(i=>isOk(i,pk[i])).length,pct=a.length?Math.round(c/a.length*100):0;const col=pct>=72?"var(--ok)":pct>=50?"#d97706":"var(--bad)";
 return `<div class="dbar"><div class="row"><span>${DN[d]}</span><span class="mut">${c}/${a.length} · ${a.length?pct+"%":"—"}</span></div><div class="tr"><i style="width:${pct}%;background:${a.length?col:"transparent"}"></i></div></div>`}).join("")}
function practiceStats(){const a=Object.keys(S.picked).map(Number).filter(i=>done(S.picked[i])),c=a.filter(i=>isOk(i,S.picked[i])).length;return{a,c}}
function results(){const m=S.mock;let h="";
 if(m&&m.done){const c=m.ids.filter(i=>isOk(i,m.pick[i])).length,pct=Math.round(c/60*100);
  h+=`<section class="card"><div class="meta"><span class="tag">Latest mock</span></div><div class="dash"><div class="kpi"><div class="l">Score</div><div class="big">${pct}%</div></div><div class="kpi"><div class="l">Correct</div><div class="big">${c}<span class="mut" style="font-size:.5em">/60</span></div></div><div class="kpi"><div class="l">Time used</div><div class="big" style="font-size:1.6rem">${fmt(usedSec(m))}</div></div></div>${domainBars(m.ids,m.pick)}<p class="mut" style="font-size:.85rem">Bars: green ≥72%, amber 50–71%, red below 50%. Multiple-response items score all-or-nothing. Time used excludes time while this page was closed. A rough guide only; the real exam is scaled.</p><button class="primary" data-act="mock">New mock</button></section>`}
 const {a,c}=practiceStats(),w=a.length-c;
 h+=`<section class="card"><div class="meta"><span class="tag">Practice overall</span></div><div class="dash"><div class="kpi"><div class="l">Answered</div><div class="big">${a.length}<span class="mut" style="font-size:.5em">/${N}</span></div></div><div class="kpi"><div class="l">Accuracy</div><div class="big">${a.length?Math.round(c/a.length*100)+"%":"—"}</div></div><div class="kpi"><div class="l">Wrong to review</div><div class="big">${w}</div></div></div>${domainBars(QS.map((q,i)=>i),S.picked)}${w?'<button class="primary" data-act="review">Review wrong answers</button>':""}</section>`;
 return h}
function renderGate(){
 document.body.classList.add("gated");
 $("tools").hidden=true;
 $("timer").hidden=true;
 $("score").textContent="Saved session";
 $("prog").style.width="0";
 const app=$("app");
 if(gate.kind==="resume"){
  app.innerHTML=`<section class="card" id="restore"><div class="q">Resume practice?</div><p>${esc(summary(pending))}</p><p class="mut">Resume restores this session, including each choice, partial multi-select answers, flags, filters, question order, the timer paused while the page was closed, and completed results. Start fresh clears that saved session in this browser and does not happen unless you choose it.</p><div class="nav"><button class="primary" type="button" id="resume" data-act="resume">Resume practice</button><button type="button" id="fresh" data-act="fresh">Start fresh</button></div></section>`;
 }else{
  const why=gate.kind==="incompatible"?(gate.reason==="data"?"Saved progress belongs to a different question bank and was not loaded.":"Saved progress uses an incompatible format and was not loaded."):"Saved progress could not be read and was not loaded.";
  app.innerHTML=`<section class="card" id="restore"><div class="q">Saved progress was not restored</div><p>${esc(why)} It was left untouched.</p><p class="mut">Continue uses a new on-screen session without writing over that data. Start fresh replaces it only after you confirm, and only after a copy can be set aside.</p><div class="nav"><button class="primary" type="button" data-act="continue">Continue without saving over it</button><button type="button" data-act="fresh">Start fresh</button></div></section>`;
 }
}
function render(){
 if(gate){renderGate();return}
 document.body.classList.remove("gated");
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode));
 $("tools").hidden=S.mode==="mock"||S.mode==="results";
 $("flt").value=S.filter;$("srcf").value=S.src;$("sort").value=S.sort;$("view").textContent=S.view==="card"?"List all":"One at a time";
 const tm=$("timer");tm.hidden=!(S.mode==="mock"&&S.mock&&!S.mock.done);
 if(S.mode==="mock"&&S.mock){const m=S.mock,n=m.ids.filter(i=>(m.pick[i]||[]).length===need(i)).length;$("score").textContent=m.done?`Mock ${m.ids.filter(i=>isOk(i,m.pick[i])).length}/60`:`${n}/60 answered`;tm.textContent="⏱ "+fmt(left());$("prog").style.width=(n/60*100)+"%"}
 else{const {a,c}=practiceStats();$("score").textContent=`✓ ${c} / ${a.length}`;$("prog").style.width=(a.length/N*100)+"%"}
 const app=$("app");
 if(S.mode==="results"){app.innerHTML=results();return}
 if(S.mode==="mock"&&!S.mock){app.innerHTML=`<section class="card"><div class="q">Timed mock exam</div><p class="mut">60 questions drawn at random by exam weight (16 / 11 / 12 / 12 / 9 across D1–D5 ≈ 27/18/20/20/15%), 120 minutes, new question and option order every attempt, avoiding the previous attempt's questions. Multiple-response items score all-or-nothing. Answers stay hidden until you submit or time runs out. The clock pauses while this page is closed.</p><button class="primary" data-act="mock">Start mock</button></section>`;return}
 const L2=ids();if(!L2.length){app.innerHTML=`<section class="card"><div class="q">${S.mode==="review"?"No wrong answers from practice or a timed mock":"No questions"}</div><p class="mut">${S.mode==="review"?"Answer practice questions, or finish a timed mock. Anything you miss in either shows up here.":""}</p></section>`;return}
 let k=Math.min(S.idx[S.mode]||0,L2.length-1);S.idx[S.mode]=k;
 let extra=S.mode==="mock"?(S.mock.done?`<section class="card"><b>Mock finished.</b> <button data-act="results">See results</button> <button data-act="mock">New mock</button></section>`:`<div class="nav" style="margin-bottom:12px"><span class="grow"></span><button data-act="submit">Submit mock</button></div>`):"";
 if(S.view==="list"&&S.mode!=="mock"){app.innerHTML=extra+L2.map((i,j)=>qcard(i,j+1,L2.length)).join("");return}
 app.innerHTML=extra+qcard(L2[k],k+1,L2.length)+`<div class="nav"><button data-act="prev" ${k?"":"disabled"}>← Previous</button><span class="grow">${k+1} / ${L2.length}</span><button class="primary" data-act="next" ${k<L2.length-1?"":"disabled"}>Next →</button></div>`}
function toTop(){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}
function go(d){const n=ids().length;S.idx[S.mode]=Math.max(0,Math.min(n-1,(S.idx[S.mode]||0)+d));save();render();toTop()}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function toggle(arr,o,k){const a=arr.slice(),j=a.indexOf(o);if(j>=0)a.splice(j,1);else{if(k===1)return[o];a.push(o);if(a.length>k)a.shift()}return a}
function gradeMockRetry(i,d){
 if(isOk(i,d))delete S.mockWrong[i];
 else S.mockWrong[i]={sel:d.slice(),at:Date.now()};
 delete retrying[i];delete mockDraft[i];save();
}
function pick(i,o){const k=need(i);
 if(S.mode==="mock"){if(!S.mock||S.mock.done)return;S.mock.pick[i]=toggle(S.mock.pick[i]||[],o,k);save();rerender();return}
 if(S.mode==="review"&&S.mockWrong&&S.mockWrong[i]&&!done(S.picked[i])){if(!retrying[i]){retrying[i]=true;mockDraft[i]=[]}}
 if(retrying[i]){const d=toggle(mockDraft[i]||[],o,k);if(d.length===k)gradeMockRetry(i,d);else if(d.length)mockDraft[i]=d;else delete mockDraft[i];rerender();return}
 if(revealed(i)){if(S.mode!=="review")return;delete S.picked[i];delete S.draft[i]}
 const d=toggle(S.draft[i]||[],o,k);
 if(d.length===k){S.picked[i]=d;delete S.draft[i]}
 else if(d.length)S.draft[i]=d;
 else delete S.draft[i];
 save();rerender()}
function tryAgain(i){if(!S.mockWrong||!S.mockWrong[i])return;retrying[i]=true;delete mockDraft[i];rerender()}
function clearRetry(){Object.keys(retrying).forEach(k=>delete retrying[k]);Object.keys(mockDraft).forEach(k=>delete mockDraft[k]);}
function resetQ(i){if(S.mode==="mock")return;const had=S.draft[i]||done(S.picked[i]);delete S.draft[i];if(!done(S.picked[i])){if(had)save();rerender();return}delete S.picked[i];save();rerender()}
function toggleFlag(i){if(S.flags[i])delete S.flags[i];else S.flags[i]=true;save();rerender()}
function startMock(){if(S.mock&&!S.mock.done&&!confirm("Discard the current mock?"))return;const prev=new Set(S.mock?S.mock.ids:[]);let a=[];[1,2,3,4,5].forEach(d=>{const pool=QS.map((q,i)=>q[0]==d?i:-1).filter(i=>i>=0);a.push(...shuffle(pool.filter(i=>!prev.has(i))).concat(shuffle(pool.filter(i=>prev.has(i)))).slice(0,QUOTA[d]))});const perm={};a.forEach(i=>{const z=[...Array(QS[i][4].length).keys()];perm[i]=QS[i][9]?z:shuffle(z)});S.mock={ids:shuffle(a),perm,pick:{},start:Date.now(),elapsedMs:0,tickAt:document.visibilityState==="hidden"?null:Date.now(),done:false,end:null,timeUsedMs:null};S.mode="mock";S.idx.mock=0;save();render();toTop()}
function finish(){if(!S.mock||S.mock.done)return;if(S.mock.tickAt){S.mock.elapsedMs=Math.min(7200000,(S.mock.elapsedMs||0)+(Date.now()-S.mock.tickAt));S.mock.tickAt=null}const ms=Math.min(7200000,S.mock.elapsedMs||0);S.mock.elapsedMs=ms;S.mock.timeUsedMs=ms;S.mock.done=true;S.mock.end=Date.now();if(!S.mockWrong)S.mockWrong={};const at=S.mock.end;for(const i of S.mock.ids){const sel=S.mock.pick[i];if(!Array.isArray(sel)||sel.length<1||isOk(i,sel))continue;S.mockWrong[i]={sel:sel.slice(),at}}S.mode="results";save();render();toTop()}
function doResume(){if(!pending)return;clearRetry();S=pending;pending=null;gate=null;holdWrites=false;normalizeAfterLoad();booted=true;save();render();toTop();clearAlert()}
function doFresh(){if(!confirm("Start fresh clears this V5 page's saved answers, flags, mock mistakes, mock progress, and results. The original page's and V4's saved data is left as it is. Export a backup first if you might want this V5 session. This does not happen when you reopen the page. Continue?"))return;replaceStored(clearedState())}
function doContinue(){gate=null;document.body.classList.remove("gated");S=blank();normalizeAfterLoad();render();setStatus("held")}
function exportSource(){if(gate&&gate.kind==="resume"&&pending)return pending;return snapshot()}
function exportBackup(){
 if(!booted)return;
 if((gate&&gate.kind!=="resume")&&!hasProgress(S)){alertUser("Nothing readable to export. Stored data was left untouched.");return}
 clearAlert();
 const env=envelope(exportSource());
 const blob=new Blob([JSON.stringify(env,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 const url=URL.createObjectURL(blob);
 a.href=url;a.download="ccarf-practice-v5-backup.json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function importText(text){
 const parsed=parseImport(text);
 if(!parsed.ok){alertUser(parsed.error);return}
 const busy=hasProgress(gate&&gate.kind==="resume"?pending:S)||!!blocked;
 if(busy&&!confirm("Importing replaces this V5 page's session and its own saved copy. The original page's and V4's saved data is not changed. Continue?")){alertUser("Import cancelled. Current progress was not changed.");return}
 const ok=await replaceStored(parsed.state);
 if(!ok)alertUser("Import was not applied. Current progress was not changed.");
}
function onHidden(){if(!booted||gate)return;const m=S.mock;if(m&&!m.done&&m.tickAt){m.elapsedMs=Math.min(7200000,(m.elapsedMs||0)+(Date.now()-m.tickAt));m.tickAt=null}save()}
function onVisible(){if(!booted||gate)return;const m=S.mock;if(m&&!m.done&&!m.tickAt&&document.visibilityState!=="hidden"){if((m.elapsedMs||0)>=7200000){finish();return}m.tickAt=Date.now();save()}}
document.addEventListener("click",e=>{
 if(!booted)return;
 const actEl=e.target.closest("[data-act]");
 if(gate){if(!actEl)return;const act=actEl.dataset.act;if(act==="resume")doResume();else if(act==="fresh")doFresh();else if(act==="continue")doContinue();return}
 const o=e.target.closest(".opt");if(o&&!o.disabled){pick(+o.dataset.i,+o.dataset.o);return}
 const t=e.target.closest(".tab");if(t){S.mode=t.dataset.m;save();render();return}
 if(!actEl)return;const act=actEl.dataset.act;
 if(act==="next")go(1);else if(act==="prev")go(-1);else if(act==="mock")startMock();else if(act==="results"){S.mode="results";save();render()}else if(act==="review"){S.mode="review";S.idx.review=0;save();render()}else if(act==="rq")resetQ(+actEl.dataset.i);else if(act==="retry")tryAgain(+actEl.dataset.i);else if(act==="flag")toggleFlag(+actEl.dataset.i);else if(act==="submit"){if(confirm("Submit the mock now?"))finish()}
});
$("flt").onchange=e=>{if(!booted||gate)return;S.filter=e.target.value;S.idx.practice=0;S.idx.review=0;save();render()};
$("srcf").onchange=e=>{if(!booted||gate)return;S.src=e.target.value;S.idx.practice=0;S.idx.review=0;save();render()};
$("sort").onchange=e=>{if(!booted||gate)return;S.sort=e.target.value;S.idx.practice=0;S.idx.review=0;save();render()};
$("view").onclick=()=>{if(!booted||gate)return;S.view=S.view==="card"?"list":"card";save();render()};
$("theme").onclick=()=>{if(!booted||gate)return;S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();applyTheme()};
$("rst").onclick=()=>{if(!booted||gate)return;if(confirm("Reset all saved progress on this V5 page (answers, flags, mock mistakes, mock, and results)? The original page's and V4's saved data is not changed. Reopening the page does not do this."))replaceStored(clearedState())};
$("export").onclick=exportBackup;
$("importbtn").onclick=()=>{if(booted)$("importfile").click()};
$("importfile").onchange=()=>{const f=$("importfile").files&&$("importfile").files[0];$("importfile").value="";if(!f)return;if(f.size>2000000){alertUser("That backup is too large. Current progress was not changed.");return}const reader=new FileReader();reader.onload=()=>importText(String(reader.result||""));reader.onerror=()=>alertUser("That file could not be read. Current progress was not changed.");reader.readAsText(f)};
document.addEventListener("keydown",e=>{if(!booted||gate)return;if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(S.mode==="results"||(S.mode==="mock"&&!S.mock))return;
 const L2=ids();if(!L2.length)return;const k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,e:4,"1":0,"2":1,"3":2,"4":3,"5":4},cur=L2[S.idx[S.mode]||0];
 if(k in map&&S.view==="card"){const od=ord(cur);if(map[k]<od.length){pick(cur,od[map[k]]);e.preventDefault()}}else if(k==="n"||k==="enter"){if(!(e.target.tagName==="BUTTON"&&k==="enter")){go(1);e.preventDefault()}}else if(k==="p"){go(-1);e.preventDefault()}else if(k==="r"&&S.view==="card"&&S.mode!=="mock"){resetQ(cur);e.preventDefault()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")onHidden();else onVisible()});
window.addEventListener("pagehide",onHidden);
window.addEventListener("freeze",onHidden);
window.addEventListener("pageshow",ev=>{if(ev.persisted)onVisible()});
setInterval(()=>{
 if(!booted||gate)return;
 if(!(S.mode==="mock"&&S.mock&&!S.mock.done))return;
 if(document.visibilityState==="hidden")return;
 if(left()<=0){finish();return}
 const tm=$("timer");if(tm)tm.textContent="⏱ "+fmt(left());
 const m=S.mock;if(m.tickAt){const now=Date.now();m.elapsedMs=Math.min(7200000,(m.elapsedMs||0)+(now-m.tickAt));m.tickAt=now}
 save();
},1000);
async function boot(){
 try{storage=await probe();}catch(e){storage=null;}
 booted=true;
 if(!storage){setStatus("unavailable");render();return}
 let loaded;
 try{loaded=await loadBest();}catch(e){holdWrites=true;gate={kind:"corrupt"};setStatus("held");render();return}
 if(loaded.status==="ok"){
  if(hasProgress(loaded.state)){pending=loaded.state;gate={kind:"resume"};if(loaded.state.theme){S.theme=loaded.state.theme;applyTheme()}setStatus("saved");render();return}
  S=loaded.state;normalizeAfterLoad();setStatus("ready");render();return
 }
 if(loaded.status==="corrupt"||loaded.status==="incompatible"){holdWrites=true;blocked={key:loaded.key,raw:loaded.raw};gate={kind:loaded.status,reason:loaded.reason||""};setStatus("held");render();return}
 setStatus("ready");render();
}
boot();
