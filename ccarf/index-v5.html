6","An engineer spends 3 hours over 2 sessions mapping how cabin holds expire. After the agent ran /compact at about 80 minutes, its answers began to mention 'a typical inventory service' in place of the CabinHoldManager and BerthLockDao classes it had found. It also contradicted its earlier answer about the 15-minute lock timeout. What should the tool do?",["Keep a scratchpad file of key findings and check it for later questions","Run /compact at 30-minute intervals, before the context gets a chance to fill","Move the agent to a model with a larger context window for this work","Add a CLAUDE.md line telling the agent to cite class names in each answer"],[0],"These are the signs of context degradation, and compaction is what lost the details. A scratchpad file records key findings outside the context, survives compaction and new sessions, and the agent re-reads it for later questions.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K17","An engineer asks which services read the fare_rules table before planning a schema change. The agent's Grep returns 1,400 matches across 600 files, and it reads 60 of them in the main session. By the time it answers, the context is 85% full and the design discussion has not started. How should the tool handle questions like this?",["Narrow the Grep pattern to the upper-case table name to cut the matches","Raise the Read limit to read whole files in one call, with fewer calls","Run /clear after the search and then paste the list of services back in","Delegate it to a subagent that explores and returns only its findings"],[3],"Subagent delegation isolates verbose exploration: the subagent burns its own context on 60 files and returns a short answer, and the main session keeps its context for coordination and design.","blob/main/tutor/mock-d145.html","2026-11-02",0],[1,1,"mock-d145.html · K18","Every Friday the tool reviews about 30 files changed that week against the same 4 checks: SQL built from strings, missing null checks, logging of card numbers and calls to deprecated pricing APIs. The steps are identical each week. A single prompt over all 30 files misses issues in files reviewed late, and gives different verdicts on near-identical code. How should the review be structured?",["A coordinator that creates new subtasks from what each file turns out to contain","A single pass with the 30 files sorted by size, the largest at the top","A fixed chain: a pass per file for the 4 checks, then a cross-file pass","Three runs of the same single prompt, keeping findings that 2 of 3 report"],[2],"A predictable multi-aspect review suits prompt chaining: per-file local passes, then a separate cross-file integration pass, which avoids attention dilution.","blob/main/tutor/mock-d145.html","2026-11-02",1],[1,1,"mock-d145.html · K19","On Monday an engineer analysed 40 files in a session named cabin-holds. By Thursday, teammates' commits have changed 2 of those files: RateCalc.java and HoldExpiry.pm. The other 38 are unchanged, and the engineer wants to continue the investigation. What should they do?",["Resume cabin-holds and ask the agent to re-read all 40 files before continuing","Resume cabin-holds and tell the agent those 2 files changed, for targeted re-analysis","Fork cabin-holds with fork_session and continue the work in the forked branch","Start a new session and have the agent re-explore all 40 files from the beginning"],[1],"Most of the prior context is still valid, so resuming is right, and telling the session exactly which files changed lets it re-analyse just those.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K20","The tool writes database migration scripts, then asks the same session to review each script before an engineer runs it. Over 2 months the review step approved 96% of scripts, and 3 approved scripts dropped booking data in staging. Extended thinking is already on for the review step. What should change?",["Add an instruction to review the script critically, as if a stranger wrote it","Review each script in a separate Claude instance with no generation context","Run the same-session review 3 times and approve only when all 3 runs agree","Have the session list the risks it considered while writing, then review them"],[1],"A model that just generated the code keeps its reasoning and is unlikely to question its own decisions. An independent instance without that context catches what self-review misses.","blob/main/tutor/mock-d145.html","2026-11-02",1],[4,1,"mock-d145.html · K21","The extraction schema marks country_of_origin as a required string. About 18% of packing lists do not state an origin, and on those the model fills in the exporter's country, which reviewers found wrong 40% of the time. A prompt line saying 'Do not guess the country' cut the rate only slightly. What change addresses this?",["Retry with a validation error when origin equals the exporter's country","Add a few-shot example of a packing list that states its origin clearly","Make country_of_origin nullable and optional, with null for not stated","Make the prompt line stronger and repeat it at the end of the prompt"],[2],"A required field forces a value, and when the document has none the model fabricates one. A nullable, optional field lets it say \"not stated\" truthfully.","blob/main/tutor/mock-d145.html","2026-11-02",1],[4,1,"mock-d145.html · K22","The incoterm field is an enum of the 11 Incoterms. Some invoices state a term that is not on the list, such as 'Franco domicile', and others give two terms such as 'CIF/FOB'. On those, the model picks the nearest enum value, wrong about 7% of the time. Reviewers need to see which documents were unclear. What should change in the schema?",["List the synonyms seen for each Incoterm in the extraction prompt","Add a confidence number to incoterm and retry the call when it falls under 0.8","Change incoterm to a free-text string and validate it in later code","Add 'unclear' and 'other' to the enum, with a detail string for the text"],[3],"An 'unclear' value lets the model mark an ambiguous term honestly, and 'other' plus a detail string captures terms outside the list. Reviewers can route both.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K23","Invoices list line items in 3 layouts: a table (60%), one line of prose per item (25%), or item details split between a header block and an annex page (15%). Accuracy is 98% on tables but 71% on the annex layout, where line_items comes back empty in 30% of documents. The prompt already has 2 paragraphs describing the annex layout. What should you add?",["A separate pipeline with its own model for annex documents","A minItems of 1 on line_items in the extraction schema","A third paragraph that describes the annex layout in more detail","Examples of correct extraction from annex and prose invoices"],[3],"Few-shot examples are the technique for varied document structures, and they fix empty extraction where instructions alone have not. The paragraphs were already tried.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K24","Packing lists state quantities in many notations: '12 ctns x 24 pcs', '24/12', '288 pcs in 12 ctns' and others. The prompt says to extract total pieces, and a list of 9 known notations was added to it, but each month brings new ones. On those the model often returns 12 in place of 288. What should you add to the prompt?",["A request to restate the quantity text before giving total pieces","A longer list that adds the 14 new notations found since last month","A rule to use the largest number in the quantity text as the total","2 to 4 worked examples that show the reasoning on unclear notations"],[3],"Few-shot examples that show the reasoning on ambiguous cases let the model generalise to notations it has not seen. A list matches only the cases written down.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K25","The model flags documents for the reviewers under the instruction 'Flag anything unusual; only flag issues you are confident about.' Last month 40% of the 900 flags were dismissed, and reviewers began skimming them; one real undervaluation was missed. Most dismissed flags were about odd fonts, stamps and date formats. What should change?",["Name what to flag (totals that differ from line items), and what to skip","Add 'be conservative' to the instruction and leave the rest of it as it is","Show all the flags to reviewers but sort them by the confidence the model reports","Have the model score each flag and show reviewers only the flags over 0.8"],[0],"Explicit categorical criteria — what to report and what to skip — improve precision. Confidence-based filtering does not, and noisy flags erode trust in the accurate ones.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K26","About 5% of extractions fail validation, and the pipeline retries every failure 3 times with the validation error appended. Two kinds of failure dominate. In one, the invoice total does not match the line items because a line was misread. In the other, the HS code is stated only in a classification ruling the importer did not upload. What should change?",["Retry both kinds of failure on a larger model, without the error appended","Raise the retry limit to 5 for both kinds of failure and keep the error appended","Add few-shot examples of HS codes to the prompt for the missing-ruling cases","Retry the misread totals with the error; send missing-ruling cases to a person"],[3],"Retry with error feedback fixes format and structural mistakes like a misread line. It cannot fix information absent from the documents provided, as with an HS code that lives in a ruling nobody uploaded.","blob/main/tutor/mock-d145.html","2026-11-02",0],[4,1,"mock-d145.html · K27","Post-clearance audit checks run through the Message Batches API, which can take up to 24 hours to finish a batch. The brokerage promises audit results within 36 hours of a document arriving, and documents arrive around the clock. Submitting more often costs nothing extra but adds operations work. What is the least frequent submission schedule that still meets the 36-hour promise?",["Every 36 hours","Every 12 hours","Every 24 hours","Every 6 hours"],[1],"Worst case is a document that arrives just after a submission: it waits one full interval, then up to 24 hours of processing. 12 + 24 = 36 meets the promise; 24 + 24 = 48 and 36 + 24 = 60 do not.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K28","On 5,000 labelled documents, field-level accuracy is 97.4% overall, and the team proposes to stop human review of any document whose fields all score above 0.9 confidence. Broken down, certificates of origin from 2 chambers that use handwritten forms reach only 81% on the origin_criterion field. Those certificates are 4% of volume. What should happen before review is reduced?",["Proceed now: 97.4% overall is above the 95% target the team agreed on","Raise the skip threshold from 0.9 to 0.97 for all the document types","Check accuracy by document type and field; keep review on weak ones","Replace targeted review with a random 5% sample of all the documents"],[2],"Aggregate accuracy hides weak segments. Accuracy has to be validated by document type and field before high-confidence extractions are automated, and weak segments keep their review.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K29","The 6 reviewers can check about 400 of the 2,500 documents that arrive each day, and today they get a random 400. Most errors cluster in a few fields, and many come from shipments whose invoice and packing list disagree. The model can output a confidence score per field, and a labelled set of 3,000 documents exists. How should the 400 be chosen?",["By field confidence with thresholds set on the labelled set, plus documents that conflict","By declared value, with the 400 highest-value shipments of each day going to review","By the model's own overall confidence for each document, with the lowest 400 to review","By random sample as now, with the sample raised to 600 by adding 2 reviewers"],[0],"Review capacity goes where errors are likely: fields whose confidence is low against thresholds calibrated on labelled data, and documents whose sources contradict each other.","blob/main/tutor/mock-d145.html","2026-11-02",0],[5,1,"mock-d145.html · K30","Six months ago, documents with every field above the calibrated confidence threshold stopped going to review; that is 78% of volume. Last month a large importer changed its invoice template, the model started reading the freight charge as the invoice total, and the error ran for 5 weeks before a customs query found it. Confidence on those documents stayed high. What would have caught this sooner?",["An ongoing stratified random sample of high-confidence extractions","A monthly re-run of the original labelled validation set of documents","A few-shot example of the new template added to the extraction prompt","A lower threshold that sends about 40% of documents to human review"],[0],"Stratified random sampling of high-confidence extractions measures their error rate continuously and surfaces novel error patterns, like a new template the model reads confidently and wrongly.","blob/main/tutor/mock-d145.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R01","Your developer-productivity agent has search_wiki for internal design docs and search_code for the monorepo. Three weeks ago you rewrote both descriptions with input formats, example queries, and when-to-use-which guidance; misroutes fell from 26% to 11% and have stayed there for 2 releases. Nine in 10 remaining misroutes are questions like 'where is RetryPolicy defined?' sent to search_wiki. The system prompt contains: 'When asked where something is defined, check the design docs before anything else.' What is the most effective next step?",["Delete the 'defined means design docs' rule from the system prompt and let the rewritten tool descriptions decide the routing","Add six few-shot examples to the system prompt that show 'where is X defined' questions about code symbols being routed to search_code","Merge both into one search tool with a target parameter set to wiki or code, and let the model choose the target on each request","Rename search_wiki to search_design_docs and add a line to its description saying it never contains source code definitions"],[0],"The descriptions were already fixed and the improvement plateaued. The residue clusters on one phrase that a keyword-sensitive system prompt instruction ties to the wrong tool, and that instruction overrides the descriptions.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R02","Your support agent has 16 tools. Six of them are set_ticket_status, set_ticket_priority, set_ticket_assignee, set_ticket_tags, set_ticket_due_date and set_ticket_category; each takes a ticket ID and one value, and each returns the updated ticket. When a customer request changes 2 or more fields, the agent calls only one of the setters in 23% of cases and reports the ticket as fully updated. Each setter's description is already clear about which field it changes, and a system prompt line added last month, 'apply every change the customer asks for', moved the rate only from 27% to 23%. Which change best addresses this?",["Expand each setter's description with example requests and a reminder to check whether other fields also need to change","Move update work to a separate ticket-editing subagent that owns all six setters and is called by the main agent for every edit","Replace the six setters with one update_ticket tool that takes a ticket ID plus any of the six fields and returns the ticket","Add a system prompt rule telling the agent to list every field a request changes and then call one setter for each listed field"],[2],"The six tools act on the same resource with the same input and result shape; only the field differs.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R03","Your extraction agent enriches each parsed invoice with two MCP tools: get_customer, described as 'Returns details for the customer on an invoice', and lookup_account, described as 'Returns details for the account on an invoice'. Over 1,500 invoices, 14% of calls go to the wrong tool, split almost evenly in both directions and across every invoice type. The system prompt does not mention either tool. What should you do first?",["Add 8 few-shot examples to the system prompt that pair typical invoice lines with the right lookup tool to call next","Rewrite both descriptions to state each input format, what each returns, an example query, and when to pick which one","Put a routing step in front of the agent that classifies each invoice and calls the matching tool before the agent runs","Rename them get_customer_contact and lookup_billing_account, keeping the two current descriptions exactly as they are"],[1],"Two near-identical one-sentence descriptions give the model nothing to tell the tools apart, and errors spread evenly in both directions with no prompt involvement point at the descriptions themselves.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R04","A research subagent is asked to collect pricing data from 5 market databases. Three return results; the other 2 time out, and each still times out after the subagent's own 3 retries. The coordinator decides whether to re-dispatch, narrow scope, or note a coverage gap in the report. What should the subagent return to the coordinator?",["Keep retrying the 2 failed databases with a longer backoff until they respond, and return all 5 result sets together at that point","An error marked transient that lists the 2 failed sources and the retries tried, together with the results from the 3 that succeeded","An error marked transient for the whole task with no data attached, and let the coordinator re-dispatch all 5 of the database queries","The results from the 3 successful databases as a normal success, with a sentence in the summary text noting that 2 were unreachable"],[1],"The subagent already did its local recovery; what it could not resolve goes up with structure: category, what was attempted, and the partial results.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R05","Your get_order_history MCP tool returns an empty list whenever the order database query fails. In 4% of conversations the agent tells customers 'I can't find any orders on your account', and logs show each was a database timeout. About 9% of customers have newly created accounts and genuinely have no orders yet. How should get_order_history respond?",["Return one shared 'order history unavailable' message for both query failures and empty accounts, and let the agent explain it to the customer","Keep the empty list, and add a system prompt rule telling the agent to call get_order_history a second time whenever the first call returns no orders","Return isError with a transient category and isRetryable true when the query fails, and keep the empty list for accounts that have no orders","Return isError with a transient category for any empty result, and let the agent retry or escalate before it tells the customer anything"],[2],"An access failure and a successful query with no matches are different outcomes and need different signals. The timeout should come back as a structured, retryable error, while a genuinely empty account keeps returning an empty list, so the agent only says 'no orders' when that's true.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R06","Your billing agent has get_account_status, issue_credit and send_confirmation. issue_credit is only valid after get_account_status confirms the account is active, but with tool_choice set to auto, 7% of credit requests call issue_credit first using an account state the model assumed. Two of those credits last month went to closed accounts. How should you configure the requests?",["Force get_account_status on the first request, then let the model choose issue_credit and the rest in later turns","Add a numbered rule to the system prompt: get_account_status first, then issue_credit, then send_confirmation","Set tool_choice to any on the first request, which makes the model call a tool before writing any reply to the customer","Make account_status a required parameter of issue_credit, which makes the model supply the status before any credit"],[0],"The prerequisite has to be guaranteed, and forced selection with {\"type\": \"tool\", \"name\": \"get_account_status\"} is the setting that guarantees which tool runs first.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R07","Your extraction service has three schema tools: extract_invoice, extract_receipt and extract_statement, and the document type is not known in advance. You switched tool_choice from auto to any after 6% of auto responses came back as plain text and broke the parser. Reviewers also want a one-sentence reason for the chosen schema, but since the switch the 'explain your choice first' line in the prompt never produces any text. What should you change?",["Keep tool_choice set to any and add a required reason field to all three schemas, filled in as part of the tool call itself","Send each document twice: once with auto to get the explanation as text, then once with any to get the structured extraction call","Go back to auto and keep the explanation line, then add a parser check that resubmits any response that arrives without a tool call","Keep any and move the explanation instruction into each tool's description, where the model reads it at the moment it picks a schema"],[0],"Under any (or a forced tool) the API makes the response begin with the tool call, so no text can come before it however the prompt is worded.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R08","Your synthesis agent was given the full set of 12 web-research tools to check facts while drafting. It now runs broad searches mid-draft, and synthesis time has risen 40%. About 85% of its checks are single-fact confirmations against sources already collected; the rest need new research. How should you change its tools?",["Keep all 12 tools but rate-limit it to 3 search calls per draft, after which further searches are rejected with an error","Give it one narrow verify_fact tool for the simple checks and route checks that need new research via the coordinator","Remove every web tool and send each fact check, simple or complex, back through the coordinator for a research subagent","Keep all 12 tools and tell it in the system prompt to search only when a fact cannot be confirmed from collected sources"],[1],"Scoped access: the synthesis agent gets only what its role needs, plus a narrow cross-role tool for its high-frequency need.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R09","Your team's project .mcp.json, committed to the repo, configures the community Jira MCP server with its token written as ${JIRA_API_TOKEN}. Eleven engineers use its 9 tools daily. A new engineer cloned the repo yesterday and skipped the onboarding step that sets team environment variables, and Claude Code shows no Jira tools in their sessions. What should they do?",["Expand the Jira tool descriptions in .mcp.json, which helps Claude Code discover and prefer the Jira tools over built-ins","Replace ${JIRA_API_TOKEN} in .mcp.json with a shared team token and commit it, which keeps everyone's setup consistent","Copy the Jira server entry into their own user-level ~/.claude.json with their token written in directly, then restart Claude Code","Set JIRA_API_TOKEN in their own environment, restart Claude Code, then confirm in /mcp that the Jira server and its tools appear"],[3],"The shared config is correct: project scope for team tooling, with ${JIRA_API_TOKEN} expanded from each engineer's environment. The one missing piece is that variable on the new machine.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R10","Claude Code needs to change the expected status code in only the second of 5 mock-response blocks in a 400-line test fixture. The 5 blocks are byte-for-byte identical, including the lines above and below each one. Edit has now failed twice, reporting that its match text appears 5 times. What should Claude do next?",["Call Edit with replace_all set to true, then run the test suite and revert any of the other blocks that now fail","Grep the fixture with line numbers to find the second block, then pass that line number to Edit as its target line","Read the whole fixture file, then Write the complete contents back with only the second block's status code changed","Run sed through Bash to replace the status code pattern in the fixture file, then review the diff of the result"],[2],"Edit needs a unique anchor, and none exists when every block and its surroundings are identical. The documented fallback is Read for the full content, then Write it back with exactly the one change.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2-paper2.html · R11","In a 4,200-file legacy codebase you need every call site of sendInvoice before changing its signature. A Grep for 'sendInvoice' found 6 callers, but the test suite later broke in 23 other places. Those callers import it through 2 wrapper modules that re-export it under different names. What approach finds all of them?",["Read every file in both wrapper modules' directories up front, then build a full map of each import before searching","Grep with a broad pattern like 'send.*Inv' that catches likely variants of the name across the whole codebase","Glob for every file whose name contains 'invoice', then Read each matching file to look for calls to the function","Read the 2 wrappers to list every name sendInvoice is exported as, then Grep the codebase for each of those names"],[3],"Callers that use an alias never contain the original name. Identify every exported name first by reading the wrappers, then Grep for each name across the codebase, and Read only the hits needed to trace flows.","blob/main/tutor/mock-d2-paper2.html","2026-11-02",0],[2,1,"mock-d2.html · D01","Your support agent has two MCP tools: lookup_order, described as 'Looks up an order', and search_orders, described as 'Searches orders'. Over 2,000 conversations, 9% of lookup_order calls fail validation because the agent passes a customer email or a value like '#A1042' instead of the 10-character order ID. When it does have an email, it rarely uses search_orders. What change most directly addresses the root cause?",["Force tool_choice to search_orders on every turn that mentions an order, so lookup_order is only ever called later on an ID that the search has already returned and confirmed as valid","Add a rule to the system prompt listing every accepted order-ID format and telling the agent to search first whenever the customer mentions an order, then call lookup_order on the ID it gets back","Add server-side normalization to lookup_order that strips '#' and other symbols and, when it receives an email address, quietly runs the search_orders logic itself and returns the first matching order","Rewrite both descriptions: lookup_order states the exact ID format with an example and says to use search_orders when only an email or name is known; search_orders states its inputs and that it returns candidate IDs"],[3],"Tool descriptions are the primary signal the model uses to choose a tool and shape its input. These descriptions state neither the input format nor when to use one tool versus the other, so the agent guesses.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D02","Your process_refund MCP tool returns isError with the text 'Refund failed' for every failure. Refunds above the 500-dollar policy limit always fail this way, and the agent retries them 3 times before telling the customer there is a technical problem and to try again tomorrow. Separately, 6% of refund failures are backend timeouts that succeed on a second attempt. What should the tool return?",["A message instructing the agent never to retry process_refund, so that policy rejections stop looping and every refund failure is escalated to a human straight away","A shorter retry policy for the tool: one automatic retry for every failure, then an apology and a handoff to the escalate_to_human tool if the second attempt fails","isError plus an errorCategory, an isRetryable flag, and a description: business errors not retryable, with a customer-facing reason; transient ones retryable","isError set to false with the policy text in the result body, so the agent treats the rejection as a normal outcome and reads it out"],[2],"The agent cannot recover well because every failure looks the same. Structured metadata lets it act per category: a business-rule violation is not retryable and carries a customer-friendly explanation (refunds over the limit need approval), while a transient timeout is marked retryable.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D03","Your document-analysis subagent has two tools, analyze_content for web pages and analyze_document for uploaded PDFs. Two weeks ago you rewrote both descriptions with input formats, example queries, and a line on when to use each; misrouting fell from 31% to 19% and then stopped improving. In 17 of every 19 remaining misroutes, the coordinator's request contains the phrase 'analyze the content of'. The subagent's system prompt says: 'Whenever content needs analysis, start with your content analysis tool.' What is the most effective next step?",["Merge both tools into a single analyze tool that inspects the input type and then dispatches internally to the right logic","Put a lightweight classifier before the subagent that tags each request as web or PDF and rewrites its wording to match","Reword that system prompt line so it names no tool by keyword and leaves the routing to the two rewritten tool descriptions","Add four few-shot examples to the system prompt showing web pages routed to analyze_content and PDFs routed to analyze_document"],[2],"The descriptions are already good and the residue is concentrated on one phrase that matches a keyword-sensitive instruction in the system prompt. That instruction is overriding the descriptions.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D04","Your analysis subagent has one tool, analyze_document(document, instructions), used for three jobs: pulling statistics, summarizing, and checking whether a source supports a claim. The synthesis step validates each job's output against its own fixed schema, and 14% of claim checks break it because the tool returns free prose instead of a verdict. Its description is already two paragraphs long with examples for all 3 jobs. What is the best redesign?",["Add a mode parameter with three allowed values to analyze_document, and describe the output that each mode is expected to produce","Keep the tool and validate each claim-check result in the synthesis step, retrying with the parse error until a verdict comes back","Expand the description again with more claim-check examples, each one showing the exact verdict wording the parser expects","Split it into extract_data_points, summarize_content, and verify_claim_against_source, each with its own output contract"],[3],"A generic tool doing three jobs has no stable output contract, so better wording cannot make one of its outputs reliably structured.","blob/main/tutor/mock-d2.html","2026-11-02",1],[2,1,"mock-d2.html · D05","Your web-search subagent catches every exception and returns an empty result list with a success status. In 8% of research runs, the final report states that 'no published research exists' on a subtopic; logs show each of those was a search API timeout. Other subtopics genuinely return zero results and are reported correctly. What should the search subagent do?",["Retry the timeout itself; if it still fails, return an error marked transient with what was tried and any partial results, and keep true empty results as a success","Return a single uniform 'search failed' error for any problem, including empty results, so the coordinator never mistakes a failure for a real answer","Keep returning empty lists, and have the coordinator re-run every search that comes back with zero results, twice, before the synthesis agent is allowed to write the report","Keep retrying each timed-out search until it returns at least one result, so that the coordinator only ever receives non-empty and usable results"],[0],"Two things are wrong: a failure is disguised as a success, and the subagent doesn't attempt its own recovery. Transient failures should be retried locally; whatever still fails goes up as a structured error with what was tried and any partial results, while true empty results stay a success.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D06","Your document-analysis subagent has a general fetch_url tool so it can open the papers a source cites, about 40 times per run. In 7% of runs it also fetches news pages and blog posts, which then leak into the analysis as if they were primary documents. A teammate proposes removing the tool and having the coordinator fetch every cited paper instead. What is the best change?",["Remove fetch_url and route every cited-paper fetch through the coordinator, which already has web access and can decide each time what counts as a document","Keep fetch_url and add a system prompt instruction that the subagent must fetch only academic papers and must never open news sites or blog posts","Keep fetch_url and add a filter after each call that discards the fetched content if it does not look like a document before analysis starts","Replace fetch_url with a load_document tool that validates the target is a document from an accepted source before fetching it, and describe exactly what it accepts and rejects"],[3],"The subagent legitimately needs to open cited papers, often, so the capability stays; what is wrong is that the tool is generic.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D07","Your extraction service offers three schema tools, extract_invoice, extract_receipt, and extract_contract, and the document type is not known before the call. With tool_choice set to auto, 3% of responses are plain text such as 'This appears to be a receipt from a hardware store' and the downstream parser rejects them. The model picks the right tool whenever it does call one. What is the most reliable fix?",["Detect plain-text replies in the parser and re-send those requests with the error text until a tool call is returned","Force tool_choice to extract_invoice, since invoices are the most common type, and handle receipts and contracts in a follow-up turn","Set tool_choice to any, so the model must call one of the tools while still choosing which schema fits the document","Add a line to the system prompt saying the model must always respond by calling one of the three extraction tools, never with text"],[2],"auto permits a text reply; any requires a tool call but leaves the choice of tool to the model. The model already chooses correctly, so any closes the 3% gap without removing that choice.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D08","Your enrichment pipeline has extract_metadata, lookup_vendor, and classify_spend. lookup_vendor and classify_spend both need the vendor name and amounts that extract_metadata produces, but with tool_choice set to auto, 11% of runs call lookup_vendor first with a vendor name the model guessed. Wrong vendor matches then flow into 2 downstream reports. How should you configure the calls?",["Force tool_choice to extract_metadata on every turn, so that its fields are always present before any enrichment runs","Set tool_choice to any for every turn, so the model is required to call a tool before it writes any reply","Force extract_metadata on the first request, then handle lookup_vendor and classify_spend in follow-up turns","Add a numbered instruction to the system prompt: call extract_metadata first, then lookup_vendor, then finally classify_spend"],[2],"The prerequisite must be guaranteed to run first, which is what forced selection does. After that turn the metadata exists, and the dependent tools are handled in follow-up turns where the model can choose them.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D09","Your team added a code-intelligence MCP server to the project's .mcp.json; its tool search_code is symbol-aware, spans all 12 company repositories, and returns call sites with file paths. Its description reads 'Searches code.' In 80% of 'find all callers' requests the agent uses the built-in Grep instead and misses callers in other repositories. The server connects and its tools are listed. What should you change?",["Expose the repository index as an MCP resource the agent can browse to see the list of repositories before it decides which search tool to use","Deny the built-in Grep tool in project settings; search_code is then the only tool the agent can use for any code search","Expand the search_code description: symbol-aware, covers all 12 repositories, returns call sites with paths, and when to prefer it over Grep","Move the server into each developer's user-scope ~/.claude.json, where its tools load earlier in every session and are offered before Grep is"],[2],"Discovery works, so the issue is selection. With a two-word description, the model cannot tell the MCP tool is more capable than Grep. The guide's fix is to describe the MCP tool's capabilities and outputs in detail.","blob/main/tutor/mock-d2.html","2026-11-02",0],[2,1,"mock-d2.html · D10","An engineer asks the agent to find every caller of chargeCard in a legacy service with 3,000 files. Grep for 'chargeCard(' finds 6 call sites, but the module payments/index.ts re-exports the function under 2 other names, charge and legacyCharge, and production logs show far more traffic than 6 callers explain. Context budget is tight. What is the best approach?",["Read every file that imports from payments/index.ts and check each one by hand for calls that go through any of the aliased names","Grep for the broader pattern 'charge' across the whole service, which matches the original name and both aliases in a single search","Use Glob to list every TypeScript file in the service and Read each one in order, so that no indirect call made through any of the aliases is missed","Read payments/index.ts to list every name the function is exported under, then Grep for each of those names across the whole codebase"],[3],"Tracing through a wrapper module is a two-step pattern: first enumerate every exported name, then search for each name. It is complete and costs a handful of targeted searches rather than bulk reads.","blob/main/tutor/mock-d2.html","2026-11-02",0],[3,1,"mock-d23-paper2.html · P15","An engineer new to Spring wants Claude to explain each Spring annotation it adds, but only in the payroll repository. Their other 2 repositories are in Go, where the note is noise, and none of the 17 teammates should get it. They expect to want it for the next 3 months. Where should the instruction live?",["In a personal skill in ~/.claude/skills/, run when touching Spring code","In a CLAUDE.local.md at the payroll repository's root, kept out of git","In each session's opening prompt, naming the payroll repo as its scope","In their own ~/.claude/CLAUDE.md, which loads across their projects"],[1],"Ask who (just this engineer), where (this repository only) and when (every session, for months). Me × this project × every session is CLAUDE.local.md.","blob/main/tutor/mock-d23-paper2.html","2026-11-02",0],[3,1,"mock-d23-paper2.html · P16","In one engineer's sessions Claude keeps using field injection, which the team's committed CLAUDE.md forbids. The other 17 engineers on the same branch don't see this, and the engineer says they have the file. A teammate suggests they copy the rule into their CLAUDE.local.md as well. What should they do first?",["Run /memory in a session of theirs to see which memory files actually load","Rewrite the rule in capitals at the top of the CLAUDE.md, with 2 examples of it","Add a PostToolUse hook that rejects any edit that adds field injection back","Copy the rule into their CLAUDE.local.md, as the teammate suggests"],[0],"/memory shows which memory files a session has loaded. When behaviour differs between people on the same branch, check what's loaded before changing anything.","blob/main/tutor/mock-d23-paper2.html","2026-11-02",0],[3,1,"mock-d23-paper2.html · P17","The team's /rerun-payroll skill re-sends a pay run's bank file for a given date. Last week an engineer typed 'the March 14 pay run looks wrong, can you check it?', Claude judged the skill relevant and started it, and a reviewer stopped it 2 minutes before the file went to the bank. The team still wants the skill, started only when someone types /rerun-payroll. What should change?",["Set context: fork, which runs the skill in a separate subagent","Set disable-model-invocation: true in the skill's frontmatter","Add a CLAUDE.md line telling Claude not to start /rerun-payroll itself","Add allowed-tools to its frontmatter, limiting it to Read and Grep"],[1],"Skills load on demand: when someone invokes them, or when Claude judges them relevant. disable-model-invocation removes the second path, so the skill runs only when a person types the command.","blob/main/tutor/mock-d23-paper2.html","2026-11-02",0],[1,1,"mock-exam.html","A coordinator must run three independent research subagents. It emits one Task call, waits for the result, emits the next, and so on across three turns — and the run is painfully serial. What is the fix?",["Emit all three Task calls in a single coordinator response so they run in parallel","Give each subagent the coordinator's full conversation history to skip the waits","Replace the three subagents with one subagent that loops the three topics in turn","Raise the coordinator's max_tokens so it can hold all three results at once"],[0],"Parallel subagents come from multiple `Task` calls in ONE response — not spread across turns. Token limits and history-sharing don't address serialization; one looping subagent is still sequential.","blob/main/tutor/mock-exam.html","2026-11-02",0],[1,1,"mock-exam.html","A refund workflow must never issue a refund above $500 without human approval. The system prompt says so, yet a large refund occasionally slips through. Compliance needs this guaranteed. What do you do?",["Move the $500 rule to the top of the system prompt in capitalized, forceful language","Add a tool-call interception hook that blocks process_refund over $500 and routes to escalation","Lower the model's temperature so it follows the threshold rule more deterministically","Add few-shot transcripts showing large refunds always being escalated"],[1],"Prompts are probabilistic — non-zero failure rate. A rule that must NEVER be violated needs a deterministic hook that programmatically blocks the action.","blob/main/tutor/mock-exam.html","2026-11-02",0],[1,1,"mock-exam.html","A report meant to cover the whole 'creative industries' sector only discusses visual arts. Logs show every subagent executed its assigned query correctly. Where is the defect?",["The synthesis subagent dropped the non-visual-arts findings while aggregating","The subagents lacked the coordinator's conversation history to see full scope","The coordinator's decomposition — its subtask list never assigned the other sub-sectors","The search subagents' context windows truncated the broader results silently"],[2],"Subagents executing assignments correctly can't fix a bad assignment — check the coordinator's decomposition first. Narrow decomposition is the classic cause of incomplete coverage.","blob/main/tutor/mock-exam.html","2026-11-02",0],[4,1,"mock-exam.html","An automated review bot flags dozens of harmless style choices; developers now ignore all of its output, including real bugs. The prompt already says \"only report high-confidence issues.\" What is the most effective fix?",["Replace confidence filtering with explicit categories: report bugs and security, skip style and local patterns","Strengthen the instruction to report only findings the model is virtually certain about","Cap the review at a maximum of five reported findings per pull request","Add a second model pass that scores each finding and drops those below a threshold"],[0],"A model's self-assessed confidence isn't calibrated, so tightening it doesn't help. Categorical criteria (which classes to report and which to skip) are the fix; capping the count or adding a scoring pass still doesn't say what matters.","blob/main/tutor/mock-exam.html","2026-11-02",1],[4,1,"mock-exam.html","An extraction schema marks every field required, but many source documents genuinely lack a shipment tracking number — and the model keeps inventing plausible-looking tracking values. What is the correct schema fix?",["Make the tracking-number field nullable/optional so the model can return null when it's absent","Instruct the model in the prompt to write \"NOT PROVIDED\" whenever the field is missing","Keep it required and add a validator that rejects extractions with fabricated-looking values","Split documents into two pipelines — with and without tracking numbers — each with its own schema"],[0],"A required field for data that may not exist forces fabrication. Make it nullable so null is a legal answer. A sentinel string leaks into downstream data and still fights the required constraint, and a validator only catches fabrication after it happens.","blob/main/tutor/mock-exam.html","2026-11-02",1],[4,1,"mock-exam.html","Two workflows call Claude: a pre-merge check a developer waits on, and a nightly dependency-audit report read the next morning. Your manager wants both moved to the Message Batches API for the 50% savings. What do you recommend?",["Move both to the Batch API and add status polling so the pre-merge check finishes as soon as possible","Keep both synchronous, since batch results can arrive out of order and correlation becomes unreliable","Move only the nightly audit to the Batch API; keep the pre-merge check synchronous — batches have no latency SLA","Move both to the Batch API with a timeout that falls back to synchronous calls when a batch runs long"],[2],"Batch is 50% cheaper but takes up to 24 hours with no latency SLA, which is right for latency-tolerant overnight work and wrong for a blocking check a developer waits on. Polling doesn't create an SLA, and a timeout fallback just adds complexity; custom_id makes correlation reliable.","blob/main/tutor/mock-exam.html","2026-11-02",0],[1,1,"mock-final-sim.html · S01","The support agent for an e-bike retailer runs a loop that exits as soon as a response contains a text block. In 14% of sessions the model replies with 'Let me pull up that battery warranty for you' plus a tool_use block for lookup_order in the same response. Those sessions end with the customer seeing only the promise. The team's first idea is a prompt line telling the model not to narrate before tool calls. What should change?",["Keep looping while stop_reason is \"tool_use\", and exit only when it is \"end_turn\"","Exit only when the text block has no future-tense phrases such as 'let me' or 'I will check'","Keep the text-block exit but require 3 loop iterations before a session can end","Add a system-prompt line forbidding narration before tool calls, with two examples of it"],[0],"stop_reason is the loop's control signal: \"tool_use\" means execute the tool and send the result back, \"end_turn\" means finish.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S02","A developer's loop for the support agent sends each iteration as the system prompt plus the latest tool_result only. Logs from 300 sessions show the agent calling get_customer 4 to 6 times in a row for the same rider before giving up. Each call returns the same verified record. What is the most likely cause, and the fix?",["Turn on prompt caching for the system prompt to keep the earlier lookups available between calls","Append each tool_use and tool_result to the history, and send the full message list each time","Expand get_customer's description to say a verified record completes the identity step","Cap get_customer at 2 calls per session, after which the agent calls escalate_to_human"],[1],"The agentic loop works by appending each tool result to the conversation so the model can reason about the next action.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S03","The coordinator verifies the rider with get_customer and lookup_order, then spawns a warranty-claims subagent through the Task tool with the prompt 'Assess this battery warranty claim.' In 31% of runs the subagent reports it cannot tell which order or battery serial number the claim is about. The coordinator already holds the verified customer ID, order ID, serial number and purchase date. What change fixes this most directly?",["Pass the verified IDs, serial number and purchase date in the Task prompt as structured fields","Expand the subagent's system prompt with the full warranty policy and the fields a valid claim needs","Give the warranty subagent its own get_customer and lookup_order tools to repeat the verification itself","Configure the subagent's definition to inherit the coordinator's conversation memory on each call"],[0],"Subagents do not inherit the parent's context. Whatever they need must be passed explicitly in the Task prompt, and structured fields keep identifiers and metadata intact.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S04","An audit of 2,000 closed sessions finds that 9% ended with stop_reason \"end_turn\" after a message such as 'I'll check with the warehouse and get back to you.' None of those sessions issued a refund, created a return or called escalate_to_human, and no one followed up. Adding a line to the system prompt was tried last month and cut the rate from 11% to 9%. What should the team build?",["A stronger system-prompt rule, with examples of closing messages that resolve or escalate","A weekly report of unresolved sessions, reviewed by a team lead who contacts each rider","An orchestration-layer check on loop exit that escalates any session with no recorded resolution","A loop change that re-prompts after end_turn until the reply mentions a refund or a human"],[2],"Every session must end in a completed resolution or a human escalation however the loop terminates.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S05","When the agent escalates, the human team receives the note 'Customer needs help with a refund.' Human agents cannot see the chat transcript, and they spend an average of 7 minutes re-asking riders for details the agent had already confirmed. The escalate_to_human tool accepts a 2,000-character payload. What should the agent send?",["The last 2,000 characters of the transcript, which hold the most recent details of the case","A note asking the rider to restate the issue to the human, plus the agent's confidence score","A reason code from a fixed list plus the customer ID, for the human to look up the rest","A structured summary: customer ID, order ID, root cause, amounts, actions taken, next step"],[3],"Humans who lack the transcript need a structured handoff that carries the accumulated context, findings and recommended action. The guide's example lists customer ID, root cause, refund amount and recommended action.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S06","Changing the email address on an account requires that get_customer has first returned a verified customer ID. The system prompt states this rule in bold. Across 18,000 email-change requests last quarter, the agent called update_account before verification 41 times, and 3 accounts were taken over. What is the most effective change?",["Block update_account in code until get_customer has returned a verified ID in this session","Route email changes to escalate_to_human and remove update_account from the agent's own tools","Make update_account send a confirmation email to the old address after it changes the account","Move the verification rule to the top of the system prompt and add 3 examples of verifying first"],[0],"When a step must happen before another for security or money, programmatic prerequisites give a deterministic guarantee; prompt instructions are probabilistic.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S07","Orders placed before a platform migration come back from lookup_order with Unix timestamps, and newer orders come back with ISO 8601 dates. The return window is 30 days. The agent misjudged the window on 6% of older orders, approving some late returns and refusing some valid ones. What is the most reliable fix?",["A PreToolUse hook that rejects lookup_order calls for orders placed before the migration date","A system-prompt section on converting Unix timestamps, with two worked conversions","A PostToolUse hook that converts lookup_order dates to ISO 8601 before the model reads them","A rule that sends returns on pre-migration orders to escalate_to_human for a manual check"],[2],"PostToolUse hooks intercept tool results and can normalise heterogeneous formats, such as Unix timestamps and ISO 8601, before the agent processes them. That makes the comparison deterministic.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S11","The system prompt lists 12 rules for choosing between lookup_order, check_battery_recall and create_return. On clear requests the agent follows them. On ambiguous ones, such as 'my battery dies after 5 km, what now?', it picks differently from one session to the next, and 3 more rules added last month did not help. What is the most effective next step?",["Lower the temperature to 0 to make the agent give one tool choice per ambiguous request","Add a rule for each new ambiguous phrasing in the logs, ordered from most to least specific","Add 3 or 4 few-shot examples of ambiguous requests, each showing why one tool beat the others","Train a classifier on past tickets to choose the tool before the agent sees an ambiguous request"],[2],"Few-shot examples are the most effective way to show how to handle ambiguous cases. Targeted examples that explain why one action beat the plausible alternatives let the model generalize its judgment to new phrasings that more rules don't cover.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S16","The team's CLAUDE.md says 'Run gofmt and golangci-lint after editing any Go file.' Review of 120 sessions shows Claude ran them after 81% of Go edits, and unformatted code reached later edits in the other 19%. The team wants the check after every edit, whatever the model decides. What should they configure?",["The CLAUDE.md line rewritten in capitals at the top of the file, with an example of each command","A PostToolUse hook on Edit and Write that runs gofmt and golangci-lint on the changed file","A git pre-commit hook that formats and lints the staged Go files before each commit is created","A /lint-go slash command in .claude/commands/ that developers run after finishing a set of edits"],[1],"PostToolUse hooks run after every matching tool call regardless of what the model chooses, so formatting and linting happen deterministically after each file edit. Instructions in CLAUDE.md are followed only probabilistically.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S29","The review prompt asks Claude to rate each finding as critical, major or minor. The same unchecked error return in a Go handler was rated critical in one PR and minor in another, and 3 engineers disagree with about 35% of ratings. The prompt defines critical only as 'a serious issue.' What change gives the most consistent ratings?",["Tell Claude to assign critical only when it is highly confident the issue is serious","Run each review 3 times and keep the severity that appears most often per finding","Define each severity level with explicit criteria and a short Go code example of that level","Drop severity and post each finding at one level for the engineers to triage"],[2],"Explicit severity criteria with concrete code examples for each level achieve consistent classification. Vague definitions and confidence instructions do not.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S30","In one Claude Code session, a developer has Claude write a database migration for the stops table, then asks the same session to 'review your migration critically.' Production later showed 2 bugs the review had called correct, including a missing index the session had chosen to skip. The team wants a review step that catches this kind of issue. What should they use?",["The same session with extended thinking turned on for the review, after the code is written","The same session working through a 20-item migration checklist before it approves the code","A separate Claude instance, with none of the generating session's context, reviewing it","A second pass in the same session after /compact, seeing only a summary of the work"],[2],"A model that generated code retains its reasoning context and is less likely to question its own decisions.","blob/main/tutor/mock-final-sim.html","2026-11-02",1],[1,1,"mock-final-sim.html · S31","The productivity tool's coordinator sends every question through 4 subagents in order: a code mapper, a dependency tracer, a test finder and a doc writer. A question such as 'what does Appointment#reschedule return?' takes 95 seconds and about 60,000 tokens. Broad questions like 'how does billing touch scheduling?' do need all four. What should change?",["Run the 4 subagents in parallel instead of in order to cut the time each question takes overall","Split the tool into quick and deep modes, and ask the engineer to choose one before asking","Cache each subagent's last output to let repeat questions skip the slower stages","Have the coordinator assess each question and invoke only the subagents that question needs"],[3],"The coordinator should look at what each query needs and call only those subagents, instead of sending every query through the whole pipeline.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S32","To save round trips, the team let the dependency-tracer subagent send its results straight to the test-finder subagent, and the test finder message the doc writer. Since then, 3 incidents could not be traced, and one tracer error was silently dropped because the test finder had no error handling for it. Before the change, all results went through the coordinator. What should the team do?",["Add a shared log file that each subagent appends to, with a correlation ID for each request","Merge the tracer, test finder and doc writer into one large subagent to remove the hand-offs","Copy the same error-handling code into each subagent and keep the direct links between them","Route all subagent communication back through the coordinator, which handles the errors"],[3],"In hub-and-spoke orchestration the coordinator manages all inter-subagent communication, which gives observability, consistent error handling and controlled information flow.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S33","For the question 'where are we running N+1 queries?', the coordinator spawns 3 subagents, each told to 'search the codebase for N+1 queries.' Their reports overlap by about 60%, and the run costs about 3 times a single agent's tokens. The app has three main areas: models, controllers and background jobs. What change makes the most of the 3 subagents?",["Give each subagent a distinct area, models, controllers or jobs, stated as a boundary in its prompt","Use a single subagent for the whole search, as 3 copies of one task only repeat each other","Give each subagent a different model to make their searches take different paths","Have the synthesis step deduplicate the 3 reports before the coordinator returns the answer"],[0],"Partition the scope across subagents to minimise duplication, for example by giving each agent distinct subtopics or sources. The same task given to three agents produces overlapping work.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S34","To summarise 4 independent engines in the monolith, the coordinator issues one Task call per turn and waits for each subagent to finish before spawning the next. Each subagent takes about 50 seconds, and nothing in one summary depends on another. The full summary takes over 3 minutes. How should the coordinator spawn the subagents?",["Tell the coordinator in its prompt that the engines are independent and that it should spawn faster","Emit all 4 Task tool calls in one coordinator response to run the subagents in parallel","Send the 4 summary requests through the Message Batches API and collect results when ready","Give a single subagent all 4 engines in one prompt, which needs only one Task call"],[1],"To run subagents in parallel, the coordinator issues several Task calls in one response, not one per turn.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S35","Asked to find out why appointment reminders are sometimes sent twice, the agent follows a fixed 6-step plan: read the mailer, the job, the model, the scheduler, the config, then report. At step 2 it found that the job queue retries on timeout, but it carried on with the plan and its report blamed the mailer. This is an open-ended investigation. How should the task be decomposed?",["An adaptive plan that adds or reorders subtasks as findings appear, such as the retry","Each of the 6 steps run as a parallel subagent, with the reports merged at the very end","A fixed plan extended to 9 steps, with the queue retry settings added as step 3","A first step listing all possible causes, then a check of each in the order listed"],[0],"Open-ended investigation needs dynamic decomposition, with subtasks generated from what each step discovers. Fixed sequential pipelines suit predictable tasks and ignore intermediate findings.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S36","The team wants reference documentation for all 140 JSON endpoints. Every endpoint needs the same three steps: extract the route and parameters, describe the behaviour from the controller, and write one example request. A proposal suggests a coordinator that decides the steps for each endpoint as it goes. What decomposition fits best?",["A coordinator using dynamic decomposition to decide each endpoint's steps from its findings","A single prompt that documents all 140 endpoints in one response for a consistent house style","A fixed prompt chain per endpoint: extract the signature, describe it, write the example","One subagent per step, with the coordinator choosing at run time which steps each endpoint needs"],[2],"Prompt chaining, a fixed sequence of steps, suits predictable multi-step work. Dynamic decomposition is for open-ended tasks whose subtasks depend on discoveries.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S37","Yesterday an engineer ran a named session, noshow-audit, that analysed 40 files of the no-show penalty logic. Overnight, teammates changed 3 of those files, and the engineer knows which ones. The rest of yesterday's analysis is still valid. How should the engineer continue?",["Start a fresh session and have the agent re-explore the 40 files to rebuild the analysis","Resume noshow-audit and carry on, as the agent will notice the edits when it reads files","Fork noshow-audit and continue in the fork, with the original session left unchanged","Resume noshow-audit, name the 3 changed files, and ask the agent to re-analyse only those"],[3],"Resume a session when its prior context is mostly valid, and inform the agent of specific file changes for targeted re-analysis rather than full re-exploration.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim.html · S38","A session has spent 2 hours mapping how the scheduling engine uses its legacy calendar library. The team wants to compare two refactoring approaches, wrapping the library behind an adapter or replacing it outright, and both must start from that same analysis. Re-running the analysis would take another 2 hours. What should they do?",["Start two new sessions and paste the same one-paragraph summary of the analysis into each","Stay in the single session, trying the adapter first and then the replacement after it","Resume the session twice in two terminals, both approaches building on one history","Use fork_session to create two branches from the analysed session, one per approach"],[3],"fork_session creates independent branches from a shared analysis baseline, which is how to compare divergent approaches without repeating the shared work.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S49","After extraction, the model flags certificates whose results it judges 'unusual' for a chemist to check. Chemists dismiss 30% of flags, and two weeks ago the prompt added 'only flag results you are confident are problems,' which changed the rate by 1 point. Each certificate prints the specification range next to every measured value. What change best improves precision?",["Turn flagging off until a classifier trained on dismissed flags is ready to replace it","Strengthen the instruction to 'be very conservative and flag only clear, serious problems'","Have the model give a confidence score per flag and show chemists only those above 0.9","State the criterion: flag a result only when its value falls outside the range on that certificate"],[3],"Explicit categorical criteria improve precision; vague instructions such as 'be conservative' or 'only report high-confidence findings' do not. Here the certificate supplies an objective test.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S50","The batch_number field comes back null on 22% of certificates. Review shows the number is present in all of them, but some suppliers print it in a header table labelled 'Lot', others in a footer line, and others as 'Batch/Lot No.' The instructions describing these placements were rewritten twice without much change. What should the team try next?",["Add a fourth paragraph to the instructions that lists more labels the suppliers might print","Retry each null batch_number with the instruction 'look harder for the batch number'","Add few-shot examples showing correct batch_number extraction from each of the 3 layouts","Make batch_number a required field to force the model to return a value for each certificate"],[2],"Few-shot examples showing correct extraction from documents with varied formats address empty or null extraction of required information, and work where detailed instructions alone produce inconsistent results.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[4,1,"mock-final-sim.html · S51","The extractor asks for 'valid JSON only' in the prompt and parses the reply with JSON.parse. About 2.5% of replies fail to parse: some add a sentence after the object, others drop a closing brace on long certificates. Downstream systems need schema-compliant output every time. Which approach is most reliable?",["Strip the text before the first brace and after the last one before calling JSON.parse","Prefill the assistant turn with an opening brace to force the reply to start as a JSON object","Define an extraction tool whose input schema is the JSON schema, and read its tool_use input","Retry any reply that fails JSON.parse, sending the parse error back to the model"],[2],"Tool use with a JSON schema is the most reliable way to get schema-compliant structured output and eliminates JSON syntax errors. Prompt-based formatting and prefills are weaker.","blob/main/tutor/mock-final-sim.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M01","The agent's loop stops after 6 iterations whatever the model returned. In 11% of chats about refunds across several boxes, the loop is cut off while the last response still has stop_reason \"tool_use\", and the customer gets no answer at all. A teammate proposes raising the cap to 12. What change makes the loop end at the right point?",["Keep looping until a response has no text block, then return it","End the loop at the first response whose text reads like a final answer","Raise the cap to 12 iterations and log a warning when a chat reaches it","Run tools while stop_reason is \"tool_use\" and finish when it is \"end_turn\""],[3],"The loop's control signal is `stop_reason`: `\"tool_use\"` means run the requested tool and send the result back, `\"end_turn\"` means the model has finished. An arbitrary iteration cap as the main stopping rule is a named anti-pattern, and raising it only moves the problem.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M02","The first version of the agent hard-codes one sequence for every chat: get_customer, then lookup_order, then process_refund if the box is marked damaged. Customers who only want to skip next week's delivery still go through the refund check, and 18% of chats call a tool the request never needed. The agent has 7 tools and more are planned. Which design fits how an agentic loop is meant to work?",["Add a classifier step that picks one of 5 fixed scripts for each new request","Give the model the tools, let it pick each next call, and loop on stop_reason","Add a branch to the sequence per request type, keyed on words in the message","Keep the sequence and let the model answer 'skip' for steps it thinks unneeded"],[1],"In an agentic loop the model decides which tool to call next from the context, and the code loops on `stop_reason`. A pre-configured sequence or decision tree is the contrast the guide draws; it can't adapt to requests that need different tools.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M03","Billing disputes are meant to go to a billing subagent that has its own AgentDefinition, description and system prompt. In testing, the coordinator never spawns it: across 200 billing chats it answers from its own tools or says it cannot help, and no `Agent` calls appear in the logs. The coordinator's options list get_customer, lookup_order, process_refund and escalate_to_human in allowedTools, and `disallowedTools: [\"Agent\", \"WebSearch\"]` copied from an older template. What is the fix?",["Add a system-prompt rule telling the coordinator to delegate billing disputes","Add \"Agent\" to the tools listed in the billing subagent's AgentDefinition","Remove \"Agent\" from the coordinator's disallowedTools","Expand the billing subagent's description with 3 sample billing disputes"],[2],"Subagents are spawned through the `Agent` tool. Listing a tool in `disallowedTools` removes its definition from the request, so the coordinator can't see or call `Agent` and no description or prompt rule can make delegation happen. Removing it from the deny list restores delegation; adding it to the subagent's own tools does nothing for the coordinator.\nOlder material, incl. possibly the exam guide, calls this the Task tool.\nUpdated 2026-11-03: updated to current SDK: tool renamed Agent, and allowedTools doesn't gate availability, so the blocker is now a disallowedTools entry.\nExam-guide check 2026-11-03: the answer stands. The exam guide's version of this rule is that the coordinator needs \"Task\" (now Agent) listed in allowedTools; a disallowedTools entry removes it either way.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M04","Of 3,000 sessions closed last month, 7% ended with neither a recorded resolution nor an escalate_to_human call. Some hit max_tokens, some ended on \"end_turn\" after promising a follow-up, and some stopped when a tool threw an error the loop did not catch. The system prompt already says 'Resolve the issue or escalate before ending the chat.' Each of these sessions turned into a complaint about 2 days later. What should the team add?",["The same prompt line repeated at the end of the system prompt, in bold","A close_case tool the model is told to call as the last step of a chat","A nightly list of unresolved sessions for support leads to work through","Code around the loop that escalates a session left unresolved on exit"],[3],"The guarantee has to sit in the orchestration layer, outside the model: whatever ended the loop (max_tokens, end_turn, an uncaught tool error), code wrapped around it checks for a resolution or escalation and escalates if neither happened. Prompt rules and a close_case tool still depend on the model acting.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M05","When the agent escalates a billing dispute, the human team receives the last 3 messages of the chat and nothing else. Human agents cannot open the full transcript, and on 40% of escalations they ask the customer again for account details and what has already been refunded. In one case a $64 partial refund the agent had approved was issued a second time. What should the escalation pass to the human?",["The last 10 messages in place of 3, with the refund messages marked","A longer, friendlier summary paragraph written by the agent in prose","A link the human can use to rerun the agent's tool calls for the case","Customer ID, issue, root cause, amounts refunded, recommended action"],[3],"Humans who cannot see the transcript need a structured handoff: customer details, root cause, what has been done (amounts refunded) and the recommended action. That preserves the context and authorization state the agent built up.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M06","Policy says a subscription can be paused for more than 4 weeks only after get_customer confirms the account has no unpaid balance. The system prompt states this rule with 2 examples, yet audits find 3% of long pauses were applied to accounts in arrears. Each one costs about $90 in fees that are never collected. What change enforces the rule?",["Move the rule to the top of the system prompt and add 4 more arrears examples","Add a PostToolUse hook that reverses a long pause if the balance is unpaid","Have update_subscription add a warning to its result when a balance is unpaid","Add a PreToolUse hook that blocks long pauses until a clear balance is confirmed"],[3],"A business rule with money at stake needs deterministic enforcement. A hook that intercepts the update_subscription call can check that get_customer returned a clear balance and block the call otherwise.","blob/main/tutor/mock-final-sim2.html","2026-11-02",1],[1,1,"mock-final-sim2.html · M07","lookup_order returns delivery dates as ISO 8601 strings, while the courier's MCP tool track_box returns Unix timestamps and numeric status codes such as 3 and 7. In 9% of 'where is my box?' chats, the agent misreads a code or compares the two dates wrongly and tells the customer the box is late. track_box belongs to the courier, takes only a box ID, and cannot be changed. What is the most reliable fix?",["A PostToolUse hook that turns track_box results into ISO dates and named statuses","A table in the system prompt mapping each status code, plus rules for timestamps","A PreToolUse hook that rewrites track_box calls to request ISO dates","A request to the courier to return ISO dates and named statuses in its next API"],[0],"A PostToolUse hook intercepts tool results before the model sees them, so it can normalize Unix timestamps and numeric codes into the same format lookup_order uses. The conversion then happens in code, every time.","blob/main/tutor/mock-final-sim2.html","2026-11-02",1],[1,1,"mock-final-sim2.html · M16","The project CLAUDE.md tells Claude to run the affected unit tests after editing any file in services/. In 40 sessions last week Claude skipped the tests in 13, and 4 of those changes broke the build in CI. Moving the line to the top of CLAUDE.md and putting it in bold changed nothing. What makes the tests run after each edit?",["A PostToolUse hook on Edit and Write that runs the affected unit tests","A PreToolUse hook on Edit and Write that runs the unit tests first","A rule in .claude/rules/ with paths: [\"services/**/*\"] repeating the line","A pre-push git hook that runs the full test suite before code is pushed"],[0],"A PostToolUse hook runs after every file edit whether or not the model remembers. CLAUDE.md is guidance the model may skip, as the 13 of 40 sessions show; the hook makes the test run independent of instruction-following.","blob/main/tutor/mock-final-sim2.html","2026-11-02",1],[1,1,"mock-final-sim2.html · M31","The coordinator sends every request through 5 subagents in order: explorer, dependency tracer, test finder, doc writer and reviewer. For one-line questions such as 'which class reads the fare table?', a run takes 4 minutes and costs about 20 times a single agent call. About 70% of requests are questions like that. What should change?",["Run all 5 subagents in parallel instead of in sequence","Have the coordinator pick only the subagents a request needs","Add a flag users set to skip the doc writer and reviewer","Replace the 5 subagents with 1 agent holding all their tools"],[1],"The coordinator should analyse each request and dynamically choose which subagents to invoke, instead of always routing through the full pipeline. A one-line lookup needs the explorer, not five agents.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M32","For 'document the refund flow end to end', the doc writer's draft skips refunds issued at ticket machines, because the explorer was never asked about the machine code. The coordinator accepts the first draft it gets. Reviewers find a gap like this in 35% of end-to-end documents. What should the coordinator do?",["Run the doc writer twice and merge the 2 drafts into one document","Ask the doc writer to list any gaps at the end of the draft for human reviewers","Check the draft for gaps, query the explorer again, rerun the writer","Tell the explorer to read every file under src/ before any drafting starts"],[2],"An iterative refinement loop has the coordinator evaluate the output for gaps, re-delegate targeted queries (here, the ticket-machine code) and re-invoke the writer until coverage is enough.","blob/main/tutor/mock-final-sim2.html","2026-11-02",0],[1,1,"mock-final-sim2.html · M33","For 'find every place fares are calculated', the coordinator spawns 3 explorer subagents with the same prompt. Their reports overlap by about 80%, and together they still miss the night-fare code in the scheduling module. The monolith has 3 top-level modules: ticketing, scheduling and reporting. What should the coordinator do differently?",["Let the explorers share a list of files the others have read","Assign each explorer one module: ticketi
