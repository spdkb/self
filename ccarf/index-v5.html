[hidden]{display:none!important}*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0}

const DATA={"SRCS":[{"name":"utkarsh1agarwal/claude-architect-exam-guide","url":"https://github.com/utkarsh1agarwal/claude-architect-exam-guide","lic":"MIT","copy":"© 2026 Claude Architect Exam Guide Contributors"},{"name":"AidenHiew/ccar-f-claude-architect-mock-exams","url":"https://github.com/AidenHiew/ccar-f-claude-architect-mock-exams","lic":"MIT","copy":"© 2026 the CCA-exam-prep authors"},{"name":"mattzimak/claude-cert-coach","url":"https://github.com/mattzimak/claude-cert-coach","lic":"MIT","copy":"© 2026 Matt Zimak"}],"QS":[[1,0,"Mock exam 1 · Q1","Your resolution agent occasionally calls `process_refund` before `get_customer` has returned a verified identity, even though the system prompt says identity verification is mandatory first. What is the most reliable fix?",["Lower the model's temperature","Rewrite the system prompt in bold, capitalized text","Add a programmatic prerequisite that blocks `process_refund` until `get_customer` returns a verified ID","Add five few-shot examples showing correct ordering"],[2],"Deterministic ordering guarantees for high-stakes operations (money, identity) need programmatic enforcement, not stronger prompt wording.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q2","`get_account_status` and `get_account_details` have nearly identical one-line descriptions. The agent frequently calls the wrong one for billing questions. What's the most effective first step?",["Force `tool_choice` to a single named tool","Add a keyword pre-router in front of the agent","Merge the two tools into one","Expand both descriptions with input formats, example queries, and explicit \"use this vs. that\" boundaries"],[3],"Tool description quality is the primary, lowest-effort lever for fixing tool-selection confusion.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q3","A lookup for \"Utkarsh Agarwal\" returns three matching customer records. What should the agent do?",["Ask the customer for an additional identifier (email, order number, zip code)","Pick the account with the most orders","Process the request against all three accounts and let the customer confirm afterward","Pick the most recently active account"],[0],"Multiple ambiguous matches should never be resolved heuristically; ask for another identifier to disambiguate safely.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[1,0,"Mock exam 1 · Q5","A case is escalated to a human agent who cannot see the prior conversation. The handoff contains only a ticket number and the words \"customer upset.\" What's missing?",["A sentiment classification score","A structured summary: customer details, root cause, recommended action","The full unedited transcript","A timestamp of when escalation occurred"],[1],"A structured handoff (customer details, root cause, recommended action) lets a human act without re-investigating from zero; a sentiment score or bare transcript don't solve that gap.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[1,0,"Mock exam 1 · Q6","Your team wants to block any refund over $500 from being auto-approved, regardless of what the model decides. What's the most reliable mechanism?",["A system prompt clause stating the $500 limit","A pre-call tool-interception hook that blocks `process_refund` above $500 and redirects to escalation","A few-shot example showing a refund being denied at $501","Reducing `max_tokens` so large numbers can't be generated"],[1],"A pre-call tool-interception hook gives a deterministic guarantee.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[1,0,"Mock exam 1 · Q7","Multiple heterogeneous MCP tools return dates in different formats (Unix timestamps, ISO-8601, and localized strings). This is causing the agent to misinterpret order age. What's the best fix?",["A `PostToolUse` hook that normalizes all date formats before the model sees them","A system prompt instructing the model to \"convert dates carefully\"","Removing date fields from tool responses entirely","Asking the customer to always state dates in ISO-8601 format"],[0],"A `PostToolUse` hook normalizes heterogeneous data formats before the model reasons over them — a hook problem, not a prompting problem.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[1,0,"Mock exam 1 · Q8","A customer has two unrelated concerns in one message: a billing dispute and a shipping delay. What's the best approach?",["Escalate immediately since multi-concern messages are inherently too complex","Address only the first concern mentioned and ask the customer to submit the second separately","Pick whichever concern seems more urgent and ignore the other","Decompose into distinct concerns, investigate each with shared context, then synthesize one unified response"],[3],"Multi-concern requests should be decomposed into distinct items, investigated with shared context, then synthesized into one unified response.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q9","Your team currently escalates cases when the model's self-reported confidence score falls below 6/10. First-contact resolution remains far below target, with easy cases escalated and hard cases handled autonomously. What's wrong with this design?",["Confidence scores should be averaged over the whole conversation, not per-turn","The threshold should instead be based on the number of tool calls made","The threshold is set too high and should be lowered","Self-reported confidence is poorly calibrated — the model is often confidently wrong on exactly the hardest cases"],[3],"Self-reported model confidence is a poorly calibrated proxy for actual case complexity; it fails precisely on the hardest cases, which is what's happening here.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q10","An MCP tool returns `{\"isError\": true, \"message\": \"Operation failed\"}` for every kind of failure — timeouts, invalid input, and policy violations alike. What's the problem, and the fix?",["Replace `isError` with an HTTP status code instead","No problem; `isError: true` is sufficient signal","Log the error server-side only, since the agent doesn't need to see it","The agent can't distinguish retryable from non-retryable failures; add `errorCategory` and `isRetryable` fields"],[3],"Generic error responses hide information the agent needs to react correctly.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q11","A new engineer joins the team and doesn't seem to follow the team's established code style, even though it's documented. Investigation shows the conventions live in `~/.claude/CLAUDE.md` on the tech lead's machine. What's the fix?",["Ask the new engineer to manually copy the file","Add the conventions to the README instead","Move the conventions to a project-level `CLAUDE.md` committed to the repo","Repeat the conventions verbally in stand-up each day"],[2],"User-level `CLAUDE.md` files are personal and not shared via version control.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q12","Testing conventions need to apply to every `*.test.tsx` file in a large monorepo, regardless of which directory it lives in. What's the most maintainable approach?",["One giant root `CLAUDE.md` with a \"Testing\" section","A skill that must be manually invoked before writing any test","A `CLAUDE.md` file in every directory containing tests","A `.claude/rules/testing.md` file with `paths: [\"**/*.test.tsx\"]` frontmatter"],[3],"Glob-scoped `.claude/rules/` apply based on file path pattern, independent of directory — exactly the \"convention tied to file type, not location\" problem.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q14","A task involves restructuring a monolithic service into 3 microservices, touching 50+ files, with multiple valid ways to draw service boundaries. What's the right approach?",["Direct execution, refining the boundary as you go","Plan mode, to explore and design boundaries before committing to changes","A single, extremely detailed upfront prompt specifying every file change","Direct execution, switching to plan mode only if something unexpected comes up"],[1],"Multi-file architectural decisions with several valid approaches are exactly plan mode's use case — explore and design before committing.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q15","A developer asks Claude to \"clean up this data transformation function,\" and across three attempts, the definition of \"cleaned up\" varies each time (sometimes renaming variables, sometimes restructuring logic, sometimes both). What's the most effective fix?",["Request five attempts and pick the best one manually","Repeat the same instruction more forcefully","Lower `max_tokens`","Provide 2–3 concrete before/after examples that pin down what \"cleaned up\" means here"],[3],"Inconsistent interpretation of a prose instruction is fixed with concrete before/after examples, not stronger wording.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q17","Before implementing a rate-limiting layer in an unfamiliar service, a developer wants Claude to first surface design questions (burst handling, per-user vs. global limits, failure behavior) rather than jump straight to code. What technique fits best?",["Prompt chaining","Direct execution with a longer prompt","The interview pattern","Test-driven iteration"],[2],"The interview pattern surfaces design considerations before implementation — well-suited to unfamiliar domains where not every consideration has been anticipated.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q20","A developer is unsure whether to use `.claude/rules/` or a subdirectory `CLAUDE.md` for a convention that applies to all files under `src/api/`. Which favors `.claude/rules/`?",["The convention needs to apply based on file path patterns that might extend beyond one directory in the future","The convention is short enough to fit in one line","There's no meaningful difference between the two options","The convention only ever applies within that one directory"],[0],"`.claude/rules/` with glob `paths` scales to conventions that might extend across directories; a subdirectory `CLAUDE.md` is bound to one location.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[1,0,"Mock exam 1 · Q21","A coordinator decomposes \"renewable energy policy trends\" into three subtasks, all focused on solar policy in a single country. Each subagent executes its assigned task correctly, but the final report is extremely narrow. Where's the defect?",["The web search agent's query construction","The synthesis agent's summarization quality","The document analysis agent's relevance filtering","The coordinator's task decomposition"],[3],"Every subagent executed correctly; the narrow coverage comes from how the coordinator decomposed the topic in the first place.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[1,0,"Mock exam 1 · Q22","Which statement about subagent context is correct?",["Subagents inherit context if invoked within the same API call","Subagents require context to be explicitly included in their invocation prompt","Subagents share memory across invocations by default","Subagents automatically inherit the coordinator's full conversation history"],[1],"Subagents do not automatically inherit context; it must be explicitly included in their invocation prompt.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[1,0,"Mock exam 1 · Q23","A coordinator needs both a web search subagent and a document analysis subagent to run concurrently rather than one after another. How should the coordinator invoke them?",["Multiple Task tool calls emitted in a single coordinator response","Sequential invocation is the only supported pattern","One combined subagent that does both jobs","Two separate Task tool calls made in two separate coordinator turns"],[0],"Emitting multiple Task tool calls in a single coordinator response runs subagents concurrently rather than sequentially.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q25","The synthesis subagent needs to verify simple facts (dates, names, statistics) very frequently — 85% of verification needs are simple, 15% require deep investigation. Routing every check through the coordinator adds significant latency. What's the best fix?",["Batch all verifications to run at the very end of the pipeline","Remove verification entirely to save time","Give the synthesis agent full access to all search tools","Give the synthesis agent one scoped `verify_fact` tool for the common case; keep coordinator routing for complex cases"],[3],"Giving the synthesis agent one scoped tool for the common, simple case follows least privilege and avoids unnecessary coordinator round-trips. The rare complex case still routes through the coordinator. Full search access invites misuse, and batching or dropping verification hurts quality.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q26","Two credible sources report different figures for the same statistic. What should the synthesis output do?",["Preserve both values with source attribution and flag the discrepancy","Average the two figures","Omit the statistic entirely","Use whichever source is more recent, silently"],[0],"Conflicting credible sources should be preserved with attribution and flagged, never silently reconciled by picking or averaging one value.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q27","A subagent's findings are passed to the synthesis agent as a single block of unstructured prose, and the final report loses track of which claim came from which source. What's the fix?",["Reduce the number of subagents to avoid attribution complexity","Require subagents to output structured claim-source mappings (claim, excerpt, source, date) that synthesis preserves","Have the synthesis agent guess the most likely source based on writing style","Have the coordinator manually re-attribute claims after the fact"],[1],"Structured claim-source mappings preserve provenance through synthesis; unstructured prose loses which claim came from which source.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[1,0,"Mock exam 1 · Q28","A coordinator built with the Agent SDK has subagents defined in `agents`, but its `allowedTools` list does not include `\"Agent\"` (and nothing removes it via `disallowedTools`). What happens when it tries to delegate to a subagent?",["It cannot spawn subagents at all","It works normally: `allowedTools` only auto-approves listed tools, and the `Agent` tool doesn't need approval to run","It falls back to a built-in tool automatically","It spawns subagents but without passing context"],[0],"Per the official CCA-F exam guide, the coordinator spawns subagents through the `Task` tool (renamed `Agent` in current Claude Code), and `\"Task\"` must be listed in the coordinator's `allowedTools`. Without it, the coordinator cannot spawn subagents. The current SDK docs also say to include the Agent tool in `allowedTools` so subagent calls are auto-approved.\nExam-guide check 2026-11-03: answer changed back to the exam-guide answer. Product details have shifted since the guide was written, but the exam is scored against the guide.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q29","After a subagent crash mid-run, the coordinator needs to resume without losing prior progress. What's the recommended pattern?",["Restart the entire pipeline from scratch every time","Manually re-type a summary of progress into the next prompt","Each agent exports state to a known location; the coordinator loads a manifest on resume and re-injects it","Rely on the model's memory of the prior session"],[2],"Structured state exports plus a coordinator-loaded manifest on resume is the recommended crash-recovery pattern.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q30","A report needs to include findings from sources published a decade apart, describing what appear to be conflicting figures. What should the synthesis output require to avoid misinterpreting a genuine trend as a contradiction?",["Publication or data-collection dates on each finding","A confidence score attached to the more recent figure only","Removal of the older sources entirely","A single averaged figure across all sources"],[0],"Publication/collection dates let genuine change over time be distinguished from an apparent contradiction between sources.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q33","A connected MCP server exposes a `trace_dependencies` tool that's meaningfully more capable than manually chaining `Grep` and `Read`, but the agent keeps using `Grep` instead. What's the most likely cause?",["MCP tools are always deprioritized versus built-ins and this can't be changed","The MCP tool's description doesn't make a strong enough case for its capability relative to the familiar built-in","The MCP server is misconfigured at the network level","`Grep` needs to be removed from the tool list entirely"],[1],"A thin MCP tool description loses to a familiar built-in by default; enhancing the description (not removing the built-in) is the fix.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[2,0,"Mock exam 1 · Q34","An `Edit` call fails because the anchor text it's trying to match appears more than once in the file. What's the reliable fallback?",["Use `Grep` to force a unique match","Use `Read` to load the full file, then `Write` the corrected version","Retry `Edit` with the exact same input","Skip the edit and ask the user to do it manually"],[1],"When `Edit`'s anchor text isn't unique, `Read` + `Write` is the reliable fallback for a full-file rewrite.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q35","A productivity agent needs credentials for a shared, team-wide MCP server, and the token must never be committed to git. Where should this be configured?",["Directly inside `CLAUDE.md`","`~/.claude.json` with the token hardcoded","`.mcp.json` with `${TOKEN_NAME}` environment variable expansion","A comment at the top of the relevant source file"],[2],"Project-scoped `.mcp.json` with environment-variable expansion keeps credentials out of version control while remaining shared team config.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q36","A developer wants a personal, experimental MCP server that only they use, without affecting teammates. Where should it be configured?",["`.claude/rules/`","`.mcp.json` in the repo","A shared team wiki page","`~/.claude.json`"],[3],"`~/.claude.json` is the user-scoped location for personal/experimental servers.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q37","After several hours of exploring a large, unfamiliar codebase, Claude starts giving vague answers about \"typical patterns\" instead of referencing the specific classes it found earlier. What's the most direct fix?",["Restart with no context","Maintain a scratchpad file recording key findings for the agent to reference","Switch to a different model mid-session","Increase `max_tokens`"],[1],"A scratchpad file persisting key findings counters context degradation in long exploration sessions.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[2,0,"Mock exam 1 · Q38","A developer wants to build understanding of an unfamiliar codebase efficiently, without reading every file upfront. What's the recommended exploration pattern?",["Use `Bash` to `cat` the entire repo into one context block","Start with `Grep` to find entry points, then `Read` to follow imports and trace flow","Ask the user to describe the codebase verbally instead of exploring it","Use `Read` on every file in the repository first"],[1],"Starting with `Grep` for entry points, then `Read` to follow imports, builds understanding incrementally without reading everything upfront.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q39","A generic tool named `process_data` is used for three very different jobs: extracting data points, summarizing content, and verifying claims — and the agent frequently uses it incorrectly. After improving the description doesn't fully resolve the confusion, what's the next step on the fix ladder?",["Remove the tool entirely","Add ten few-shot examples immediately, skipping other options","Rename it without changing its scope","Split `process_data` into purpose-specific tools: `extract_data_points`, `summarize_content`, `verify_claim`"],[3],"Splitting an overly generic tool into purpose-specific tools is the next rung on the fix ladder once description improvements alone haven't fully resolved confusion.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[2,0,"Mock exam 1 · Q40","A team wants to give a productivity agent both `Read`/`Write`/`Bash` and 15 additional MCP tools for various integrations, all available at once. Recent logs show increasing tool misuse. What's the likely cause and fix?",["Too many available tools increases decision complexity and misuse risk; scope tools per task/role instead","`Bash` should be removed since it's the most dangerous tool","The model needs a larger context window","The system prompt needs to list all 18 tools more explicitly"],[0],"Too many available tools increases selection complexity and misuse; scoping tools per task/role is the fix, not a bigger context window or removing a single tool.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q42","You want automated PR review findings posted as machine-parseable inline comments. What CLI options should you use?",["`--print` alone is sufficient","`--verbose` and `--debug`","`--output-format json` combined with `--json-schema`","`--format text`"],[2],"`--output-format json` with `--json-schema` produces machine-parseable structured findings suitable for automated PR comments.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[3,0,"Mock exam 1 · Q43","The same Claude Code session that generated a bug fix is also used to review that fix before merge, and subtle logic issues are consistently missed. Why?",["The context window is too small","The same session retains its generation reasoning, making it less likely to challenge its own prior decisions","`--output-format json` wasn't set","The model needs more few-shot examples of \"good reviews\""],[1],"A session that generated code retains its own reasoning and is less likely to challenge its own decisions; an independent instance reviews more effectively.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[3,0,"Mock exam 1 · Q45","A team wants Claude Code's automated review to avoid duplicate comments across re-runs after new commits are pushed to a PR. What should be included in context on re-runs?",["Nothing — each run should be fully independent","The full git history of the repository","The prior review's findings, with instructions to report only new or still-unaddressed issues","A count of how many times the PR has been reviewed"],[2],"Including prior findings and instructing the model to report only new/unaddressed issues avoids duplicate PR comments across re-runs.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q51","An extraction pipeline using `tool_use` with a strict JSON schema never produces malformed JSON, but sometimes produces line items that don't sum to the stated total. What does this indicate, and what's the fix?",["The schema itself is broken; add more `required` fields","Switch away from `tool_use` to plain text JSON","Reduce `max_tokens` to force shorter output","This is a semantic error, not a syntax error; add a `calculated_total` field to compare against `stated_total`"],[3],"`tool_use` with a schema eliminates syntax errors but not semantic ones; comparing a calculated total against the stated total catches this class of mismatch.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q54","A retry is needed because a nested array of line items was incorrectly flattened into a single string on the first extraction attempt. What should the retry prompt include?",["Nothing further — the model should self-correct silently","The original document, the failed extraction, and the specific validation error describing the flattening problem","A completely different, unrelated example document","Only a repeated instruction to \"format correctly this time\""],[1],"This is a structural, retry-fixable error — the retry needs the specific validation error to correct against.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q56","An extraction pipeline reports 97% overall field accuracy. A stakeholder wants to reduce human review before fully trusting this number. What should happen first?",["Stop measuring accuracy since it's already high enough","Round the accuracy up to 100% for reporting purposes","Validate accuracy broken down by document type and field, since aggregate accuracy can mask segment-level failure","Immediately reduce human review across the board, since 97% is high"],[2],"Aggregate accuracy can mask segment-level failure; validating by document type and field is required before reducing review.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[5,0,"Mock exam 1 · Q57","You want to catch novel extraction error patterns that wouldn't normally be reviewed, since your review process currently only samples low-confidence extractions. What should you add?",["A rule to never review high-confidence extractions","Stratified random sampling of high-confidence extractions","A fixed weekly quota of 10 reviews regardless of confidence","Removing confidence scoring entirely"],[1],"Stratified random sampling of high-confidence extractions is specifically designed to catch novel error patterns that a confidence-based review process would otherwise never see.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q59","An extraction schema needs to categorize expenses, but the fixed set of categories won't cover every real-world case that will eventually appear. What schema design pattern handles this best?",["A required `category` string field with no constraints","A free-text field parsed later with regular expressions","An `enum` field with a defined set of categories plus an `\"other\"` value and a `category_detail` string field","Omitting the category field entirely"],[2],"An `enum` plus `\"other\"` and a detail string handles extensibility without over-fitting to a fixed list or silently misclassifying novel cases.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",0],[4,0,"Mock exam 1 · Q60","After several extraction pipeline iterations, the team wants to systematically analyze which document patterns most often trigger validation errors or get dismissed as false positives by downstream reviewers. What should be added to each structured finding?",["A random UUID per finding","A `detected_pattern` field describing what triggered the finding","A free-text comment box with no structure","Nothing — this requires a separate ML model to analyze"],[1],"A `detected_pattern` field enables systematic, aggregate analysis of which patterns trigger errors or get dismissed as false positives over time.","blob/main/mock-exam/exam-1-answers.md","2026-07-25",1],[5,0,"Mock exam 2 · Q1","Your support agent has tools `get_customer`, `lookup_order`, `process_refund`, and `escalate_to_human`. A customer says \"I want to speak to a manager right now\" partway through a routine return. What should the agent do?",["Escalate immediately, without attempting further investigation","Ask one clarifying question to see if the issue can still be resolved","Continue investigating the return since it's already 80% resolved","Offer a discount to de-escalate before considering a transfer"],[0],"An explicit request to escalate must be honored immediately, without further investigation, since customer-requested escalation overrides progress-based reasoning.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q2","`lookup_order` returns three possible matches for the identifiers provided. What is the correct handling?",["Select the order with the highest dollar value, since it's likely the one in dispute","Ask the customer for an additional identifier to disambiguate","Select the most recently placed order","Process against all three and let the customer confirm afterward"],[1],"Multiple ambiguous matches should never be resolved by a heuristic guess like recency or dollar value; the safe move is asking for one more identifier to disambiguate.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q3","A refund-authorization hook blocks `process_refund` for amounts over $500 and redirects to `escalate_to_human`. An engineer proposes removing the hook and instead adding \"never approve refunds over $500 without escalation\" to the system prompt, arguing it's simpler to maintain. What is the main risk?",["The system prompt has a hard character limit that would be exceeded","Removing the hook would violate the MCP specification","Prompt instructions have a non-zero failure rate; the guarantee becomes probabilistic instead of deterministic","None — a clear instruction is just as reliable as a hook"],[2],"Prompt instructions carry a non-zero, probabilistic failure rate, so removing the hook trades a deterministic $500 threshold guarantee for something the model can occasionally ignore.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q4","A customer's message covers two unrelated concerns: a billing dispute and a shipping delay. What is the best decomposition strategy?",["Decompose into the two distinct items, investigate each using shared context, then synthesize one unified response","Escalate immediately since multi-concern messages are inherently too complex","Ask the customer to restate their message as two separate, single-issue messages","Resolve only the first concern mentioned and ask the customer to open a second ticket for the other"],[0],"Decompose the message into its two distinct concerns, investigate each using the shared customer context, then synthesize one unified response. Escalating, asking the customer to split the message, or answering only one concern all leave the customer worse off.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q5","When escalating a case the agent cannot resolve, what should the handoff to the human agent include?",["Just the customer's most recent message, since the human can read the full transcript","A confidence score representing how hard the case is","A structured summary: customer details, root cause analysis, and a recommended action","Only the customer ID, so the human starts the investigation fresh"],[2],"Since the human has no transcript access, the handoff must substitute for that missing context with customer details, root-cause analysis, and a recommended action.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q6","`get_customer` and `lookup_order` are frequently confused by the model when a customer says \"check on order #12345.\" Descriptions are minimal (\"Retrieves customer information\" / \"Retrieves order details\"). What should you try first?",["Merge the two tools into one generic `lookup` tool","Build a keyword pre-router that inspects the message before the model sees it","Add 8–10 few-shot examples of correct routing","Expand each description with input formats, example queries, and explicit \"use this vs. that\" boundaries"],[3],"Description quality is always the lowest-effort, highest-leverage first fix for tool-selection confusion — before few-shot examples or structural changes.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q11","Which best describes why a programmatic prerequisite (blocking `process_refund` until `get_customer` returns a verified ID) is preferred over prompt wording for identity verification?",["It provides a deterministic guarantee instead of relying on probabilistic model compliance","It's the only way to satisfy MCP's `isError` requirement","It is required by the Message Batches API","It reduces the number of tokens used per turn"],[0],"A hard prerequisite gives a deterministic guarantee that refunds can never fire before identity is verified, whereas any prompt-based rule is only probabilistically followed.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[5,0,"Mock exam 2 · Q12","The written policy allows price matching only against the company's own past sales. A customer asks for a price match against a competitor — a case the policy doesn't address either way. What should the agent do?",["Escalate, since the policy is silent/ambiguous on this specific request","Approve the request, since it wasn't explicitly denied","Offer a partial discount as a compromise","Deny the request, since it wasn't explicitly permitted"],[0],"Silence in policy is treated the same as ambiguity: escalate rather than let the agent invent a resolution either way.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q13","Which is the correct interpretation of a `PostToolUse` hook's role, given `lookup_order` returns Unix timestamps and `get_customer` returns ISO 8601 dates?",["It's used to route the request to a different subagent","It's used to normalize the two different date formats into one consistent format before the model reasons over them","It's used to cache results across sessions","It's used to block a tool call before it executes"],[1],"A PostToolUse hook runs after a tool returns and before the model sees the result, so it is the right place to normalize mixed formats (Unix timestamps vs. ISO 8601) into one consistent format. Blocking a call before it runs is a PreToolUse job; routing and caching are not what this hook is for.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[1,0,"Mock exam 2 · Q16","A coordinator delegates to a web-search subagent and a document-analysis subagent. For the coordinator to invoke either one, what must be true?",["The coordinator must run in plan mode","The subagents must be defined (e.g. in the `agents` option) and the `Agent` tool must not be removed from the coordinator via `disallowedTools`","The subagents must be configured with `context: fork`","Both subagents must share the coordinator's full conversation history automatically"],[1],"The subagents must be defined (`agents` / AgentDefinition), and the coordinator must be able to call the subagent-spawning tool. The exam guide says this means listing `\"Task\"` (now `Agent`) in the coordinator's `allowedTools`; removing it via `disallowedTools` blocks delegation entirely. Plan mode, `context: fork` and shared history are not prerequisites, and subagents start with fresh context.\nExam-guide check 2026-11-03: explanation aligned with the exam guide (Task must be in allowedTools).","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q17","All subagents in a research pipeline complete successfully and report no errors, yet the final report covers only 30% of the requested topic. Where should you look first?",["The coordinator's task decomposition logs","The document-analysis subagent's summarization fidelity","The web-search subagent's result ranking","The synthesis subagent's writing quality"],[0],"When every subagent succeeds at its assigned slice but overall coverage is narrow, the defect lives upstream in what the coordinator chose to assign, not in how well any one subagent did its job. Check the decomposition first.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q18","The synthesis subagent needs the findings gathered by the web-search and document-analysis subagents. What must happen for it to have that information?",["The coordinator must explicitly include the complete findings in the synthesis subagent's prompt","Nothing — subagents automatically share a session-scoped memory pool","The synthesis subagent must call `fork_session` to inherit prior context","The findings are inherited automatically as long as all subagents share the same `AgentDefinition`"],[0],"Subagents don't automatically inherit the coordinator's history, so the findings must be written explicitly into the synthesis subagent's prompt. There is no automatic memory pool, `fork_session` branches a session rather than passing findings, and sharing an AgentDefinition shares configuration, not context.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q23","A statistic in one subagent's findings comes from a report published two years ago, while another subagent's finding on the same metric is from last month. Synthesis treats these as contradictory. What was missing from the subagents' structured output?",["An `errorCategory` field","A `confidence` field","Publication or data-collection dates, which would show this is a change over time rather than a contradiction","A `retryable` boolean"],[2],"Without publication or data-collection dates, synthesis cannot tell a genuine change over time from a contradiction between two sources measuring the same thing at the same time. Dates let it read the two figures as a trend.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q25","A coordinator decomposes \"impact of remote work on urban commercial real estate\" into three subtasks: \"office vacancy rates downtown,\" \"office vacancy rates in suburbs,\" and \"office leasing trends.\" The resulting report never touches retail or residential conversion angles. What is the root cause?",["The coordinator's task decomposition was too narrow, missing entire relevant sub-domains of the topic","The web-search subagent didn't search broadly enough","The synthesis subagent lacked writing guidance on breadth","The document-analysis subagent filtered out irrelevant sources"],[0],"All three subtasks are narrow slices of the same angle (vacancy and leasing), so no subagent was ever asked to look at retail or residential conversion. The gap starts in the decomposition, not in how the subagents searched, filtered or wrote.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[1,0,"Mock exam 2 · Q26","After reviewing a first-pass synthesis output, the coordinator identifies that the \"counterarguments\" section is thin. What is the appropriate next action, consistent with iterative refinement of multi-agent research?",["Publish the report as-is; thoroughness is the synthesis agent's sole responsibility","Lower the temperature and regenerate synthesis from the same inputs","Ask the user to manually supply counterarguments","Re-delegate to search/analysis subagents with targeted follow-up queries, then re-invoke synthesis"],[3],"A thin section reflects missing evidence, not bad prose, so the fix is to gather more findings with targeted follow-up delegation and then re-run synthesis. Regenerating from the same inputs can't add evidence that was never collected, and pushing the work to the user or publishing as-is skips the refinement loop.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[1,0,"Mock exam 2 · Q27","Which best distinguishes a subagent's isolated context from the coordinator's context?",["Subagents inherit context only during the first invocation of a session","Subagents share the coordinator's memory but not its tool access","Subagents inherit context if and only if they use the same underlying model","Subagents do not automatically inherit the coordinator's conversation history; relevant context must be explicitly passed in"],[3],"Isolation is the default behavior; relevant context must be explicitly passed in, not automatically shared via memory or matched via model identity.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q28","A research pipeline crashes mid-run due to an infrastructure failure. What design allows the coordinator to resume cleanly?",["Restarting from scratch and re-running every subagent regardless of prior progress","Keeping all state only in the coordinator's in-memory variables","Relying on the model to recall its own prior progress from training data","Each agent exporting state to a known location; the coordinator loads a manifest on resume and re-injects it"],[3],"Externalized per-agent state plus a coordinator-read manifest is what makes a clean resume possible after an infrastructure crash. In-memory state dies with the process, the model can't recall a run from training data, and a blind full restart throws away completed work.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q29","The synthesis subagent is given tools for web search, document parsing, and fact verification \"just in case it needs them for edge cases.\" What risk does this create?",["It has no real downside since unused tools cost nothing","Agents with tools outside their specialization tend to misuse them (e.g., a synthesis agent attempting its own web searches)","It will always outperform a narrowly-scoped agent","It requires `fork_session` to function correctly"],[1],"Tools outside an agent's specialization invite misuse, such as a synthesis agent running its own web searches. 'Unused tools cost nothing' ignores exactly that risk. Scope each agent's tools to its role.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q31","A developer wants to find every file that calls a specific exported function across a large codebase. Which built-in tool is the right starting point?",["`Grep`, since it searches file contents for the function name","`Bash` with no specific command needed","`Read`, applied to every file in the repo","`Glob`, since it searches by pattern"],[0],"Grep searches file contents for the function name, which is exactly what's needed to find every call site; Glob only matches file paths/names, not the code inside them.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q32","A developer wants to locate every test file in a monorepo matching `**/*.test.tsx` regardless of directory. Which tool is correct?",["`Edit`","`Grep`","`Glob`","`Write`"],[2],"Glob does file-path pattern matching, which is precisely suited to a glob pattern like `**/*.test.tsx`; Grep searches file contents, not paths.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[2,0,"Mock exam 2 · Q33","`Edit` repeatedly fails on a file because the anchor text it's trying to match appears multiple times. What is the recommended fallback?",["Switch to `Bash` with `sed` exclusively","Use `Read` to load the full file, then `Write` the corrected full content","Split the file into smaller files first","Increase `max_tokens` and retry `Edit`"],[1],"When an anchor string isn't unique, Edit can't reliably target the right occurrence, so loading the full file with Read and rewriting it with Write avoids the ambiguity. sed, splitting the file or raising max_tokens don't address the cause.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q36","A developer wants a \"codebase exploration\" skill whose verbose dependency-tracing output shouldn't clutter the main conversation. Which SKILL.md frontmatter option addresses this?",["`paths`","`argument-hint`","`context: fork`","`allowed-tools`"],[2],"`context: fork` runs the skill in an isolated sub-agent context, so its verbose dependency-tracing output never fills the main conversation. `allowed-tools` controls tool access, `argument-hint` is autocomplete text, and `paths` belongs to `.claude/rules/` files.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q39","A monorepo has React, API, and database-model layers, each with different conventions, plus test files scattered throughout every layer. What is the most maintainable way to apply testing conventions specifically, regardless of file location?",["Put a \"Testing\" section in the root CLAUDE.md and hope Claude infers when it applies","A `.claude/rules/testing.md` file with `paths: [\"**/*.test.*\"]` frontmatter","Add a CLAUDE.md to every directory that happens to contain a test file","A skill that must be manually invoked before writing any test"],[1],"`.claude/rules/*.md` files with `paths` frontmatter apply conventions by glob pattern regardless of directory, which fits test files scattered across layers. Per-directory CLAUDE.md files duplicate content, a root section relies on inference, and a manual skill depends on someone remembering to run it.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q41","A developer is debugging a single failing test with a clear stack trace pointing to one function. What's the appropriate mode?",["Plan mode, to explore alternative architectures first","Fork the session to explore two different fixes in parallel","Direct execution, since the change is small and well-understood","Escalate to a second Claude instance for independent review before touching any code"],[2],"A clear stack trace pointing to one function is a well-understood, single-file fix, which is exactly when direct execution is appropriate. Plan mode, forking or an extra reviewer up front would be needless overhead.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[3,0,"Mock exam 2 · Q43","Before implementing a caching layer in an unfamiliar part of the codebase, a developer wants Claude to surface considerations they might not have thought of — invalidation strategy, failure modes, TTL choices — before writing any code. What technique does this describe?",["The interview pattern — having Claude ask clarifying questions before implementation","Test-driven iteration","Prompt chaining","Plan mode is not applicable here since this is a single feature, not an architecture-wide task"],[0],"The interview pattern, where Claude surfaces open design questions before implementing, is designed for this kind of unfamiliar-domain uncertainty. Test-driven iteration needs known expected behavior, and prompt chaining is a fixed multi-step pipeline, not a way to discover requirements.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q44","A code-review request surfaces three findings that interact with each other (fixing one changes the correct fix for another). What's the better way to communicate them to Claude?",["Ask Claude to pick which one to fix first","Provide all three interacting issues together in a single detailed message","Fix them one at a time in separate messages, waiting for each fix before mentioning the next","Ignore the interactions and let Claude discover them on its own"],[1],"Because the three findings interact (fixing one changes the correct fix for another), they should be given together in one detailed message. Fixing them one at a time risks rework when a later fix invalidates an earlier one; sequential messages suit independent issues.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 2 · Q45","A team is restructuring a monolith into microservices — changes will span 45+ files, and there are multiple valid ways to draw service boundaries. What's the correct approach, and which subagent helps avoid exhausting context during the investigation phase?",["Plan mode to explore and decide on an approach first, using the Explore subagent to isolate verbose discovery output","Direct execution with an extremely long, fully-detailed upfront prompt describing every service boundary","Direct execution; no subagent is needed since this is primarily a refactor","Plan mode, but skip subagents entirely to keep everything in one context"],[0],"Dozens of files with several valid service-boundary designs is squarely plan mode's use case, and the Explore subagent isolates the noisy discovery phase so it doesn't use up the main session's context. Direct execution or a giant upfront prompt skips the design step.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q48","You have three extraction schemas (invoice, receipt, contract) and don't know in advance which document type will arrive, but you want to guarantee some structured extraction occurs. Which `tool_choice` setting is correct?",["Omitting `tool_choice`","`\"auto\"`","`\"any\"`","`{\"type\": \"tool\", \"name\": \"extract_invoice\"}`"],[2],"`\"any\"` forces the model to call some tool (guaranteeing structured output) while still letting it pick which of the three schemas fits the incoming document.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q49","An extraction validated against a JSON schema fails because a required field, `vendor_tax_id`, is missing. On investigation, the source document never contained a tax ID anywhere. What should happen next?",["Retry the extraction with the same prompt; retries usually resolve missing-field errors","Fabricate a placeholder value so the schema validates","Recognize that retrying is unlikely to help since the information is genuinely absent from the source; the field should have been optional","Increase `max_tokens` and retry"],[2],"Since the tax ID is confirmed absent from the source document, no retry can produce data that was never there. Accept the gap and make the field optional (nullable) going forward; fabricating a placeholder or raising max_tokens doesn't help.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q51","A finding-tracking system for a review pipeline adds a `detected_pattern` field to every flagged issue. What is this field's purpose?",["To select which `tool_choice` mode to use next","To store the model's confidence score","To determine `isRetryable` status","To enable systematic analysis of which code constructs trigger findings, useful for spotting false-positive patterns developers repeatedly dismiss"],[3],"Tagging findings with `detected_pattern` turns individual fixes into aggregate data, so you can see which constructs developers repeatedly dismiss as false positives and refine the criteria for them.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q52","A code-review prompt already says \"only report high-confidence findings,\" yet developers report 40% of flagged issues in the \"style consistency\" category are false positives. What's the most effective next step?",["Add \"be even more conservative\" to the prompt","Permanently remove the category so it never generates findings again","Lower the model's temperature setting","Define explicit, categorical criteria for what specifically counts as a style issue vs. what doesn't, and consider temporarily disabling the category while iterating"],[3],"'Only report high-confidence findings' is already a vague instruction, and 40% false positives shows it doesn't work. The fix is explicit categorical criteria for what counts as a style issue, with the option to disable the category temporarily while iterating. Removing it permanently loses value, and temperature doesn't change the criteria.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q53","Few-shot examples are added to help a model select between two visually similar tools in ambiguous cases. What makes few-shot effective here, beyond simply showing input/output pairs?",["Few-shot examples eliminate the need for good tool descriptions entirely","Few-shot examples are only useful for formatting, not for judgment calls","Showing the reasoning for why one tool was chosen over a plausible alternative helps the model generalize judgment to novel, unseen cases","Few-shot examples work only because they increase total prompt length"],[2],"Showing the reasoning behind choosing one tool over a plausible-but-wrong alternative teaches the underlying judgment, so the model generalizes to new ambiguous cases rather than just copying the examples. Few-shot examples complement good descriptions; they don't replace them.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q54","Your organization wants to move two workloads to the Message Batches API for its 50% cost savings: (a) an overnight technical-debt report and (b) a blocking pre-merge security gate that developers actively wait on. What's the correct call?",["Batch both workloads","Batch only the overnight report; keep the pre-merge gate on synchronous calls","Batch both, with a real-time fallback triggered if the batch takes too long","Keep both synchronous, since batch correlation via `custom_id` is too error-prone"],[1],"The overnight report is latency-tolerant and fits batch processing (up to 24 hours, no latency SLA, 50% cheaper). A pre-merge gate that developers are waiting on needs synchronous calls, and a timeout fallback doesn't turn batch into a real-time service.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[4,0,"Mock exam 2 · Q55","A batch submission of 200 documents returns some failures. What's the correct remediation approach?",["Resubmit the entire batch of 200 documents from scratch","Switch failed documents to a completely different extraction schema","Discard the failed documents permanently since batch jobs cannot be retried","Identify the failed documents by `custom_id`, and resubmit only those, adjusting for the specific cause (e.g., chunking oversized documents)"],[3],"Batch failures should be triaged individually via `custom_id`, with the specific cause addressed (e.g., splitting an oversized document) before resubmitting just those items.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[5,0,"Mock exam 2 · Q56","An extraction system reports 97% aggregate accuracy across all processed documents. A stakeholder asks whether this is sufficient to reduce human review. What should you check before answering?",["Whether the model used `tool_choice: \"auto\"` or `\"any\"`","Only the accuracy of the single most common document type","Nothing further — 97% aggregate accuracy is sufficient on its own","Accuracy broken down by document type and by field, since aggregate metrics can mask poor performance on specific segments"],[3],"A 97% aggregate can mask a document type or field with much worse accuracy, so the honest answer requires breaking the metric down before making a review-reduction call.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",1],[5,0,"Mock exam 2 · Q57","To catch novel extraction error patterns that wouldn't normally be caught by reviewing low-confidence outputs, what technique should be applied to high-confidence extractions?",["Skip reviewing them entirely, since they're already high-confidence","Apply a stricter required-fields schema only to high-confidence cases","Stratified random sampling of high-confidence extractions for ongoing error-rate measurement","Re-run the same extraction twice and average the two outputs"],[2],"Low-confidence outputs already get reviewed, so novel error patterns hiding in high-confidence outputs are only caught by proactively sampling them. Stratified random sampling of high-confidence extractions gives an ongoing error-rate measurement.","blob/main/mock-exam/exam-2-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q5","A team is deciding between a single-file bug fix (clear stack trace, one obvious cause) and a cross-service authentication redesign (multiple valid approaches, dozens of files). Which pairing is correct?",["Direct execution for the bug fix; plan mode for the authentication redesign","Plan mode for both, since plan mode is always safer","Direct execution for both, since Claude Code doesn't meaningfully benefit from planning","Plan mode for the bug fix; direct execution for the redesign"],[0],"A single-file bug fix with a clear stack trace is the well-understood, low-ambiguity case that suits direct execution. A cross-service redesign with multiple valid approaches and dozens of files is what plan mode is for.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[3,0,"Mock exam 3 · Q6","A `/deploy-check` slash command should run the team's pre-deployment checklist and be available to every developer immediately after cloning the repo. Where should it live?",["`.claude/commands/deploy-check.md` in the repository","A `.claude/config.json` commands array","`~/.claude/commands/deploy-check.md`","Inside the root `CLAUDE.md` file as a named section"],[0],"A command every developer needs immediately after cloning must be version-controlled and project-scoped, which is exactly what `.claude/commands/deploy-check.md` provides.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[3,0,"Mock exam 3 · Q8","Two engineers on the same team have different personal preferences for commit-message style, but the team's actual required conventions live correctly in the project-level CLAUDE.md. One engineer also has their personal preferences saved in `~/.claude/CLAUDE.md`. What's true about this setup?",["Only one CLAUDE.md file can be active per repository","It's broken — user-level and project-level CLAUDE.md files cannot coexist","The user-level file will silently overwrite the project-level file for everyone","It's fine — the user-level file applies only to that engineer and doesn't affect teammates via version control"],[3],"User-level and project-level CLAUDE.md files are designed to coexist and stack. The personal file at `~/.claude/CLAUDE.md` is never checked into version control, so it only affects that engineer; the team's conventions in the project file still apply to everyone.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q9","A large monorepo has different testing conventions for unit tests, integration tests, and end-to-end tests, each identifiable by filename pattern but scattered across many directories. What's the best way to load the right convention automatically based on which file is being edited?",["One root CLAUDE.md with three sections and hope Claude infers the right one","Three separate directory-level CLAUDE.md files, duplicated into every directory containing tests","Three separate skills that must be manually invoked before editing each test type","Three separate `.claude/rules/*.md` files, each with `paths` frontmatter matching the relevant filename pattern"],[3],"Because each convention is tied to a filename pattern rather than one directory, three `.claude/rules/*.md` files with `paths` frontmatter load automatically based on which file is being edited. Duplicated directory files, a single root file or manual skills are all harder to maintain.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q10","A developer wants to compare two different caching strategies starting from the same point in their investigation of a codebase, without redoing the initial exploration twice. What capability supports this?",["`/compact` run twice","`--resume` with two different session names created independently","Restarting from scratch for each strategy","`fork_session`, branching two parallel explorations from the shared baseline"],[3],"`fork_session` is built for exactly this: branching two parallel explorations from a shared baseline so the initial investigation isn't redone.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q11","A developer resumes a two-day-old session to continue a refactor, but teammates modified several of the files Claude had already analyzed in that session. Claude's suggestions reference outdated function signatures. What should have been done?",["Started an entirely new session with zero context","Increased `max_tokens` for the resumed session","Informed the resumed session explicitly about which files changed, prompting targeted re-analysis","Used `fork_session` instead of `--resume`"],[2],"Resuming a session doesn't make Claude aware that files changed since last time; the fix is explicitly telling it which files changed so it can do targeted re-analysis.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q12","A skill for generating boilerplate files should never be allowed to run destructive shell commands, even accidentally. Which frontmatter field enforces this restriction directly?",["`argument-hint`","`context: fork`","`disallowed-tools`","`allowed-tools`"],[3],"The exam guide's answer: restrict a skill's tools with `allowed-tools` in SKILL.md frontmatter. `argument-hint` is only autocomplete text, and `context: fork` isolates context, not tool access. (Newer Claude Code docs describe `allowed-tools` as a pre-approval list and add a separate `disallowed-tools` field, but the exam follows the guide.)\nExam-guide check 2026-11-03: answer changed from disallowed-tools to allowed-tools to match the exam guide.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[2,0,"Mock exam 3 · Q13","A developer needs to trace how a specific exported utility function is used across a codebase, including through re-export wrapper modules with different names. What's the most effective approach?",["`Glob` for `**/*.ts` and manually scan the output","First identify all exported names for the function (including wrapper re-exports), then `Grep` for each name across the codebase","Ask the user to supply the call sites manually","`Read` every file in the repository upfront to build full context before searching"],[1],"Wrapper re-exports mean the function may be called under several names, so enumerate every exported name first and then Grep for each one across the codebase. Grepping only the original name misses aliased callers, and bulk-reading every file wastes context.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q14","During a long exploration session tracing a legacy codebase's dependency graph, Claude starts giving vague answers referencing \"typical patterns\" instead of the specific classes it examined 90 minutes earlier. What's the most direct fix?",["Restart with zero context and re-explore from scratch","Switch to a different underlying model mid-session","Have the agent maintain a scratchpad file recording key findings, and reference it for subsequent questions","Increase `max_tokens` on each subsequent call"],[2],"Vague 'typical patterns' answers after 90 minutes of exploration are a sign of context degradation, not a capacity problem. A scratchpad file that records specific findings (class names, file paths) gives the agent something concrete to re-read for later questions.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q15","A task requires exploring an unfamiliar codebase's structure without exhausting the main session's context on verbose file-by-file discovery output. Which capability is designed for this?",["`context: fork` applied to CLAUDE.md","`fork_session`","The Explore subagent","`/memory`"],[2],"The Explore subagent isolates verbose file-by-file discovery output during structure-mapping tasks, so the main session's context isn't exhausted by exploration noise.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q18","A CI pipeline re-runs code review after each new commit to a PR, and developers complain about receiving duplicate comments for issues already flagged (and already acknowledged as \"won't fix\") in the previous run. What should change?",["Switch to `--output-format json` only, without changing the prompt","Include prior review findings in context on re-runs, and instruct Claude to report only new or still-unaddressed issues","Disable review entirely after the first commit","Nothing — duplicate comments are unavoidable with automated review"],[1],"Feeding prior review findings (including ones already acknowledged as 'won't fix') into context, with an instruction to report only new or still-unaddressed issues, fixes the root cause: each run currently has no memory of what was already raised.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q19","A CI-triggered test-generation step keeps suggesting test cases that duplicate scenarios already covered in the existing test suite. What's the most direct fix?",["Provide the existing test files in context so generation avoids already-covered scenarios","Run test generation twice and manually deduplicate","Switch to a different CI runner","Increase the model's `max_tokens` for test generation"],[0],"Providing the existing test files in context directly closes the information gap causing redundant suggestions — the model simply can't avoid duplicating coverage it can't see.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q22","A 14-file PR review produces contradictory findings — a pattern flagged as a bug in one file and approved as fine in another file within the same PR. What's the best structural fix?",["Split the review into focused per-file passes for local issues, plus a separate cross-file integration pass","Ask developers to manually pre-split the PR into under-4-file chunks","Require three full-PR passes and keep majority-vote findings","Use a model with a larger context window and re-run as a single pass"],[0],"Splitting the review into focused per-file passes for local issues plus a separate cross-file integration pass fixes the attention dilution that produces contradictory findings across a large PR. A bigger context window or majority voting doesn't remove the dilution.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q23","A team wants to move their nightly automated code-review job for `main` (no human waiting on results) to reduce API costs. Which approach fits, and why?",["Message Batches API is inappropriate here since it lacks multi-turn tool calling","Keep it fully synchronous, since batch jobs cannot run unattended","Batch it, but only if a real-time SLA under one hour can be guaranteed","Message Batches API — it's non-blocking and latency-tolerant, well suited to overnight jobs, at 50% lower cost"],[3],"An unattended overnight job with no one waiting on results is exactly the non-blocking, latency-tolerant case the Message Batches API is built for, at roughly 50% lower cost.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q24","Developers report that automated review flags a specific pattern as a \"style\" issue 40% of the time incorrectly, eroding trust in the tool overall — including in categories that are actually accurate. What should be done?",["Turn off all automated review categories permanently","Nothing; false positives in one category don't affect trust in others","Add \"please be more careful\" to the prompt","Define explicit criteria for that category and consider temporarily disabling it while iterating, to protect trust in the accurate categories"],[3],"A 40%-false-positive category erodes trust even in the accurate categories, so define explicit criteria for it and consider disabling it temporarily while iterating. Turning off everything loses the good categories, and 'be more careful' is too vague to change behavior.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[4,0,"Mock exam 3 · Q25","A CI review prompt currently says \"flag anything that seems off.\" What change would most reduce false positives?",["Lower the sampling temperature to 0","Replace the vague instruction with specific, categorical criteria (e.g., \"flag a comment only when claimed behavior contradicts actual code behavior\")","Add \"only flag things you're very confident about\"","Require unanimous agreement from three separate runs before flagging anything"],[1],"Replacing 'flag anything that seems off' with specific, categorical criteria (for example, flag a comment only when its claimed behavior contradicts the code) is what reduces false positives. Temperature, 'only flag if confident' and voting don't tell the model what to report.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q26","A CI pipeline needs Claude to generate a PR summary, then a set of suggested reviewers, then a risk score — as three separate, dependent steps where each step's output feeds the next. Which pattern best matches this?",["Parallel subagent spawning via the Task tool","Prompt chaining — a fixed sequential pipeline of well-understood, ordered steps","Dynamic/adaptive decomposition, since the steps are open-ended","`fork_session` to branch each step independently"],[1],"Three fixed, ordered, well-understood steps where each output feeds the next is the textbook case for prompt chaining. Adaptive decomposition is for open-ended tasks, and parallel spawning or forking doesn't fit dependent steps.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[3,0,"Mock exam 3 · Q27","Which CLI flag is specifically intended to prevent a CI job from hanging on interactive prompts?",["`-p` / `--print`","`--resume`","`--json-schema`","`--output-format`"],[0],"`-p` / `--print` is the non-interactive mode flag that stops a CI job hanging on input. `--output-format` and `--json-schema` control output format, and `--resume` continues a session.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[4,0,"Mock exam 3 · Q28","A batch code-review job covering 500 files returns partial failures. What's the correct remediation?",["Identify failures by `custom_id` and resubmit only those, adjusting for the specific failure cause","Resubmit the entire batch of 500 files","Discard failed files permanently, since batches can't be retried","Switch the entire job to synchronous calls going forward"],[0],"Batch requests correlate to responses via `custom_id`, so failures can be precisely identified and only those resubmitted with an adjustment for the specific cause.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q31","Production logs show the agent skips `get_customer` in 15% of cases when the customer volunteers their name, occasionally leading to an incorrect account being modified. What is the most reliable fix?",["Add few-shot examples showing correct verification order","Strengthen the system prompt's wording around verification being \"mandatory\"","Add a programmatic prerequisite that blocks `lookup_order`/`process_refund` until `get_customer` returns a verified ID","Build a routing classifier to detect which tools are relevant per request"],[2],"This is the classic verify-before-refund case: probabilistic fixes (better wording, few-shot examples) still leave a non-zero failure rate on a task with financial consequences. A programmatic prerequisite gives a deterministic guarantee.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[2,0,"Mock exam 3 · Q32","A support agent has tools `get_customer` and `lookup_order` with minimal descriptions, and misroutes order-status questions to `get_customer`. What should be tried first, before adding few-shot examples or restructuring tools?",["Merge the tools into one generic tool","Expand both descriptions with input formats, example queries, and explicit boundaries distinguishing the two","Build a pre-processing keyword router","Force `tool_choice` to always select `lookup_order`"],[1],"Tool description quality is the primary, lowest-effort lever for tool-selection accuracy and should always be tried before few-shot examples, routing layers, or restructuring.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q33","A `PostToolUse` hook is used to convert `lookup_order`'s Unix timestamps and `get_customer`'s ISO 8601 dates into one consistent format before the model reasons about them. What category of problem does this solve?",["Tool selection ambiguity","Data-format inconsistency across tools feeding into the model's context","Batch request correlation","Escalation calibration"],[1],"Normalizing heterogeneous timestamp and date formats with a PostToolUse hook is a data-format consistency fix, so the model reasons over clean, comparable values instead of converting mixed formats itself.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q34","A refund-processing hook blocks any `process_refund` call above $500 and redirects to `escalate_to_human`. Which statement correctly characterizes this design choice?",["It only works if paired with the Message Batches API","It provides deterministic, guaranteed enforcement of a business rule that a prompt alone cannot guarantee","It should be replaced by a confidence-score threshold instead","It's unnecessary since the system prompt already states the $500 limit"],[1],"A pre-call hook that blocks and redirects above a dollar threshold enforces the rule deterministically, independent of model behavior. A system prompt or a confidence-score threshold can only make compliance likely, not guaranteed.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[1,0,"Mock exam 3 · Q35","A multi-issue customer message (a billing dispute and a delivery delay) is handled by resolving only the first-mentioned issue and silently dropping the second. What's the correct decomposition approach instead?",["Randomly pick which issue to address based on severity keywords","Decompose into the distinct items, investigate each with shared context, then synthesize one unified resolution covering both","Escalate immediately since multi-issue messages are too complex","Ask the customer to resend their message with only one issue at a time"],[1],"Multi-issue requests need decomposition into distinct items, investigation of each with shared context, then one synthesized resolution covering all of them. Dropping an issue, escalating by default or making the customer resend each one are all worse outcomes.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[1,0,"Mock exam 3 · Q37","When escalating a case to a human agent who has no access to the conversation transcript, what should the structured handoff include?",["Just a one-line description of the customer's mood","Customer details, root cause analysis, and a recommended action","Only the ticket's timestamp","The full raw conversation log, unformatted, with no summary"],[1],"Since the human has no transcript access, the handoff must substitute for that missing context: customer details, root cause, and a recommended action.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[2,0,"Mock exam 3 · Q39","A `lookup_order` call fails due to a backend timeout. Which response correctly distinguishes this from a valid empty result?",["Return a generic \"no data\" string","Return `isError: true` with `errorCategory: \"transient\"`, `isRetryable: true`, and a description of what was attempted","Return an empty array and mark the call successful","Silently retry forever without informing the coordinator/caller"],[1],"A backend timeout is an access failure, not a valid empty result, so it must be reported with `isError: true`, a `transient` category, `isRetryable: true` and context on what was attempted. Returning an empty array or 'no data' makes the caller think nothing exists, and silent endless retries hide the failure.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q40","First-contact resolution sits at 55% against an 80% target; logs show the agent escalates simple, well-evidenced cases while attempting to autonomously resolve cases that actually require policy exceptions. What's the most effective fix?",["Explicit escalation criteria with few-shot examples distinguishing escalate-vs-resolve cases","Sentiment-based escalation","Self-reported confidence-score routing","A separately trained ML classifier on historical tickets"],[0],"Escalating easy cases while autonomously handling cases that need policy exceptions is a criteria-calibration problem. Explicit escalate-vs-resolve criteria with few-shot examples fix it; sentiment and self-reported confidence are unreliable proxies, and a separate classifier is heavier than needed.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",0],[5,0,"Mock exam 3 · Q41","A 20-turn support conversation is progressively summarized, and a specific dollar amount and order number mentioned early on are lost from the summary by turn 18, causing the agent to ask the customer to repeat themselves. What's the direct fix?",["Increase the context window size","Disable summarization for the whole conversation","Maintain a persistent \"case facts\" block (amount, order ID, dates) that rides along outside the summarized narrative","Ask the customer to restate key facts every turn as a matter of policy"],[2],"A persistent case-facts block for hard data (amounts, order IDs, dates) that rides outside the summarized narrative stops progressive summarization from dropping the numbers the case depends on. A bigger context window or no summarization only delays the problem.","blob/main/mock-exam/exam-3-answers.md","2026-07-25",1],[5,0,"Mock exam 3 · Q43","Which best describes the risk of using self-reported model confidence scores as the primary escalation trigger?",["Confidence scores can't be produced without `context: fork`","Confidence scores require the Message Batches API","Self-reported confidence is often poorly calibrated — the model can be confidently wrong precisely on the hardest cases","Confidence scores are computationally expensive to generate"],[2],"Self-reported confidence is poorly calibrated: models can be confidently wrong on exactly the hardest, most nuanced cases. That is why t
